<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المكتبة التكنولوجية - الهندسة</title>
    
    <!-- علامة إثبات ملكية Google -->
    <meta name="google-site-verification" content="google2c77a00de3dcc499" />

    <!-- Tailwind CSS (للتصميم) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons (للأيقونات) -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- CSS مخصص (التأثيرات والخطوط) -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap');
        
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #FDFBF7;
            margin: 0;
            padding: 0;
        }

        .animate-fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        .animate-blob { animation: blob 7s infinite; }
        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .animation-delay-2000 { animation-delay: 2s; }
        
        /* إخفاء شريط التمرير للمحادثة لجمالية أفضل */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-gray-900">

    <!-- الحاوية الرئيسية -->
    <div id="app-root"></div>

    <!-- JavaScript (منطق التطبيق) -->
    <script>
        const apiKey = ""; 
        
        const callGemini = async (prompt) => {
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        systemInstruction: { parts: [{ text: "أنت مساعد ذكي ولطيف لطلاب الهندسة في المكتبة التكنولوجية. تجيب باللغة العربية بشكل منسق ومختصر ومفيد." }] }
                    })
                });
                if (!response.ok) throw new Error('Network error');
                const data = await response.json();
                return data.candidates?.[0]?.content?.parts?.[0]?.text || "عذراً، لم أتمكن من توليد استجابة.";
            } catch (error) {
                console.error("Gemini API Error:", error);
                return "عذراً، واجهت مشكلة في الاتصال بالذكاء الاصطناعي. يرجى المحاولة لاحقاً.";
            }
        };

        const specializations = [
            { id: 'electrical', name: 'هندسة كهرباء', icon: 'zap', color: 'from-amber-50 to-orange-50 hover:border-amber-400', iconColor: 'text-amber-500' },
            { id: 'civil', name: 'هندسة مدنية', icon: 'hard-hat', color: 'from-yellow-50 to-amber-50 hover:border-yellow-400', iconColor: 'text-yellow-600' },
            { id: 'architectural', name: 'هندسة معمارية', icon: 'building-2', color: 'from-orange-50 to-yellow-50 hover:border-orange-400', iconColor: 'text-yellow-500' },
        ];

        const levels = [
            { id: 'level_1', name: 'المستوى الأول (السنة الأولى)' },
            { id: 'level_2', name: 'المستوى الثاني (السنة الثانية)' },
            { id: 'level_3', name: 'المستوى الثالث (السنة الثالثة)' },
            { id: 'level_4', name: 'المستوى الرابع (السنة الرابعة)' },
            { id: 'level_5', name: 'المستوى الخامس (السنة الخامسة)' },
        ];

        const state = {
            isLoggedIn: false,
            user: null, // { username: '...', role: 'admin' | 'student' }
            currentView: 'home',
            selectedSpec: null,
            selectedLevel: null,
            selectedSubject: null,
            activeTab: 'references', // 'references' or 'subjects'
            searchQuery: '',
            alert: { show: false, message: '', type: 'success' },
            confirm: { show: false, id: null, type: null, message: '' },
            summary: { open: false, book: null, text: '', loading: false },
            assistant: { open: false, query: '', messages: [], thinking: false },
            books: [
                { id: Date.now() + 1, title: 'أساسيات الدوائر الكهربائية', author: 'د. أحمد محمود', spec: 'electrical', level: 'level_1', driveLink: 'https://drive.google.com/' },
                { id: Date.now() + 2, title: 'الآلات الكهربائية المتقدمة', author: 'د. خالد سعيد', spec: 'electrical', level: 'level_3', driveLink: 'https://drive.google.com/' },
                { id: Date.now() + 3, title: 'ميكانيكا المواد والإنشاءات', author: 'د. سامي عبدالله', spec: 'civil', level: 'level_2', driveLink: 'https://drive.google.com/' },
                { id: Date.now() + 4, title: 'تصميم الخرسانة المسلحة', author: 'د. يوسف عبدالرحمن', spec: 'civil', level: 'level_4', driveLink: 'https://drive.google.com/' },
                { id: Date.now() + 5, title: 'تاريخ العمارة الإسلامية', author: 'د. منى خالد', spec: 'architectural', level: 'level_1', driveLink: 'https://drive.google.com/' }
            ],
            subjects: [
                { id: 'sub_101', name: 'الرياضيات الهندسية 1', spec: 'electrical', level: 'level_1' },
                { id: 'sub_102', name: 'فيزياء عامة', spec: 'civil', level: 'level_1' },
                { id: 'sub_103', name: 'التصميم المعماري', spec: 'architectural', level: 'level_1' }
            ],
            lectures: [
                { id: 'lec_1', title: 'المحاضرة الأولى: مقدمة عامة', driveLink: 'https://drive.google.com/', subjectId: 'sub_101' }
            ]
        };

        window.showAlert = (message, type = 'success') => {
            state.alert = { show: true, message, type };
            renderApp();
            setTimeout(() => {
                state.alert.show = false;
                renderApp();
            }, 3000);
        };

        window.handleLogin = (event) => {
            event.preventDefault();
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();
            const errDiv = document.getElementById('login-error');

            if (u === 'ashraf' && p === '0119852715') {
                state.user = { username: 'أشرف', role: 'admin' };
                state.isLoggedIn = true;
                renderApp();
            } else if (u === 'student' && p === '123') {
                state.user = { username: 'طالب', role: 'student' };
                state.isLoggedIn = true;
                renderApp();
            } else {
                errDiv.classList.remove('hidden');
                errDiv.innerHTML = `<i data-lucide="alert-circle" class="w-5 h-5 ml-2 text-red-500"></i><p class="text-sm font-medium text-red-700">بيانات الدخول غير صحيحة.</p>`;
                if(window.lucide) lucide.createIcons();
            }
        };

        window.handleLogout = () => {
            state.isLoggedIn = false;
            state.user = null;
            state.currentView = 'home';
            renderApp();
        };

        window.navigateTo = (view, spec = null, level = null, subjectId = null) => {
            state.currentView = view;
            if (spec) state.selectedSpec = spec;
            if (level) state.selectedLevel = level;
            if (subjectId) state.selectedSubject = subjectId;
            if (view === 'level_dashboard') state.activeTab = 'references';
            renderApp();
        };

        window.switchTab = (tab) => {
            state.activeTab = tab;
            renderApp();
        };

        window.updateSearch = (val) => {
            state.searchQuery = val;
            renderMainContent(); 
        };

        window.handleAddBook = (event) => {
            event.preventDefault();
            const title = document.getElementById('new-title').value;
            const author = document.getElementById('new-author').value;
            const spec = document.getElementById('new-spec').value;
            const level = document.getElementById('new-level').value;
            const driveLink = document.getElementById('new-drive').value;

            const newBook = { id: Date.now(), title, author, spec, level, driveLink };
            state.books.unshift(newBook);
            window.showAlert('تمت إضافة المرجع بنجاح!', 'success');
            window.navigateTo('level_dashboard', spec, level);
        };

        window.handleAddSubject = (event) => {
            event.preventDefault();
            const name = document.getElementById('sub-name').value;
            const spec = document.getElementById('sub-spec').value;
            const level = document.getElementById('sub-level').value;

            const newSub = { id: Date.now(), name, spec, level };
            state.subjects.unshift(newSub);
            window.showAlert('تمت إضافة المادة بنجاح!', 'success');
            window.navigateTo('level_dashboard', spec, level);
            window.switchTab('subjects');
        };

        window.handleAddLecture = (event) => {
            event.preventDefault();
            const title = document.getElementById('lec-title').value;
            const driveLink = document.getElementById('lec-drive').value;

            const newLec = { id: Date.now(), title, driveLink, subjectId: state.selectedSubject };
            state.lectures.unshift(newLec);
            window.showAlert('تمت إضافة المحاضرة بنجاح!', 'success');
            window.navigateTo('subject_lectures', state.selectedSpec, state.selectedLevel, state.selectedSubject);
        };

        window.requestDelete = (id, type) => {
            let msg = '';
            if (type === 'book') msg = 'هل أنت متأكد من حذف هذا المرجع؟';
            else if (type === 'subject') msg = 'هل أنت متأكد من حذف هذه المادة؟';
            else if (type === 'lecture') msg = 'هل أنت متأكد من حذف هذه المحاضرة؟';
            state.confirm = { show: true, id, type, message: msg };
            renderApp();
        };

        window.cancelDelete = () => {
            state.confirm = { show: false, id: null, type: null, message: '' };
            renderApp();
        };

        window.executeDelete = () => {
            if (state.confirm.id) {
                if (state.confirm.type === 'book') {
                    state.books = state.books.filter(b => String(b.id) !== String(state.confirm.id));
                } else if (state.confirm.type === 'subject') {
                    state.subjects = state.subjects.filter(s => String(s.id) !== String(state.confirm.id));
                    state.lectures = state.lectures.filter(l => String(l.subjectId) !== String(state.confirm.id));
                } else if (state.confirm.type === 'lecture') {
                    state.lectures = state.lectures.filter(l => String(l.id) !== String(state.confirm.id));
                }
                window.showAlert('تم الحذف بنجاح.', 'success');
            }
            state.confirm = { show: false, id: null, type: null, message: '' };
            renderApp();
        };

        window.closeSummary = () => {
            state.summary.open = false;
            renderApp();
        };

        window.openSummary = async (bookId) => {
            const book = state.books.find(b => String(b.id) === String(bookId));
            if(!book) return;

            state.summary = { open: true, book: book, text: '', loading: true };
            renderApp();

            const specName = specializations.find(s => s.id === book.spec)?.name || '';
            const prompt = `أنا طالب هندسة، أحتاج إلى ملخص لكتاب بعنوان "${book.title}" للمؤلف "${book.author}" في مجال ${specName}. 
            1. نبذة مختصرة عن موضوع الكتاب وتوقع ما يحتويه.
            2. أهم 3 مفاهيم رئيسية للتعلم من هذا المرجع.`;

            const result = await callGemini(prompt);
            state.summary.text = result;
            state.summary.loading = false;
            renderApp();
        };

        window.toggleAssistant = () => {
            state.assistant.open = !state.assistant.open;
            renderApp();
        };

        window.updateAssistantQuery = (val) => {
            state.assistant.query = val;
            const btn = document.getElementById('chat-send-btn');
            if(btn) btn.disabled = (val.trim() === '' || state.assistant.thinking);
        };

        window.handleChatSubmit = async (event) => {
            event.preventDefault();
            const query = state.assistant.query.trim();
            if(!query || state.assistant.thinking) return;

            state.assistant.messages.push({ role: 'user', text: query });
            state.assistant.query = '';
            state.assistant.thinking = true;
            renderApp();
            scrollToBottom('chat-box');

            const currentContext = state.selectedSpec ? ` (علماً بأنني في قسم ${specializations.find(s=>s.id === state.selectedSpec)?.name})` : '';
            const prompt = `سؤال: ${query} ${currentContext}. أجب بشكل علمي ومبسط.`;

            const reply = await callGemini(prompt);
            state.assistant.messages.push({ role: 'bot', text: reply });
            state.assistant.thinking = false;
            
            renderApp();
            scrollToBottom('chat-box');
        };

        function scrollToBottom(id) {
            setTimeout(() => {
                const el = document.getElementById(id);
                if(el) el.scrollTop = el.scrollHeight;
            }, 50);
        }

        function renderApp() {
            const root = document.getElementById('app-root');
            if (!state.isLoggedIn) {
                root.innerHTML = getLoginHTML();
            } else {
                root.innerHTML = getDashboardHTML();
                renderMainContent();
            }
            if(window.lucide) { lucide.createIcons(); }
        }

        function getLoginHTML() {
            return `
            <div class="min-h-screen bg-gradient-to-br from-amber-50 via-white to-yellow-100 flex flex-col justify-center py-12 sm:px-6 lg:px-8 relative overflow-hidden">
                <div class="absolute top-[-10%] right-[-5%] w-96 h-96 bg-gradient-to-br from-amber-300 to-yellow-400 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob"></div>
                <div class="absolute bottom-[-10%] left-[-5%] w-96 h-96 bg-gradient-to-br from-yellow-300 to-orange-400 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob animation-delay-2000"></div>

                <div class="sm:mx-auto sm:w-full sm:max-w-md relative z-10 text-center animate-fade-in">
                    <div class="flex justify-center mb-6">
                        <div class="bg-gradient-to-br from-amber-400 to-yellow-600 p-4 rounded-2xl shadow-xl shadow-amber-200/50">
                            <i data-lucide="monitor" class="w-12 h-12 text-white"></i>
                        </div>
                    </div>
                    <h2 class="text-4xl font-extrabold text-gray-900 tracking-tight">المكتبة <span class="text-amber-500">التكنولوجية</span></h2>
                    <p class="mt-2 text-gray-600 font-medium">بوابة المعرفة الهندسية الحديثة</p>
                </div>

                <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md relative z-10 animate-fade-in">
                    <div class="bg-white/80 backdrop-blur-xl py-8 px-4 shadow-[0_8px_30px_rgb(0,0,0,0.08)] sm:rounded-3xl sm:px-10 border border-white/50">
                        <form class="space-y-6" onsubmit="window.handleLogin(event)">
                            <div id="login-error" class="hidden bg-red-50 border-r-4 border-red-500 p-4 rounded-xl flex items-center"></div>
                            
                            <div>
                                <label class="block text-sm font-bold text-gray-700 mb-2">اسم المستخدم</label>
                                <div class="relative rounded-xl shadow-sm">
                                    <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
                                        <i data-lucide="user" class="h-5 w-5 text-gray-400"></i>
                                    </div>
                                    <input type="text" id="username" required class="focus:ring-2 focus:ring-amber-500 block w-full pr-10 border border-gray-200 rounded-xl py-3 outline-none bg-white/50" placeholder="ادخل اسم المستخدم...">
                                </div>
                            </div>

                            <div>
                                <label class="block text-sm font-bold text-gray-700 mb-2">كلمة المرور</label>
                                <div class="relative rounded-xl shadow-sm">
                                    <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
                                        <i data-lucide="lock" class="h-5 w-5 text-gray-400"></i>
                                    </div>
                                    <input type="password" id="password" required class="focus:ring-2 focus:ring-amber-500 block w-full pr-10 border border-gray-200 rounded-xl py-3 outline-none bg-white/50" placeholder="••••••••">
                                </div>
                            </div>

                            <button type="submit" class="w-full flex justify-center py-3 px-4 rounded-xl shadow-lg shadow-amber-200 text-sm font-bold text-white bg-gradient-to-r from-amber-500 to-yellow-500 hover:from-amber-600 hover:to-yellow-600 transform transition-all active:scale-95">
                                تسجيل الدخول
                            </button>
                        </form>
                    </div>
                </div>
            </div>`;
        }

        function getDashboardHTML() {
            let html = `
            ${state.alert.show ? `
                <div class="fixed top-24 left-1/2 transform -translate-x-1/2 z-50 px-6 py-3 rounded-full shadow-xl flex items-center animate-fade-in ${state.alert.type === 'error' ? 'bg-red-500 text-white' : 'bg-green-500 text-white'}">
                    <i data-lucide="${state.alert.type === 'error' ? 'alert-circle' : 'check-circle'}" class="w-5 h-5 ml-2"></i>
                    <span class="font-bold text-sm">${state.alert.message}</span>
                </div>` : ''}

            ${state.confirm.show ? `
                <div class="fixed inset-0 bg-gray-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-fade-in">
                    <div class="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl border border-gray-100 text-center">
                        <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-red-100 mb-4">
                            <i data-lucide="alert-circle" class="h-6 w-6 text-red-600"></i>
                        </div>
                        <h3 class="text-lg font-bold text-gray-900 mb-2">تأكيد الحذف</h3>
                        <p class="text-sm text-gray-500 mb-6">${state.confirm.message}</p>
                        <div class="flex gap-3 justify-center">
                            <button onclick="window.cancelDelete()" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-xl font-bold hover:bg-gray-200 transition-colors flex-1">إلغاء</button>
                            <button onclick="window.executeDelete()" class="px-4 py-2 bg-red-600 text-white rounded-xl font-bold hover:bg-red-700 transition-colors flex-1">نعم، احذف</button>
                        </div>
                    </div>
                </div>` : ''}

            <nav class="bg-white/80 backdrop-blur-lg shadow-sm border-b border-amber-100 sticky top-0 z-30">
                <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                    <div class="flex justify-between h-20">
                        <div class="flex items-center cursor-pointer group" onclick="window.navigateTo('home')">
                            <div class="bg-amber-100 p-2 rounded-xl group-hover:bg-amber-200 transition-colors ml-3 relative">
                                <i data-lucide="monitor" class="w-7 h-7 text-amber-600"></i>
                            </div>
                            <span class="font-extrabold text-2xl text-gray-900 hidden sm:block">المكتبة <span class="text-amber-500">التكنولوجية</span></span>
                        </div>
                        
                        <div class="flex items-center space-x-4 space-x-reverse">
                            <div class="flex items-center bg-white border border-gray-200 shadow-sm py-1.5 px-4 rounded-full">
                                <div class="w-2.5 h-2.5 rounded-full ml-2 shadow-sm ${state.user.role === 'admin' ? 'bg-amber-500' : 'bg-blue-500'}"></div>
                                <span class="text-sm font-bold text-gray-700">${state.user.username}</span>
                            </div>
                            <button onclick="window.handleLogout()" class="flex items-center text-gray-400 hover:text-red-500 bg-gray-50 hover:bg-red-50 p-2.5 rounded-xl transition-all">
                                <i data-lucide="log-out" class="w-5 h-5"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </nav>

            ${state.currentView !== 'home' ? `
                <div class="bg-white/50 backdrop-blur-md border-b border-gray-200">
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center text-sm text-gray-500 font-medium">
                        <button onclick="window.navigateTo('home')" class="hover:text-amber-600">الرئيسية</button>
                        <i data-lucide="chevron-right" class="w-4 h-4 mx-2 text-gray-400"></i>
                        ${state.currentView === 'levels' || state.currentView === 'level_dashboard' ? `
                            <button onclick="window.navigateTo('levels', '${state.selectedSpec}')" class="hover:text-amber-600 font-bold bg-amber-50 px-3 py-1 rounded-full text-amber-600">${specializations.find(s => s.id === state.selectedSpec)?.name}</button>
                        ` : ''}
                        ${state.currentView === 'level_dashboard' ? `
                            <i data-lucide="chevron-right" class="w-4 h-4 mx-2 text-gray-400"></i>
                            <span class="font-bold bg-amber-50 px-3 py-1 rounded-full text-amber-600">${levels.find(l => l.id === state.selectedLevel)?.name}</span>
                        ` : ''}
                        ${state.currentView === 'add_book' ? `<span class="font-bold bg-amber-50 px-3 py-1 rounded-full text-amber-600">إضافة مرجع جديد</span>` : ''}
                        ${state.currentView === 'add_subject' ? `<span class="font-bold bg-amber-50 px-3 py-1 rounded-full text-amber-600">إضافة مادة دراسية</span>` : ''}
                        ${state.currentView === 'subject_lectures' ? `<i data-lucide="chevron-right" class="w-4 h-4 mx-2 text-gray-400"></i><span class="font-bold bg-amber-50 px-3 py-1 rounded-full text-amber-600">المحاضرات</span>` : ''}
                        ${state.currentView === 'add_lecture' ? `<i data-lucide="chevron-right" class="w-4 h-4 mx-2 text-gray-400"></i><span class="font-bold bg-amber-50 px-3 py-1 rounded-full text-amber-600">إضافة محاضرة</span>` : ''}
                    </div>
                </div>
            ` : ''}

            <main id="main-content" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 relative animate-fade-in pb-24"></main>

            <!-- زر التواصل العائم -->
            <a href="tel:0119852715" class="fixed bottom-6 left-6 bg-white rounded-full shadow-lg p-2 pr-4 flex items-center border border-amber-100 z-40 hover:bg-gray-50 transition-colors group">
                <div class="bg-amber-100 p-2 rounded-full ml-3 group-hover:bg-amber-200 transition-colors">
                    <i data-lucide="phone-call" class="w-5 h-5 text-amber-600"></i>
                </div>
                <div class="text-right">
                    <p class="text-[10px] text-gray-500 font-bold">تصميم وتطوير</p>
                    <p class="text-xs text-gray-900 font-black">أشرف حافظ عبده عبد الرحمن</p>
                </div>
            </a>

            <!-- نوافذ الذكاء الاصطناعي -->
            ${state.summary.open ? `
                <div class="fixed inset-0 bg-gray-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                    <div class="bg-white rounded-3xl w-full max-w-2xl shadow-2xl flex flex-col max-h-[85vh] animate-fade-in border border-amber-100">
                        <div class="px-6 py-4 bg-gradient-to-r from-amber-50 to-white border-b border-amber-100 flex justify-between">
                            <div class="flex items-center">

                                        <div>
                                            <label class="block text-sm font-bold text-gray-700 mb-2">القسم</label>
                                            <select id="sub-spec" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-amber-500 bg-gray-50 outline-none">
                                                ${specializations.map(s => `<option value="${s.id}" ${state.selectedSpec === s.id ? 'selected' : ''}>${s.name}</option>`).join('')}
                                            </select>
                                        </div>
                                        <div>
                                            <label class="block text-sm font-bold text-gray-700 mb-2">المستوى</label>
                                            <select id="sub-level" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-amber-500 bg-gray-50 outline-none">
                                                ${levels.map(l => `<option value="${l.id}" ${state.selectedLevel === l.id ? 'selected' : ''}>${l.name}</option>`).join('')}
                                            </select>
                                        </div>
                                    </div>
                                    <div class="pt-6 flex items-center justify-end border-t border-gray-100 gap-4">
                                        <button type="button" onclick="window.navigateTo('level_dashboard', '${state.selectedSpec}', '${state.selectedLevel}')" class="px-6 py-3 rounded-xl text-sm font-bold text-gray-600 hover:bg-gray-100">إلغاء</button>
                                        <button type="submit" class="px-8 py-3 rounded-xl shadow-md text-sm font-bold text-white bg-amber-500 hover:bg-amber-600 flex items-center">إضافة المادة</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                `;
            } else if (state.currentView === 'subject_lectures') {
                const subject = state.subjects.find(s => String(s.id) === String(state.selectedSubject));
                const lecs = state.lectures.filter(l => String(l.subjectId) === String(state.selectedSubject));
                
                html = `
                    <div class="mb-8 flex justify-between items-center">
                        <div>
                            <h1 class="text-3xl font-extrabold text-gray-900 mb-2">محاضرات: ${subject?.name}</h1>
                            <p class="text-gray-500">${levels.find(l => l.id === state.selectedLevel)?.name} - ${specializations.find(s => s.id === state.selectedSpec)?.name}</p>
                        </div>
                        ${state.user.role === 'admin' ? `
                            <button onclick="window.navigateTo('add_lecture', '${state.selectedSpec}', '${state.selectedLevel}', '${state.selectedSubject}')" class="flex items-center text-sm font-bold bg-amber-500 text-white hover:bg-amber-600 py-2.5 px-5 rounded-xl shadow-md transition-all">
                                <i data-lucide="plus" class="w-4 h-4 ml-2"></i> إضافة محاضرة
                            </button>
                        ` : ''}
                    </div>

                    ${lecs.length === 0 ? `
                        <div class="text-center py-20 bg-white rounded-3xl border-2 border-dashed border-gray-200">
                            <i data-lucide="video" class="w-16 h-16 text-gray-300 mx-auto mb-4"></i>
                            <h3 class="text-xl font-bold text-gray-900">لا توجد محاضرات حالياً</h3>
                        </div>
                    ` : `
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            ${lecs.map(lec => `
                                <div class="bg-white rounded-2xl border border-gray-100 p-6 flex flex-col justify-between shadow-sm hover:shadow-md transition-shadow group">
                                    <div class="flex items-start mb-6">
                                        <div class="bg-blue-50 p-3 rounded-xl ml-4">
                                            <i data-lucide="play-circle" class="w-6 h-6 text-blue-500"></i>
                                        </div>
                                        <div>
                                            <h3 class="font-bold text-lg text-gray-900 leading-tight">${lec.title}</h3>
                                        </div>
                                    </div>
                                    <div class="flex gap-2 mt-auto">
                                        <a href="${lec.driveLink}" target="_blank" class="flex-1 flex justify-center items-center text-sm font-bold text-white bg-blue-600 hover:bg-blue-700 py-2.5 rounded-xl transition-all">
                                            عرض المحاضرة <i data-lucide="external-link" class="w-4 h-4 mr-2"></i>
                                        </a>
                                        ${state.user.role === 'admin' ? `
                                            <button onclick="window.requestDelete('${lec.id}', 'lecture')" class="p-2.5 bg-red-50 text-red-500 hover:bg-red-100 rounded-xl transition-colors"><i data-lucide="trash-2" class="w-5 h-5"></i></button>
                                        ` : ''}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    `}
                `;
            } else if (state.currentView === 'add_lecture') {
                const subject = state.subjects.find(s => String(s.id) === String(state.selectedSubject));
                html = `
                    <div class="max-w-2xl mx-auto pb-10">
                        <div class="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden">
                            <div class="px-8 py-6 border-b border-gray-100 bg-gradient-to-r from-blue-50 to-white flex items-center">
                                <div class="bg-blue-500 p-2 rounded-xl ml-4 text-white"><i data-lucide="video" class="w-6 h-6"></i></div>
                                <div>
                                    <h2 class="text-xl font-extrabold text-gray-900">إضافة محاضرة جديدة</h2>
                                    <p class="text-sm text-gray-500 mt-1">مادة: ${subject?.name}</p>
                                </div>
                            </div>
                            <div class="p-8">
                                <form onsubmit="window.handleAddLecture(event)" class="space-y-6">
                                    <div>
                                        <label class="block text-sm font-bold text-gray-700 mb-2">عنوان المحاضرة</label>
                                        <input type="text" id="lec-title" required placeholder="مثال: المحاضرة الأولى - مقدمة" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 bg-gray-50 focus:bg-white outline-none">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-bold text-gray-700 mb-2">رابط Google Drive</label>
                                        <input type="url" id="lec-drive" required placeholder="https://drive.google.com/..." class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 bg-blue-50/30 focus:bg-white outline-none text-left" dir="ltr">
                                    </div>
                                    <div class="pt-6 flex items-center justify-end border-t border-gray-100 gap-4">
                                        <button type="button" onclick="window.navigateTo('subject_lectures', '${state.selectedSpec}', '${state.selectedLevel}', '${state.selectedSubject}')" class="px-6 py-3 rounded-xl text-sm font-bold text-gray-600 hover:bg-gray-100">إلغاء</button>
                                        <button type="submit" class="px-8 py-3 rounded-xl shadow-md text-sm font-bold text-white bg-blue-600 hover:bg-blue-700 flex items-center">حفظ المحاضرة</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                `;
            }
            container.innerHTML = html;
            if(window.lucide) lucide.createIcons();
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderApp();
        });

    </script>
</body>
</html>
