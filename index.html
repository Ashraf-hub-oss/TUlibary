                            <p class="tag-modern mt-2 inline-block px-4 py-1.5 rounded-full text-sm shadow-sm">${specName}</p>
                        </div>
                        <div class="glass-card p-1.5 rounded-2xl flex flex-wrap lg:inline-flex w-full lg:w-auto gap-1">
                            <button onclick="window.switchTab('references')" class="flex-1 sm:flex-none flex justify-center items-center gap-2 px-4 py-2.5 rounded-xl text-sm tab-btn ${state.activeTab === 'references' ? 'tab-active' : 'tab-inactive'}"><i data-lucide="book-marked" class="w-4 h-4"></i> المراجع</button>
                            <button onclick="window.switchTab('subjects')" class="flex-1 sm:flex-none flex justify-center items-center gap-2 px-4 py-2.5 rounded-xl text-sm tab-btn ${state.activeTab === 'subjects' ? 'tab-active' : 'tab-inactive'}"><i data-lucide="library" class="w-4 h-4"></i> المواد</button>
                            <button onclick="window.switchTab('vault')" class="flex-1 sm:flex-none flex justify-center items-center gap-2 px-4 py-2.5 rounded-xl text-sm tab-btn ${state.activeTab === 'vault' ? 'tab-active' : 'tab-inactive'}"><i data-lucide="archive" class="w-4 h-4"></i> مخزن المحاضرات</button>
                            <button onclick="window.switchTab('exams')" class="flex-1 sm:flex-none flex justify-center items-center gap-2 px-4 py-2.5 rounded-xl text-sm tab-btn ${state.activeTab === 'exams' ? 'tab-active' : 'tab-inactive'}"><i data-lucide="file-question" class="w-4 h-4"></i> الاختبارات</button>
                            <button onclick="window.switchTab('chat')" class="flex-1 sm:flex-none flex justify-center items-center gap-2 px-4 py-2.5 rounded-xl text-sm tab-btn ${state.activeTab === 'chat' ? 'tab-active' : 'tab-inactive'}"><i data-lucide="message-circle" class="w-4 h-4"></i> النقاش</button>
                        </div>
                    </div>
                    <div id="tab-view-body" class="page-transition-enter flex-grow flex flex-col">`;

                if(state.activeTab === 'references' || state.activeTab === 'exams') {
                    const isRef = state.activeTab === 'references';
                    const color = isRef ? 'brand' : 'blue';
                    if(canEditContent) {
                        html += `<form onsubmit="event.preventDefault(); window.handleAddContent(event, '${isRef?'ref':'exam'}')" class="glass-card p-6 sm:p-8 rounded-[2rem] mb-8 relative overflow-hidden"><h3 class="font-black text-slate-800 mb-5 flex items-center"><div class="bg-${color}-50 p-2 rounded-xl ml-3 border border-${color}-100"><i data-lucide="${isRef?'cloud-upload':'file-question'}" class="w-5 h-5 text-${color}-600"></i></div> إضافة ${isRef?'مرجع':'اختبار'} جديد</h3><div class="grid grid-cols-1 md:grid-cols-5 gap-4"><div class="col-span-2"><input type="text" id="${isRef?'ref-title':'exam-title'}" required placeholder="العنوان..." class="w-full p-4 bg-white border border-slate-200 rounded-xl font-bold outline-none shadow-sm focus:border-brand-400"></div>${isRef ? `<div class="col-span-1"><input type="text" id="ref-author" required placeholder="المؤلف..." class="w-full p-4 bg-white border border-slate-200 rounded-xl font-bold outline-none shadow-sm focus:border-brand-400"></div>` : ''}<div class="col-span-${isRef?'1':'2'}"><input type="url" id="${isRef?'ref-link':'exam-link'}" required placeholder="الرابط..." class="w-full p-4 bg-white border border-slate-200 rounded-xl font-bold outline-none shadow-sm focus:border-brand-400" dir="ltr"></div><button type="submit" class="col-span-1 btn-modern font-bold rounded-xl text-lg">إضافة</button></div></form>`;
                    }
                    html += `<div id="tab-dynamic-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">${window.getTabDynamicListHTML()}</div>`;
                
                } else if (state.activeTab === 'subjects') {
                    if(canEditContent) html += `<form onsubmit="event.preventDefault(); window.handleAddContent(event, 'sub')" class="glass-card p-6 sm:p-8 rounded-[2rem] mb-8 flex flex-col sm:flex-row gap-4 items-end animate-slide-up relative overflow-hidden"><div class="flex-grow w-full"><label class="block text-sm font-bold text-slate-600 mb-2 ml-1">اسم المادة</label><input type="text" id="sub-title" required placeholder="مثال: فيزياء 1" class="w-full p-4 bg-white border border-slate-200 rounded-xl font-bold outline-none shadow-sm focus:border-brand-400"></div><button type="submit" class="btn-modern w-full sm:w-auto h-[58px] px-8 rounded-xl font-bold flex items-center justify-center gap-2"><i data-lucide="plus-circle" class="w-5 h-5"></i> إضافة المادة</button></form>`;
                    html += `<div id="tab-dynamic-list" class="grid grid-cols-1 md:grid-cols-2 gap-5">${window.getTabDynamicListHTML()}</div>`;
                
                } else if (state.activeTab === 'vault') {
                    html += `<div id="tab-dynamic-list" class="grid grid-cols-1 gap-5">${window.getTabDynamicListHTML()}</div>`;

                } else if (state.activeTab === 'chat') {
                    html += `<div class="glass-card rounded-[2rem] flex flex-col h-[600px] overflow-hidden animate-slide-up"><div class="bg-white/50 border-b border-slate-200 p-4 flex justify-between items-center"><div class="flex items-center"><div class="bg-white text-emerald-600 p-2 rounded-xl ml-3 border border-slate-200 shadow-sm"><i data-lucide="messages-square" class="w-5 h-5"></i></div><div><h3 class="font-black text-slate-800 text-base">غرفة نقاش: ${specName}</h3><p class="text-xs text-emerald-600 font-bold flex items-center mt-0.5"><div class="w-2 h-2 bg-emerald-500 rounded-full ml-1.5 animate-pulse"></div> متصل الآن</p></div></div></div><div id="department-chat-box" class="flex-grow p-5 sm:p-6 overflow-y-auto custom-scrollbar flex flex-col gap-4 bg-slate-50/50 inner-shadow">${window.getDepartmentChatMessagesHTML()}</div><div class="p-3 sm:p-4 bg-white border-t border-slate-200"><form onsubmit="window.handleSendChatMessage(event)" class="flex gap-2 sm:gap-3"><input type="text" id="chat-msg-input" placeholder="اكتب رسالتك..." required class="w-full flex-grow p-3 sm:p-4 bg-slate-50 border border-slate-200 rounded-xl font-medium text-slate-800 outline-none focus:border-brand-400 text-sm"><button type="submit" class="bg-slate-900 text-white px-5 sm:px-6 rounded-xl shadow-md hover:bg-slate-800 transition-colors"><i data-lucide="send" class="w-4 h-4 sm:w-5 sm:h-5 rotate-180"></i></button></form></div></div>`;
                }
                html += `</div></div>`;
            }

            else if (state.currentView === 'lectures') {
                const sub = state.subjects.find(s => s.id === state.selectedSubject);

                html = `
                <div class="animate-fade-in flex-grow flex flex-col space-y-6">
                    <button onclick="window.navigateTo('tabs')" class="text-slate-500 font-bold flex items-center bg-white px-5 py-2.5 rounded-full border border-slate-200 shadow-sm w-max hover:bg-slate-50 transition-colors"><i data-lucide="arrow-right" class="w-4 h-4 ml-2"></i> رجوع للمواد</button>
                    
                    <div class="glass-card p-6 sm:p-8 rounded-[2rem] flex flex-col lg:flex-row justify-between items-start lg:items-center gap-5 relative overflow-hidden">
                        <div class="absolute left-0 top-0 bottom-0 w-2 bg-brand-400"></div>
                        <div class="flex items-center gap-4">
                            <div class="bg-brand-50 p-4 rounded-2xl border border-brand-100 shadow-sm"><i data-lucide="monitor-play" class="w-8 h-8 text-brand-600"></i></div>
                            <div><p class="text-slate-500 text-xs font-bold mb-1">المحتوى التعليمي والمهام</p><h2 class="text-2xl sm:text-3xl font-black text-slate-900">${sub?.title}</h2></div>
                        </div>
                        <div id="subject-archive-btn-slot">
                            ${window.getSubjectArchiveButtonHTML()}
                        </div>
                    </div>

                    ${canEditContent ? `
                    <form onsubmit="event.preventDefault(); window.handleAddContent(event, 'lec')" class="glass-card p-6 sm:p-8 rounded-[2rem] flex flex-col gap-4 relative overflow-hidden">
                        <h3 class="font-black text-lg mb-2 text-slate-800 border-b border-slate-100 pb-3"><i data-lucide="plus-circle" class="w-5 h-5 inline-block text-brand-500 ml-1"></i> إضافة محتوى / تمرين للمادة</h3>
                        <div class="flex flex-col md:flex-row gap-4 w-full">
                            <div class="flex-grow w-full"><label class="block text-sm font-bold text-slate-600 mb-2 ml-1">عنوان الدرس/التمرين</label><input type="text" id="lec-title" required placeholder="اكتب العنوان هنا..." class="w-full p-4 bg-white border border-slate-200 rounded-xl font-bold outline-none focus:border-brand-400 shadow-sm"></div>
                            <div class="w-full md:w-48"><label class="block text-sm font-bold text-slate-600 mb-2 ml-1">نوع المحتوى</label><select id="lec-type" class="w-full p-4 bg-white border border-slate-200 rounded-xl font-bold outline-none focus:border-brand-400 shadow-sm"><option value="video">🎥 فيديو / يوتيوب</option><option value="pdf">📄 PDF / ملزمة</option><option value="ppt">📊 PPT</option></select></div>
                        </div>
                        <div class="flex flex-col md:flex-row gap-4 w-full items-end">
                            <div class="flex-grow w-full"><label class="block text-sm font-bold text-slate-600 mb-2 ml-1">الرابط المباشر للمحتوى</label><input type="url" id="lec-link" required placeholder="الرابط الخارجي (درايف/يوتيوب)..." class="w-full p-4 bg-white border border-slate-200 rounded-xl font-bold outline-none focus:border-brand-400 shadow-sm" dir="ltr"></div>
                            <button type="submit" class="btn-modern w-full md:w-auto px-8 h-[58px] rounded-xl font-bold whitespace-nowrap"><i data-lucide="upload-cloud" class="w-5 h-5 ml-2 inline-block"></i> نشر المحتوى</button>
                        </div>
                    </form>` : ''}

                    <div id="lectures-dynamic-list" class="space-y-4">
                        ${window.getLecturesDynamicListHTML()}
                    </div>

                    <!-- قسم مخزن المحاضرات للدفعات السابقة داخل المادة -->
                    <div id="subject-vault-container">
                        ${window.getSubjectVaultHTML()}
                    </div>

                    ${state.user.role === 'student' ? `
                    <div class="glass-card p-6 sm:p-8 rounded-[2rem] mt-8 relative overflow-hidden">
                        <h3 class="text-lg font-black text-slate-800 mb-6 flex items-center border-b border-slate-100 pb-3"><div class="bg-brand-50 p-2 rounded-lg ml-3 border border-brand-100"><i data-lucide="upload-cloud" class="w-4 h-4 text-brand-600"></i></div> تسليم المهام والبحوث للمادة</h3>
                        <form onsubmit="window.submitAssignment(event)" class="flex flex-col md:flex-row gap-4 items-end mb-8">
                            <input type="hidden" id="assign-subject" value="${state.selectedSubject}">
                            <div class="flex-grow w-full"><label class="block text-sm font-bold text-slate-600 mb-2 ml-1">رابط التسليم (Google Drive / المرفق)</label><input type="url" id="assign-link" required class="w-full p-4 bg-white border border-slate-200 rounded-xl font-bold outline-none focus:border-brand-400 shadow-sm" dir="ltr" placeholder="https://..."></div>
                            <button type="submit" class="btn-modern w-full md:w-auto px-8 py-4 rounded-xl font-bold h-[58px] flex justify-center items-center"><i data-lucide="send" class="w-4 h-4 inline-block ml-2"></i> إرسال التكليف</button>
                        </form>
                        <h4 class="font-bold text-slate-600 mb-4 border-b border-slate-100 pb-2 flex items-center text-sm"><i data-lucide="history" class="w-3 h-3 ml-1.5 text-slate-400"></i> سجل تسليماتك السابقة</h4>
                        <div id="student-submissions-list" class="space-y-3">
                            ${window.getStudentSubmissionsHTML()}
                        </div>
                    </div>` : ''}
                </div>`;
            }

            else if (state.currentView === 'content_viewer' && state.viewerData) {
                const v = state.viewerData;
                html = `
                <div class="animate-fade-in flex-grow flex flex-col space-y-4 h-full">
                    <div class="glass-card p-4 sm:p-5 rounded-2xl flex flex-wrap justify-between items-center gap-3">
                        <div class="flex items-center gap-3">
                            <button onclick="window.closeContentViewer()" class="text-slate-700 font-bold flex items-center bg-white px-4 py-2 rounded-xl border border-slate-200 shadow-sm hover:bg-slate-50 transition-colors">
                                <i data-lucide="arrow-right" class="w-4 h-4 ml-1.5"></i> رجوع
                            </button>
                            <div>
                                <h3 class="font-extrabold text-slate-800 text-base sm:text-lg line-clamp-1">${v.title}</h3>
                                <p class="text-[11px] text-slate-500 font-bold">عارض المحاضرات والملفات الداخلي</p>
                            </div>
                        </div>
                        <a href="${v.originalUrl}" target="_blank" rel="noopener noreferrer" class="btn-modern-outline px-4 py-2 rounded-xl font-bold text-xs flex items-center gap-1.5">
                            <i data-lucide="external-link" class="w-4 h-4"></i> فتح في نافذة خارجية
                        </a>
                    </div>

                    <div class="glass-card rounded-[2rem] overflow-hidden flex-grow flex flex-col min-h-[70vh] relative bg-slate-900/5 border border-slate-200">
                        <iframe src="${v.embedUrl}" class="w-full flex-grow min-h-[68vh] border-0 bg-white" allowfullscreen allow="autoplay; encrypted-media"></iframe>
                    </div>
                </div>`;
            }

            container.innerHTML = html;
            if(typeof lucide !== 'undefined') lucide.createIcons();
        }

        // تشغيل التطبيق فوراً وعند جاهزية الصفحة لضمان عدم ظهور شاشة بيضاء
        try { window.seedHistoryStack(); } catch (e) {}
        window.renderApp();
        window.renderAshAiWidget();
        document.addEventListener('DOMContentLoaded', () => {
            try { window.seedHistoryStack(); } catch (e) {}
            window.renderApp();
            window.renderAshAiWidget();
        });
    </script>
</body>
</html>
