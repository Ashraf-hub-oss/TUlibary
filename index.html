<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>بوابة الجامعة التكنولوجية | النظام المطور</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>

    <!-- مكتبات مسح وتوليد QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>

    <!-- استدعاء Firebase (النسخة المتوافقة الأصلية) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Tajawal', 'sans-serif'] },
                    colors: {
                        gold: { 50: '#fbf9f1', 100: '#f5efe0', 200: '#eadab4', 300: '#debe7e', 400: '#d39e4a', 500: '#c88024', 600: '#b1621a', 700: '#934618', 800: '#773818', 900: '#602f15' },
                        brand: { 50: '#fbf9f1', 100: '#f5efe0', 200: '#eadab4', 300: '#debe7e', 400: '#d39e4a', 500: '#c88024', 600: '#b1621a' }
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'blob': 'blob 10s infinite alternate',
                        'fade-in': 'fadeIn 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards',
                        'slide-up': 'slideUp 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards',
                    },
                    keyframes: {
                        float: { '0%, 100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-20px)' } },
                        blob: { '0%': { transform: 'translate(0px, 0px) scale(1)' }, '33%': { transform: 'translate(30px, -50px) scale(1.1)' }, '66%': { transform: 'translate(-20px, 20px) scale(0.9)' }, '100%': { transform: 'translate(0px, 0px) scale(1)' } },
                        fadeIn: { from: { opacity: 0 }, to: { opacity: 1 } },
                        slideUp: { from: { opacity: 0, transform: 'translateY(20px)' }, to: { opacity: 1, transform: 'translateY(0)' } }
                    }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap');
        
        body { 
            background: radial-gradient(circle at top left, #fdfbf7, #fdf6e3, #fdfbf7);
            background-size: 200% 200%;
            animation: gradientBG 15s ease infinite;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Liquid Glass Aesthetics */
        .glass-panel {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 32px 0 rgba(199, 144, 36, 0.08);
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(211, 158, 74, 0.3);
            transition: all 0.3s ease;
        }
        .glass-input:focus { background: rgba(255, 255, 255, 0.95); border-color: #c88024; box-shadow: 0 0 0 4px rgba(200, 128, 36, 0.15); }

        .glass-button {
            background: linear-gradient(135deg, #d39e4a 0%, #b1621a 100%);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 15px rgba(211, 158, 74, 0.3);
            color: white;
            transition: all 0.3s ease;
        }
        .glass-button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(211, 158, 74, 0.45); }

        .tab-btn { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .tab-active { background-color: rgba(255,255,255,0.9); color: #b1621a; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); font-weight: 800; border-radius: 0.75rem; border: 1px solid #d39e4a;}
        .tab-inactive { color: #64748b; font-weight: 500; }
        .tab-inactive:hover { color: #b1621a; background-color: rgba(255,255,255,0.5); }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #d39e4a; border-radius: 10px; }

        /* QR Scanner Overrides */
        #qr-reader { border: none !important; border-radius: 1rem; overflow: hidden; background: rgba(0,0,0,0.05); width: 100%; max-width: 400px; margin: 0 auto;}
        #qr-reader img { display: none; }
        #qr-reader__dashboard_section_csr button { background: #b1621a; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body class="text-slate-800 relative min-h-screen flex flex-col selection:bg-gold-200 selection:text-gold-900">

    <div id="app-root" class="flex-grow flex flex-col z-10 relative"></div>

    <script>
        // ==========================================
        // إعدادات Firebase
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyAs2wYMa4Fs5TJxLzZN616HTUaIxSb_7Bc",
            authDomain: "tulibary-d35ae.firebaseapp.com",
            databaseURL: "https://tulibary-d35ae-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "tulibary-d35ae",
            storageBucket: "tulibary-d35ae.firebasestorage.app",
            messagingSenderId: "107464097138",
            appId: "1:107464097138:web:9147008aec9c0e0fa471eb"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        
        const auth = firebase.auth();
        const db = firebase.firestore();
        const appIdStr = 'tech-library-v1';

        const defaultSpecializations = [
            { id: 'electrical', name: 'هندسة كهرباء', icon: 'zap', iconColor: 'text-gold-500', bgGlow: 'bg-yellow-100' },
            { id: 'civil', name: 'هندسة مدنية', icon: 'hard-hat', iconColor: 'text-gold-600', bgGlow: 'bg-orange-100' },
            { id: 'architectural', name: 'هندسة معمارية', icon: 'building-2', iconColor: 'text-yellow-600', bgGlow: 'bg-amber-100' }
        ];
        
        const levels = [
            { id: 'level_1', name: 'المستوى الأول', num: '01' }, { id: 'level_2', name: 'المستوى الثاني', num: '02' },
            { id: 'level_3', name: 'المستوى الثالث', num: '03' }, { id: 'level_4', name: 'المستوى الرابع', num: '04' }, { id: 'level_5', name: 'المستوى الخامس', num: '05' }
        ];

        const ROLES_MAP = {
            student: 'طالب', admin: 'مشرف قسم', doctor: 'دكتور/أستاذ', super_admin: 'مدير عام',
            dean: 'عميد الكلية', finance: 'الحسابات المالية', security: 'أمن البوابة'
        };

        // الحالة الشاملة (State)
        const state = {
            isLoggedIn: false, user: null, currentView: 'home', showRegister: false,
            selectedSpec: null, selectedLevel: null, selectedSubject: null,
            activeTab: 'references', alert: { show: false, message: '', type: 'success' },
            confirm: { show: false, id: null, type: '', message: '', extra: null },
            searchBar: '',
            references: [], subjects: [], lectures: [], exams: [], news: [], chats: [], dbUsers: [], dynamicSpecializations: [],
            officialStudents: [], deanChats: [], submissions: [],
            qrScanner: null, scannerActive: false, scannerMode: '', modals: { qrResult: null, submissionGrade: null }
        };

        window.getStudentNameByUniId = (uniId) => {
            const dynamicStudent = state.officialStudents.find(s => s.uniId === uniId);
            if (dynamicStudent) return dynamicStudent.fullName;
            return null;
        };

        const getAllSpecializations = () => [...defaultSpecializations, ...state.dynamicSpecializations];
        
        auth.signInAnonymously().catch(err => console.error("Auth Error", err));

        auth.onAuthStateChanged((user) => {
            if (user) {
                const basePath = `artifacts/${appIdStr}/public/data`;
                db.collection(`${basePath}/references`).onSnapshot(s => { state.references = s.docs.map(d => ({ id: d.id, ...d.data() })); if (state.isLoggedIn) renderApp(); });
                db.collection(`${basePath}/subjects`).onSnapshot(s => { state.subjects = s.docs.map(d => ({ id: d.id, ...d.data() })); if (state.isLoggedIn) renderApp(); });
                db.collection(`${basePath}/lectures`).onSnapshot(s => { state.lectures = s.docs.map(d => ({ id: d.id, ...d.data() })); if (state.isLoggedIn) renderApp(); });
                db.collection(`${basePath}/exams`).onSnapshot(s => { state.exams = s.docs.map(d => ({ id: d.id, ...d.data() })); if (state.isLoggedIn) renderApp(); });
                db.collection(`${basePath}/news`).onSnapshot(s => { state.news = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b)=>b.createdAt - a.createdAt); if (state.isLoggedIn && state.currentView === 'home') renderApp(); });
                db.collection(`${basePath}/specializations`).onSnapshot(s => { state.dynamicSpecializations = s.docs.map(d => ({ docId: d.id, ...d.data() })); if (state.isLoggedIn) renderApp(); });
                db.collection(`${basePath}/official_students`).onSnapshot(s => { state.officialStudents = s.docs.map(d => ({ docId: d.id, ...d.data() })); if(!state.isLoggedIn && state.showRegister) renderApp(); });
                
                db.collection(`${basePath}/chats`).orderBy('timestamp', 'asc').onSnapshot(s => { 
                    state.chats = s.docs.map(d => ({ id: d.id, ...d.data() })); 
                    if (state.isLoggedIn && state.activeTab === 'chat') { renderApp(); setTimeout(() => { const chatBox = document.getElementById('department-chat-box'); if(chatBox) chatBox.scrollTop = chatBox.scrollHeight; }, 50); }
                });

                db.collection(`${basePath}/dean_chats`).orderBy('timestamp', 'asc').onSnapshot(s => {
                    state.deanChats = s.docs.map(d => ({ id: d.id, ...d.data() }));
                    if (state.isLoggedIn && state.currentView === 'dean_board') { renderApp(); setTimeout(() => { const b = document.getElementById('dean-chat-box'); if(b) b.scrollTop = b.scrollHeight; }, 50); }
                });

                db.collection(`${basePath}/submissions`).orderBy('timestamp', 'desc').onSnapshot(s => {
                    state.submissions = s.docs.map(d => ({ id: d.id, ...d.data() }));
                    if (state.isLoggedIn) renderApp();
                });

                db.collection(`${basePath}/users`).onSnapshot(s => { 
                    state.dbUsers = s.docs.map(d => ({ id: d.id, ...d.data() })); 
                    if(state.user && state.user.id) {
                        const updatedUser = state.dbUsers.find(u => u.id === state.user.id);
                        if(updatedUser) state.user = updatedUser;
                    }
                    renderApp();
                });
            }
        });

        window.showAlert = (msg, type = 'success') => { state.alert = { show: true, message: msg, type }; renderApp(); setTimeout(() => { state.alert.show = false; renderApp(); }, 3000); };
        window.formatTime = (timestamp) => new Date(timestamp).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
        window.toggleRegister = () => { state.showRegister = !state.showRegister; renderApp(); };

        // ==========================================
        // الدخول والتسجيل
        // ==========================================
        window.handleLogin = (e) => {
            e.preventDefault();
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();
            const errDiv = document.getElementById('login-error');

            let matchedUser = null;
            
            // حساب أشرف (المدير العام) بصلاحيات كاملة
            if (u === 'ashraf' && p === '0119852715') {
                matchedUser = { id: 'super_1', username: 'م. أشرف (المدير العام)', role: 'super_admin', specialization: 'all', attendedLectures: [] };
            } 
            else {
                const dbUser = state.dbUsers.find(user => user.username === u && user.password === p);
                if (dbUser) matchedUser = dbUser;
            }

            if (matchedUser) { 
                state.user = matchedUser; 
                state.isLoggedIn = true; 
                if(matchedUser.role === 'finance') state.currentView = 'finance_board';
                else if(matchedUser.role === 'security') state.currentView = 'security_board';
                else if(matchedUser.role === 'dean') state.currentView = 'dean_board';
                else if(matchedUser.role === 'doctor') state.currentView = 'doctor_board';
                else state.currentView = 'home';
                renderApp(); 
            } 
            else { errDiv.classList.remove('hidden'); errDiv.innerHTML = '<i data-lucide="alert-circle" class="w-4 h-4 ml-1"></i> بيانات الدخول غير صحيحة'; lucide.createIcons(); }
        };

        window.checkStudentName = (val) => {
            const cleanVal = val.replace(/\D/g, ''); 
            const previewEl = document.getElementById('student-name-preview');
            if(cleanVal.length > 3) {
                const studentName = window.getStudentNameByUniId(cleanVal);
                if(studentName) previewEl.innerHTML = `<div class="text-emerald-600 font-bold text-sm bg-emerald-50 p-2 rounded-lg border border-emerald-100"><i data-lucide="check-circle" class="w-4 h-4 inline-block align-middle"></i> ${studentName}</div>`;
                else previewEl.innerHTML = `<div class="text-red-500 font-bold text-sm bg-red-50 p-2 rounded-lg border border-red-100"><i data-lucide="x-circle" class="w-4 h-4 inline-block align-middle"></i> غير مدرج بالكشوفات.</div>`;
                lucide.createIcons();
            } else { previewEl.innerHTML = ''; }
        };

        window.handleStudentRegister = async (e) => {
            e.preventDefault();
            const uniIdRaw = document.getElementById('reg-uni-id').value.trim();
            const password = document.getElementById('reg-password').value.trim();
            const specId = document.getElementById('reg-spec').value;
            const batchYear = document.getElementById('reg-batch').value;
            const errDiv = document.getElementById('reg-error');
            const cleanUniId = uniIdRaw.replace(/\D/g, '');
            const fullName = window.getStudentNameByUniId(cleanUniId);

            if(!fullName) { errDiv.classList.remove('hidden'); errDiv.innerHTML = 'الرقم الجامعي غير مسجل بالكشوفات.'; return; }
            if(state.dbUsers.find(u => u.uniId === cleanUniId || u.username === cleanUniId)) { errDiv.classList.remove('hidden'); errDiv.innerHTML = 'الحساب مسجل مسبقاً.'; return; }

            try {
                await db.collection(`artifacts/${appIdStr}/public/data/users`).add({
                    displayName: fullName, username: cleanUniId, password: password, uniId: cleanUniId,
                    role: 'student', specialization: specId, batchYear: batchYear,
                    attendedLectures: [], points: 0, feesRequired: 0, feesPaid: 0, isBanned: false, banReason: '',
                    createdAt: Date.now()
                });
                window.showAlert('تم إنشاء الحساب بنجاح! قم بتسجيل الدخول');
                state.showRegister = false; renderApp();
            } catch (err) { errDiv.classList.remove('hidden'); errDiv.innerHTML = 'حدث خطأ.'; }
        };

        window.saveStudentBatch = async (e) => {
            e.preventDefault();
            const batch = document.getElementById('force-batch-select').value;
            if(!batch) return;
            try {
                await db.collection(`artifacts/${appIdStr}/public/data/users`).doc(state.user.id).update({ batchYear: batch });
                window.showAlert('تم حفظ سنة الدفعة بنجاح');
            } catch(err) { window.showAlert('خطأ في الحفظ', 'error'); }
        };

        window.handleLogout = () => { window.stopQRScanner(); state.isLoggedIn = false; state.user = null; state.currentView = 'home'; renderApp(); };
        window.navigateTo = (view, spec = null, level = null, sub = null) => { window.stopQRScanner(); state.currentView = view; if (spec) state.selectedSpec = spec; if (level) state.selectedLevel = level; if (sub) state.selectedSubject = sub; if(view === 'levels') state.activeTab = 'references'; renderApp(); };
        window.switchTab = (tab) => { state.activeTab = tab; renderMainContent(); if(tab === 'chat') setTimeout(() => { const chatBox = document.getElementById('department-chat-box'); if(chatBox) chatBox.scrollTop = chatBox.scrollHeight; }, 50); };

        // ==========================================
        // المالية
        // ==========================================
        window.saveFinanceFees = async (e) => {
            e.preventDefault();
            const spec = document.getElementById('fin-spec').value;
            const batch = document.getElementById('fin-batch').value;
            const amount = parseFloat(document.getElementById('fin-amount').value);
            if (isNaN(amount) || amount < 0) return window.showAlert('مبلغ غير صالح', 'error');

            let targetStudents = state.dbUsers.filter(u => u.role === 'student');
            if(spec !== 'all') targetStudents = targetStudents.filter(u => u.specialization === spec);
            if(batch !== 'all') targetStudents = targetStudents.filter(u => u.batchYear === batch);

            if(targetStudents.length === 0) return window.showAlert('لا يوجد طلاب بهذه المواصفات لتطبيق الرسوم عليهم', 'error');
            
            try {
                let batchOp = db.batch();
                let count = 0;
                targetStudents.forEach(stu => {
                    const userRef = db.collection(`artifacts/${appIdStr}/public/data/users`).doc(stu.id);
                    batchOp.update(userRef, { feesRequired: amount });
                    count++;
                });
                await batchOp.commit();
                window.showAlert(`تم تعيين رسوم (${amount}) لعدد ${count} طالب`);
            } catch(e) { window.showAlert('فشل تطبيق الرسوم', 'error'); }
        };

        window.updateStudentPayment = async (userId, paidAmount, requiredAmount) => {
            const val = prompt(`تحديث السداد المالي\nالمطلوب كلياً: ${requiredAmount}\nالمدفوع حالياً: ${paidAmount}\n\nأدخل المبلغ المدفوع الجديد الإجمالي:`, paidAmount || 0);
            if (val === null || val === "") return;
            const parsed = parseFloat(val);
            if (isNaN(parsed) || parsed < 0) return window.showAlert('قيمة غير صالحة', 'error');
            
            try {
                const userRef = db.collection(`artifacts/${appIdStr}/public/data/users`).doc(userId);
                let updateData = { feesPaid: parsed };
                if (parsed >= requiredAmount && requiredAmount > 0) { updateData.isBanned = false; updateData.banReason = ''; }
                await userRef.update(updateData);
                window.showAlert('تم التحديث' + (parsed >= requiredAmount && requiredAmount > 0 ? ' (وتم فك الحظر)' : ''));
            } catch(e) { window.showAlert('فشل التحديث', 'error'); }
        };

        window.toggleStudentBan = async (userId, currentStatus) => {
            const reason = !currentStatus ? prompt("أدخل سبب حظر الدخول:") : "";
            if(!currentStatus && reason === null) return;
            try {
                await db.collection(`artifacts/${appIdStr}/public/data/users`).doc(userId).update({ isBanned: !currentStatus, banReason: reason || '' });
                window.showAlert('تم تحديث حالة الحظر');
            } catch(e) { window.showAlert('فشل', 'error'); }
        };

        // ==========================================
        // الوظائف الأكاديمية
        // ==========================================
        window.handleAddContent = async (e, type) => { 
            e.preventDefault(); 
            const data = { spec: state.selectedSpec, level: state.selectedLevel, createdAt: Date.now() }; 
            let coll = ''; 
            if (type === 'ref') { coll = 'references'; data.title = document.getElementById('ref-title').value; data.author = document.getElementById('ref-author').value; data.link = document.getElementById('ref-link').value; } 
            else if (type === 'exam') { coll = 'exams'; data.title = document.getElementById('exam-title').value; data.link = document.getElementById('exam-link').value; } 
            else if (type === 'sub') { coll = 'subjects'; data.title = document.getElementById('sub-title').value; data.doctorId = state.user.id; } 
            else if (type === 'lec') { coll = 'lectures'; data.subjectId = state.selectedSubject; data.title = document.getElementById('lec-title').value; data.type = document.getElementById('lec-type').value; data.link = document.getElementById('lec-link').value; } 
            try { await db.collection(`artifacts/${appIdStr}/public/data/${coll}`).add(data); window.showAlert('تم الإضافة بنجاح'); e.target.reset(); } catch (err) { window.showAlert('فشل', 'error'); }
        };

        window.submitAssignment = async (e) => {
            e.preventDefault();
            const link = document.getElementById('assign-link').value;
            const subId = document.getElementById('assign-subject').value;
            try { await db.collection(`artifacts/${appIdStr}/public/data/submissions`).add({ studentId: state.user.id, studentName: state.user.displayName, subjectId: subId, link: link, grade: null, visibleToStudent: false, timestamp: Date.now() }); window.showAlert('تم تسليم الملف'); e.target.reset(); } catch (err) { window.showAlert('فشل', 'error'); }
        };
        window.saveSubmissionGrade = async (e) => {
            e.preventDefault();
            try { await db.collection(`artifacts/${appIdStr}/public/data/submissions`).doc(state.modals.submissionGrade.id).update({ grade: document.getElementById('grade-val').value, visibleToStudent: document.getElementById('grade-vis').checked }); state.modals.submissionGrade = null; window.showAlert('تم التقييم'); } catch(err) { window.showAlert('فشل', 'error'); }
        };
        window.toggleAttendance = async (lecId) => { if(!state.user || state.user.role !== 'student') return; const isAttended = state.user.attendedLectures?.includes(lecId); try { const userRef = db.collection(`artifacts/${appIdStr}/public/data/users`).doc(state.user.id); if(isAttended) { await userRef.update({ attendedLectures: firebase.firestore.FieldValue.arrayRemove(lecId) }); } else { await userRef.update({ attendedLectures: firebase.firestore.FieldValue.arrayUnion(lecId) }); } } catch (err) {} };

        // ==========================================
        // الإدارة
        // ==========================================
        window.handleAddUser = async (e) => { e.preventDefault(); try { await db.collection(`artifacts/${appIdStr}/public/data/users`).add({ displayName: document.getElementById('new-user-name').value, username: document.getElementById('new-user-id').value, password: document.getElementById('new-user-pass').value, role: document.getElementById('new-user-role').value, specialization: document.getElementById('new-user-spec').value, createdAt: Date.now() }); window.showAlert('تم إنشاء الحساب!'); e.target.reset(); } catch (err) { window.showAlert('فشل', 'error'); } };
        window.handleAddOfficialStudent = async (e) => { e.preventDefault(); const cleanUniId = document.getElementById('official-student-uni-id').value.trim().replace(/\D/g, ''); if(window.getStudentNameByUniId(cleanUniId)) return window.showAlert('مسجل مسبقاً', 'error'); try { await db.collection(`artifacts/${appIdStr}/public/data/official_students`).doc(cleanUniId).set({ fullName: document.getElementById('official-student-name').value.trim(), uniId: cleanUniId, addedBy: state.user.username, createdAt: Date.now() }); window.showAlert('تم الإدراج'); e.target.reset(); } catch (error) { window.showAlert('فشل', 'error'); } };
        window.handleAddSpecialization = async (e) => { e.preventDefault(); try { await db.collection(`artifacts/${appIdStr}/public/data/specializations`).add({ id: 'spec_' + Date.now(), name: document.getElementById('new-spec-title').value, icon: 'book', iconColor: `text-gold-600`, bgGlow: `bg-yellow-100`, createdAt: Date.now() }); window.showAlert('تم تأسيس القسم!'); e.target.reset(); } catch (err) { window.showAlert('فشل', 'error'); } };

        // ==========================================
        // الماسح الضوئي (QR Code) - تم إصلاح دورة العرض لتوافق DOM
        // ==========================================
        window.startQRScanner = (mode) => {
            state.scannerActive = true;
            state.scannerMode = mode;
            renderApp(); // يجب إعادة رسم الواجهة أولاً لتوليد div#qr-reader

            // الانتظار حتى يتأكد المتصفح من وجود العنصر في الشاشة
            setTimeout(() => {
                if(!document.getElementById("qr-reader")) {
                    window.showAlert('فشل في تحميل واجهة الكاميرا، يرجى تحديث الصفحة', 'error');
                    return;
                }

                try {
                    const scanner = new Html5QrcodeScanner("qr-reader", { fps: 10, qrbox: {width: 250, height: 250} });
                    state.qrScanner = scanner;
                    scanner.render(async (decodedText) => {
                        scanner.pause(true);
                        const student = state.dbUsers.find(u => u.uniId === decodedText && u.role === 'student');
                        if(!student) { state.modals.qrResult = { type: 'error', title: 'غير مسجل', msg: 'البطاقة غير مدرجة في النظام' }; } 
                        else if (state.scannerMode === 'security') {
                            const required = student.feesRequired || 0; const paid = student.feesPaid || 0;
                            if(student.isBanned) state.modals.qrResult = { type: 'error', title: 'ممنوع الدخول', msg: `الطالب محظور: ${student.banReason}` };
                            else if(required > 0 && paid < required) state.modals.qrResult = { type: 'error', title: 'ممنوع الدخول', msg: `غير مسدد للرسوم. (دفع ${paid} من ${required})` };
                            else state.modals.qrResult = { type: 'success', title: 'مسموح الدخول', msg: `الطالب: ${student.displayName}` };
                        } 
                        else if (state.scannerMode === 'doctor') {
                            try { await db.collection(`artifacts/${appIdStr}/public/data/users`).doc(student.id).update({ points: firebase.firestore.FieldValue.increment(5) }); state.modals.qrResult = { type: 'success', title: 'تم تسجيل الحضور', msg: `تم إضافة 5 درجات للطالب ${student.displayName}` }; } catch(e) { state.modals.qrResult = { type: 'error', title: 'خطأ', msg: 'فشل التسجيل' }; }
                        }
                        renderApp(); 
                        setTimeout(() => { state.modals.qrResult = null; if(state.qrScanner) state.qrScanner.resume(); renderApp(); }, 4000);
                    }, (err) => {
                        // يتم تجاهل الأخطاء الصامتة لعدم العثور على QR
                    });
                } catch (err) {
                    window.showAlert('تعذر الوصول للكاميرا، تأكد من إعطاء الصلاحيات', 'error');
                }
            }, 500);
        };

                                </div>
                            </div>`}).join('')}
                        ${lecs.length === 0 ? '<div class="flex flex-col items-center justify-center py-12 glass-panel rounded-[2rem] border-dashed border-2 border-slate-300"><div class="bg-slate-50 p-4 rounded-full mb-3"><i data-lucide="inbox" class="w-10 h-10 text-slate-400"></i></div><p class="text-slate-500 font-bold">لم يتم رفع محتوى تعليمي للمادة بعد.</p></div>' : ''}
                    </div>

                    ${state.user.role === 'student' ? `
                    <div class="glass-panel p-6 sm:p-8 rounded-[2rem] border-2 border-indigo-200/50 mt-8 shadow-sm">
                        <h3 class="text-xl font-black text-slate-800 mb-6 flex items-center border-b border-indigo-200/40 pb-3"><div class="bg-indigo-100 p-2 rounded-xl ml-3 border border-indigo-200/50"><i data-lucide="upload-cloud" class="w-5 h-5 text-indigo-600"></i></div> تسليم المهام والبحوث للمادة</h3>
                        <form onsubmit="window.submitAssignment(event)" class="flex flex-col md:flex-row gap-4 items-end mb-8">
                            <input type="hidden" id="assign-subject" value="${state.selectedSubject}">
                            <div class="flex-grow w-full"><label class="block text-sm font-bold text-slate-600 mb-2">رابط التسليم (Google Drive / المرفق)</label><input type="url" id="assign-link" required class="glass-input w-full p-4 rounded-xl font-bold" dir="ltr" placeholder="https://..."></div>
                            <button type="submit" class="glass-button w-full md:w-auto bg-gradient-to-l from-indigo-500 to-indigo-700 border-none px-8 py-4 rounded-xl font-bold h-[58px] shadow-md flex justify-center items-center"><i data-lucide="send" class="w-5 h-5 inline-block ml-2"></i> إرسال التكليف</button>
                        </form>
                        <h4 class="font-bold text-slate-700 mb-4 border-b border-slate-200/60 pb-2 flex items-center"><i data-lucide="history" class="w-4 h-4 ml-1.5 text-slate-400"></i> سجل تسليماتك السابقة</h4>
                        <div class="space-y-3">
                            ${mySubs.length === 0 ? '<p class="text-slate-500 text-sm font-bold bg-slate-50/50 p-4 rounded-xl border border-slate-100 text-center">لم تقم برفع أي مهام لهذه المادة حتى الآن.</p>' : mySubs.map(s => `
                                <div class="bg-white/80 p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                                    <div><p class="text-xs text-slate-500 font-bold mb-1.5">${window.formatTime(s.timestamp)}</p><a href="${s.link}" target="_blank" class="text-blue-600 font-bold text-sm flex items-center hover:underline bg-blue-50/50 px-3 py-1.5 rounded-lg border border-blue-100 w-max"><i data-lucide="external-link" class="w-3.5 h-3.5 ml-1.5"></i> عرض المرفق المُرسل</a></div>
                                    <div class="w-full sm:w-auto text-left">${s.grade ? (s.visibleToStudent ? `<span class="bg-green-100 text-green-700 border border-green-200 px-4 py-2 rounded-xl font-black text-sm shadow-sm flex items-center justify-center sm:inline-flex"><i data-lucide="check-circle" class="w-4 h-4 ml-1.5"></i> النتيجة: ${s.grade}</span>` : `<span class="text-yellow-600 bg-yellow-50 px-3 py-1.5 rounded-lg text-xs font-bold border border-yellow-200">النتيجة مخفية (تم التقييم)</span>`) : `<span class="text-slate-500 bg-slate-100 px-3 py-1.5 rounded-lg text-xs font-bold border border-slate-200 flex items-center w-max"><i data-lucide="clock" class="w-3 h-3 ml-1"></i> قيد مراجعة الأستاذ</span>`}</div>
                                </div>`).join('')}
                        </div>
                    </div>` : ''}
                </div>`;
            }

            container.innerHTML = html;
            if(typeof lucide !== 'undefined') lucide.createIcons();
        }

        document.addEventListener('DOMContentLoaded', renderApp);
    </script>
</body>
</html>
