<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>منصة الجامعة التكنولوجية</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>

    <!-- مكتبات مسح وتوليد QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

    <!-- استدعاء Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Tajawal', 'sans-serif'] },
                    colors: {
                        brand: { 50: '#fffdf6', 100: '#fffbe6', 200: '#fff3c2', 300: '#ffe58a', 400: '#ffd043', 500: '#fcaf0b', 600: '#e18900', 700: '#bb6002', 800: '#984a08', 900: '#7c3d0b' }
                    }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap');
        
        body { 
            background-color: #faf9f6; 
            -webkit-font-smoothing: antialiased;
            color: #334155;
            overflow-x: hidden;
        }

        .bg-blobs {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: -1; overflow: hidden;
            background: radial-gradient(at 0% 0%, rgba(252, 175, 11, 0.05) 0px, transparent 50%),
                        radial-gradient(at 100% 0%, rgba(59, 130, 246, 0.05) 0px, transparent 50%),
                        radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.05) 0px, transparent 50%);
        }
        .blob {
            position: absolute;
            filter: blur(80px);
            opacity: 0.6;
            animation: floatBlob 15s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes floatBlob {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(5vw, 10vh) scale(1.1); }
            100% { transform: translate(-5vw, -5vh) scale(0.9); }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.05), 0 0 10px rgba(252, 175, 11, 0.02) inset;
        }

        .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
        .animate-slide-up { animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .btn-modern {
            background: linear-gradient(135deg, #fcaf0b 0%, #e18900 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(252, 175, 11, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
        }
        .btn-modern::after {
            content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.3), transparent);
            transform: skewX(-20deg); transition: 0.5s;
        }
        .btn-modern:hover::after { left: 150%; }
        .btn-modern:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(252, 175, 11, 0.4); }
        .btn-modern:active { transform: translateY(1px); }

        .btn-modern-outline {
            background: rgba(255, 253, 246, 0.8); backdrop-filter: blur(10px);
            color: #bb6002; border: 1px solid #fcaf0b;
            box-shadow: 0 2px 8px rgba(252, 175, 11, 0.1); transition: all 0.3s ease;
        }
        .btn-modern-outline:hover { background: #fffbe6; transform: translateY(-2px); box-shadow: 0 6px 15px rgba(252, 175, 11, 0.15); }

        .tag-modern { background: linear-gradient(135deg, #ffffff 0%, #fffbe6 100%); border: 1px solid rgba(252, 175, 11, 0.2); color: #bb6002; font-weight: 800; }

        .tab-btn { transition: all 0.3s ease; }
        .tab-active { background-color: white; color: #bb6002; box-shadow: 0 4px 12px rgba(252, 175, 11, 0.1); font-weight: 800; border-radius: 0.75rem; border: 1px solid rgba(252, 175, 11, 0.2);}
        .tab-inactive { color: #64748b; font-weight: 500; }
        .tab-inactive:hover { color: #bb6002; background-color: rgba(255,255,255,0.8); }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #fcaf0b; border-radius: 10px; opacity: 0.5;}

        #qr-reader { width: 100% !important; max-width: 350px; margin: 0 auto; border: 3px solid #fcaf0b !important; border-radius: 1.5rem; overflow: hidden; background-color: #000; box-shadow: 0 10px 25px rgba(252, 175, 11, 0.2);}
        #qr-reader video { width: 100% !important; height: auto !important; object-fit: cover !important; border-radius: 1.5rem; }
        #qr-reader__dashboard_section_csr button { background: linear-gradient(135deg, #fcaf0b 0%, #e18900 100%); color: white; border: none; padding: 12px 24px; border-radius: 12px; font-family: 'Tajawal'; font-weight: 800; margin-top: 10px; cursor: pointer; box-shadow: 0 4px 15px rgba(252, 175, 11, 0.3); }
        #qr-reader__dashboard_section_swaplink { display: none !important; }

        .id-card {
            background: linear-gradient(135deg, #ffffff 0%, #fffdf6 100%);
            box-shadow: 0 20px 40px -10px rgba(252, 175, 11, 0.2);
            border: 1px solid rgba(252, 175, 11, 0.3);
            position: relative; overflow: hidden;
        }
        .id-card::before {
            content: ''; position: absolute; top: -50px; right: -50px; width: 150px; height: 150px;
            background: radial-gradient(circle, rgba(252,175,11,0.15) 0%, transparent 70%); border-radius: 50%; pointer-events: none;
        }
    </style>
</head>
<body class="relative min-h-screen flex flex-col selection:bg-brand-200 selection:text-brand-900">

    <div class="bg-blobs">
        <div class="blob bg-brand-300 w-96 h-96 rounded-full -top-20 -right-20"></div>
        <div class="blob bg-blue-200 w-80 h-80 rounded-full top-1/3 -left-10" style="animation-delay: -5s;"></div>
        <div class="blob bg-emerald-200 w-96 h-96 rounded-full -bottom-20 right-1/4" style="animation-delay: -10s;"></div>
    </div>

    <div id="app-root" class="flex-grow flex flex-col z-10 relative"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAs2wYMa4Fs5TJxLzZN616HTUaIxSb_7Bc",
            authDomain: "tulibary-d35ae.firebaseapp.com",
            databaseURL: "https://tulibary-d35ae-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "tulibary-d35ae",
            storageBucket: "tulibary-d35ae.firebasestorage.app",
            messagingSenderId: "107464097138",
            appId: "1:107464097138:web:9147008aec9c0e0fa471eb"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const appIdStr = 'tech-library-v1';

        const defaultSpecializations = [
            { id: 'electrical', name: 'هندسة كهرباء', icon: 'zap', iconColor: 'text-brand-600', bgGlow: 'bg-brand-50' },
            { id: 'civil', name: 'هندسة مدنية', icon: 'hard-hat', iconColor: 'text-blue-600', bgGlow: 'bg-blue-50' },
            { id: 'architectural', name: 'هندسة معمارية', icon: 'building-2', iconColor: 'text-emerald-600', bgGlow: 'bg-emerald-50' }
        ];
        
        const levels = [
            { id: 'level_1', name: 'المستوى الأول', num: '01' }, { id: 'level_2', name: 'المستوى الثاني', num: '02' },
            { id: 'level_3', name: 'المستوى الثالث', num: '03' }, { id: 'level_4', name: 'المستوى الرابع', num: '04' }, { id: 'level_5', name: 'المستوى الخامس', num: '05' }
        ];

        const ROLES_MAP = {
            student: 'طالب', admin: 'مشرف قسم', doctor: 'دكتور/أستاذ', super_admin: 'مدير عام',
            dean: 'عميد الكلية', finance: 'الحسابات المالية', security: 'أمن البوابة'
        };

        const state = {
            isLoggedIn: false, user: null, currentView: 'home', showRegister: false,
            selectedSpec: null, selectedLevel: null, selectedSubject: null,
            activeTab: 'references', alert: { show: false, message: '', type: 'success' },
            confirm: { show: false, id: null, type: '', message: '', extra: null },
            searchBar: '', docFilters: { spec: 'all', level: 'all' }, 
            references: [], subjects: [], lectures: [], exams: [], news: [], chats: [], dbUsers: [], dynamicSpecializations: [],
            officialStudents: [], deanChats: [], submissions: [],
            qrScanner: null, scannerActive: false, scannerMode: '', qrScannerTimeout: null, modals: { qrResult: null, submissionGrade: null }
        };

        window.getStudentNameByUniId = (uniId) => {
            const dynamicStudent = state.officialStudents.find(s => s.uniId === uniId);
            if (dynamicStudent) return dynamicStudent.fullName;
            return null;
        };

        const getAllSpecializations = () => [...defaultSpecializations, ...state.dynamicSpecializations];
        
        auth.signInAnonymously().catch(err => console.error("Auth Error", err));

        auth.onAuthStateChanged((user) => {
            if (user) {
                const basePath = `artifacts/${appIdStr}/public/data`;
                db.collection(`${basePath}/references`).onSnapshot(s => { state.references = s.docs.map(d => ({ id: d.id, ...d.data() })); if (state.isLoggedIn) renderApp(); });
                db.collection(`${basePath}/subjects`).onSnapshot(s => { state.subjects = s.docs.map(d => ({ id: d.id, ...d.data() })); if (state.isLoggedIn) renderApp(); });
                db.collection(`${basePath}/lectures`).onSnapshot(s => { state.lectures = s.docs.map(d => ({ id: d.id, ...d.data() })); if (state.isLoggedIn) renderApp(); });
                db.collection(`${basePath}/exams`).onSnapshot(s => { state.exams = s.docs.map(d => ({ id: d.id, ...d.data() })); if (state.isLoggedIn) renderApp(); });
                db.collection(`${basePath}/news`).onSnapshot(s => { state.news = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b)=>b.createdAt - a.createdAt); if (state.isLoggedIn && state.currentView === 'home') renderApp(); });
                db.collection(`${basePath}/specializations`).onSnapshot(s => { state.dynamicSpecializations = s.docs.map(d => ({ docId: d.id, ...d.data() })); if (state.isLoggedIn) renderApp(); });
                db.collection(`${basePath}/official_students`).onSnapshot(s => { state.officialStudents = s.docs.map(d => ({ docId: d.id, ...d.data() })); if(!state.isLoggedIn && state.showRegister) renderApp(); });
                
                db.collection(`${basePath}/chats`).orderBy('timestamp', 'asc').onSnapshot(s => { 
                    state.chats = s.docs.map(d => ({ id: d.id, ...d.data() })); 
                    if (state.isLoggedIn && state.activeTab === 'chat') { renderApp(); setTimeout(() => { const chatBox = document.getElementById('department-chat-box'); if(chatBox) chatBox.scrollTop = chatBox.scrollHeight; }, 50); }
                });

                db.collection(`${basePath}/dean_chats`).orderBy('timestamp', 'asc').onSnapshot(s => {
                    state.deanChats = s.docs.map(d => ({ id: d.id, ...d.data() }));
                    if (state.isLoggedIn && state.currentView === 'dean_board') { renderApp(); setTimeout(() => { const b = document.getElementById('dean-chat-box'); if(b) b.scrollTop = b.scrollHeight; }, 50); }
                });

                db.collection(`${basePath}/submissions`).orderBy('timestamp', 'desc').onSnapshot(s => {
                    state.submissions = s.docs.map(d => ({ id: d.id, ...d.data() }));
                    if (state.isLoggedIn) renderApp();
                });

                db.collection(`${basePath}/users`).onSnapshot(s => { 
                    state.dbUsers = s.docs.map(d => ({ id: d.id, ...d.data() })); 
                    if(state.user && state.user.id) {
                        const updatedUser = state.dbUsers.find(u => u.id === state.user.id);
                        if(updatedUser) state.user = updatedUser;
                    }
                    renderApp();
                });
            }
        });

        window.showAlert = (msg, type = 'success') => { state.alert = { show: true, message: msg, type }; renderApp(); setTimeout(() => { state.alert.show = false; renderApp(); }, 3000); };
        window.formatTime = (timestamp) => new Date(timestamp).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
        window.toggleRegister = () => { state.showRegister = !state.showRegister; renderApp(); };

        window.handleLogin = (e) => {
            e.preventDefault();
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();
            const errDiv = document.getElementById('login-error');
            let matchedUser = null;
            
            if (u === 'ashraf' && p === '0119852715') {
                matchedUser = { id: 'super_1', username: 'م. أشرف (المدير العام)', role: 'super_admin', specialization: 'all', attendedLectures: [] };
            } else {
                const dbUser = state.dbUsers.find(user => user.username === u && user.password === p);
                if (dbUser) matchedUser = dbUser;
            }

            if (matchedUser) { 
                state.user = matchedUser; state.isLoggedIn = true; 
                if(matchedUser.role === 'finance') state.currentView = 'finance_board';
                else if(matchedUser.role === 'security') state.currentView = 'security_board';
                else if(matchedUser.role === 'dean') state.currentView = 'dean_board';
                else if(matchedUser.role === 'doctor') state.currentView = 'doctor_board';
                else state.currentView = 'home';
                renderApp(); 
            } else { errDiv.classList.remove('hidden'); errDiv.innerHTML = '<i data-lucide="alert-circle" class="w-4 h-4 ml-1"></i> بيانات الدخول غير صحيحة'; lucide.createIcons(); }
        };

        window.checkStudentName = (val) => {
            const cleanVal = val.replace(/\D/g, ''); 
            const previewEl = document.getElementById('student-name-preview');
            if(cleanVal.length > 3) {
                const studentName = window.getStudentNameByUniId(cleanVal);
                if(studentName) previewEl.innerHTML = `<div class="text-emerald-600 font-bold text-sm bg-emerald-50 p-2 rounded-lg border border-emerald-100"><i data-lucide="check-circle" class="w-4 h-4 inline-block align-middle"></i> ${studentName}</div>`;
                else previewEl.innerHTML = `<div class="text-red-500 font-bold text-sm bg-red-50 p-2 rounded-lg border border-red-100"><i data-lucide="x-circle" class="w-4 h-4 inline-block align-middle"></i> غير مدرج بالكشوفات.</div>`;
                lucide.createIcons();
            } else { previewEl.innerHTML = ''; }
        };

        window.handleStudentRegister = async (e) => {
            e.preventDefault();
            const uniIdRaw = document.getElementById('reg-uni-id').value.trim();
            const password = document.getElementById('reg-password').value.trim();
            const specId = document.getElementById('reg-spec').value;
            const batchYear = document.getElementById('reg-batch').value;
            const errDiv = document.getElementById('reg-error');
            const cleanUniId = uniIdRaw.replace(/\D/g, '');
            const fullName = window.getStudentNameByUniId(cleanUniId);

            if(!fullName) { errDiv.classList.remove('hidden'); errDiv.innerHTML = 'الرقم الجامعي غير مسجل بالكشوفات.'; return; }
            if(state.dbUsers.find(u => u.uniId === cleanUniId || u.username === cleanUniId)) { errDiv.classList.remove('hidden'); errDiv.innerHTML = 'الحساب مسجل مسبقاً.'; return; }

            try {
                await db.collection(`artifacts/${appIdStr}/public/data/users`).add({
                    displayName: fullName, username: cleanUniId, password: password, uniId: cleanUniId,
                    role: 'student', specialization: specId, batchYear: batchYear,
                    attendedLectures: [], points: 0, feesRequired: 0, feesPaid: 0, isBanned: false, banReason: '', createdAt: Date.now()
                });
                window.showAlert('تم إنشاء الحساب بنجاح! قم بتسجيل الدخول'); state.showRegister = false; renderApp();
            } catch (err) { errDiv.classList.remove('hidden'); errDiv.innerHTML = 'حدث خطأ.'; }
        };

        window.saveStudentBatch = async (e) => { e.preventDefault(); const batch = document.getElementById('force-batch-select').value; if(!batch) return; try { await db.collection(`artifacts/${appIdStr}/public/data/users`).doc(state.user.id).update({ batchYear: batch }); window.showAlert('تم حفظ سنة الدفعة بنجاح'); } catch(err) { window.showAlert('خطأ في الحفظ', 'error'); } };
        window.handleLogout = () => { window.stopQRScanner(); state.isLoggedIn = false; state.user = null; state.currentView = 'home'; renderApp(); };
        window.navigateTo = (view, spec = null, level = null, sub = null) => { window.stopQRScanner(); state.currentView = view; if (spec) state.selectedSpec = spec; if (level) state.selectedLevel = level; if (sub) state.selectedSubject = sub; if(view === 'levels') state.activeTab = 'references'; renderApp(); };
        window.switchTab = (tab) => { state.activeTab = tab; renderMainContent(); if(tab === 'chat') setTimeout(() => { const chatBox = document.getElementById('department-chat-box'); if(chatBox) chatBox.scrollTop = chatBox.scrollHeight; }, 50); };

        window.saveFinanceFees = async (e) => {
            e.preventDefault();
            const spec = document.getElementById('fin-spec').value;
            const batch = document.getElementById('fin-batch').value;
            const amount = parseFloat(document.getElementById('fin-amount').value);
            if (isNaN(amount) || amount < 0) return window.showAlert('مبلغ غير صالح', 'error');

            let targetStudents = state.dbUsers.filter(u => u.role === 'student');
            if(spec !== 'all') targetStudents = targetStudents.filter(u => u.specialization === spec);
            if(batch !== 'all') targetStudents = targetStudents.filter(u => u.batchYear === batch);

            if(targetStudents.length === 0) return window.showAlert('لا يوجد طلاب بهذه المواصفات لتطبيق الرسوم عليهم', 'error');
            
            try {
                let batchOp = db.batch(); let count = 0;
                targetStudents.forEach(stu => {
                    const userRef = db.collection(`artifacts/${appIdStr}/public/data/users`).doc(stu.id);
                    batchOp.update(userRef, { feesRequired: amount }); count++;
                });
                await batchOp.commit(); window.showAlert(`تم تعيين رسوم (${amount}) لعدد ${count} طالب`);
            } catch(e) { window.showAlert('فشل تطبيق الرسوم', 'error'); }
        };

        window.updateStudentPayment = async (userId, paidAmount, requiredAmount) => {
            const val = prompt(`تحديث السداد المالي\nالمطلوب كلياً: ${requiredAmount}\nالمدفوع حالياً: ${paidAmount}\n\nأدخل المبلغ المدفوع الجديد الإجمالي:`, paidAmount || 0);
            if (val === null || val === "") return;
            const parsed = parseFloat(val);
            if (isNaN(parsed) || parsed < 0) return window.showAlert('قيمة غير صالحة', 'error');
            
            try {
                const userRef = db.collection(`artifacts/${appIdStr}/public/data/users`).doc(userId);
                let updateData = { feesPaid: parsed };
                if (parsed >= requiredAmount && requiredAmount > 0) { updateData.isBanned = false; updateData.banReason = ''; }
                await userRef.update(updateData); window.showAlert('تم التحديث بنجاح');
            } catch(e) { window.showAlert('فشل التحديث', 'error'); }
        };

        window.toggleStudentBan = async (userId, currentStatus) => {
            const reason = !currentStatus ? prompt("أدخل سبب حظر الدخول:") : "";
            if(!currentStatus && reason === null) return;
            try { await db.collection(`artifacts/${appIdStr}/public/data/users`).doc(userId).update({ isBanned: !currentStatus, banReason: reason || '' }); window.showAlert('تم تحديث حالة الحظر'); } catch(e) { window.showAlert('فشل', 'error'); }
        };

        window.handleAddContent = async (e, type) => { 
            e.preventDefault(); const data = { spec: state.selectedSpec, level: state.selectedLevel, createdAt: Date.now() }; let coll = ''; 
            if (type === 'ref') { coll = 'references'; data.title = document.getElementById('ref-title').value; data.author = document.getElementById('ref-author').value; data.link = document.getElementById('ref-link').value; } 
            else if (type === 'exam') { coll = 'exams'; data.title = document.getElementById('exam-title').value; data.link = document.getElementById('exam-link').value; } 
            else if (type === 'sub') { coll = 'subjects'; data.title = document.getElementById('sub-title').value; data.doctorId = state.user.id; } 
            else if (type === 'lec') { coll = 'lectures'; data.subjectId = state.selectedSubject; data.title = document.getElementById('lec-title').value; data.type = document.getElementById('lec-type').value; data.link = document.getElementById('lec-link').value; } 
            try { await db.collection(`artifacts/${appIdStr}/public/data/${coll}`).add(data); window.showAlert('تم الإضافة بنجاح'); e.target.reset(); } catch (err) { window.showAlert('فشل', 'error'); }
        };

        window.submitAssignment = async (e) => { e.preventDefault(); const link = document.getElementById('assign-link').value; const subId = document.getElementById('assign-subject').value; try { await db.collection(`artifacts/${appIdStr}/public/data/submissions`).add({ studentId: state.user.id, studentName: state.user.displayName, subjectId: subId, link: link, grade: null, visibleToStudent: false, timestamp: Date.now() }); window.showAlert('تم تسليم الملف بنجاح'); e.target.reset(); } catch (err) { window.showAlert('فشل', 'error'); } };
        window.saveSubmissionGrade = async (e) => { e.preventDefault(); try { await db.collection(`artifacts/${appIdStr}/public/data/submissions`).doc(state.modals.submissionGrade.id).update({ grade: document.getElementById('grade-val').value, visibleToStudent: document.getElementById('grade-vis').checked }); state.modals.submissionGrade = null; window.showAlert('تم التقييم بنجاح'); } catch(err) { window.showAlert('فشل', 'error'); } };
        window.toggleAttendance = async (lecId) => { if(!state.user || state.user.role !== 'student') return; const isAttended = state.user.attendedLectures?.includes(lecId); try { const userRef = db.collection(`artifacts/${appIdStr}/public/data/users`).doc(state.user.id); if(isAttended) { await userRef.update({ attendedLectures: firebase.firestore.FieldValue.arrayRemove(lecId) }); } else { await userRef.update({ attendedLectures: firebase.firestore.FieldValue.arrayUnion(lecId) }); } } catch (err) {} };

        window.handleAddUser = async (e) => { e.preventDefault(); try { await db.collection(`artifacts/${appIdStr}/public/data/users`).add({ displayName: document.getElementById('new-user-name').value, username: document.getElementById('new-user-id').value, password: document.getElementById('new-user-pass').value, role: document.getElementById('new-user-role').value, specialization: document.getElementById('new-user-spec').value, createdAt: Date.now() }); window.showAlert('تم إنشاء الحساب!'); e.target.reset(); } catch (err) { window.showAlert('فشل', 'error'); } };
        
        // --- الدالة المسؤولة عن إدراج طالب للكشوفات الفردية ---
        window.handleAddOfficialStudent = async (e) => {

            if(window.getStudentNameByUniId(cleanUniId)) return window.showAlert('هذا الطالب مسجل مسبقاً بالكشوفات', 'error'); 
            try { 
                await db.collection(`artifacts/${appIdStr}/public/data/official_students`).doc(cleanUniId).set({ 
                    fullName: document.getElementById('official-student-name').value.trim(), 
                    uniId: cleanUniId,

                    createdAt: Date.now() 
                }); 
                window.showAlert('تم إدراج الطالب بنجاح، يمكنه الآن إنشاء حساب'); 
                e.target.reset(); 
            } catch (error) { window.showAlert('حدث خطأ أثناء الإضافة', 'error'); } 
        };
        
        // رفع الـ CSV
        window.handleCSVUpload = () => {
            const fileInput = document.getElementById('csv-file');
            const file = fileInput.files[0];
            if (!file) return window.showAlert('يرجى اختيار ملف CSV أولاً', 'error');

            window.showAlert('جاري معالجة الملف واستخراج البيانات...', 'success');
            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const text = e.target.result;
                    const lines = text.split('\n');
                    let addedCount = 0; let batch = db.batch(); let batchCount = 0;

                    for (let i = 0; i < lines.length; i++) {
                        const line = lines[i].split(',');
                        if (line.length >= 2) {
                            let uniId = ''; let fullName = '';
                            line.forEach(cell => {
                                const clean = cell.replace(/["\r]/g, '').trim();
                                if (/^\d+$/.test(clean) && clean.length >= 5) uniId = clean;
                                else if (clean.length > 5 && !/^\d+$/.test(clean)) fullName = clean;
                            });

                            if (uniId && fullName && !state.officialStudents.find(s => s.uniId === uniId)) {
                                const docRef = db.collection(`artifacts/${appIdStr}/public/data/official_students`).doc(uniId);
                                batch.set(docRef, { fullName, uniId, addedBy: state.user.username, createdAt: Date.now() });
                                batchCount++; addedCount++;
                                if (batchCount === 490) { await batch.commit(); batch = db.batch(); batchCount = 0; }
                            }
                        }
                    }
                    if (batchCount > 0) await batch.commit();
                    window.showAlert(`اكتمل! تم إدراج ${addedCount} طالب بنجاح.`, 'success');
                    fileInput.value = '';
                } catch(err) { window.showAlert('خطأ في معالجة الملف. تأكد من صيغته (CSV)', 'error'); }
            };
            reader.readAsText(file, 'UTF-8');
        };

        window.handleAddSpecialization = async (e) => { e.preventDefault(); try { await db.collection(`artifacts/${appIdStr}/public/data/specializations`).add({ id: 'spec_' + Date.now(), name: document.getElementById('new-spec-title').value, icon: 'book', iconColor: `text-brand-600`, bgGlow: `bg-brand-50`, createdAt: Date.now() }); window.showAlert('تم تأسيس القسم!'); e.target.reset(); } catch (err) { window.showAlert('فشل', 'error'); } };

        // إغلاق نافذة المسح واستئناف الكاميرا فوراً
        window.closeQRModal = () => {

        window.startQRScanner = (mode) => {
            state.scannerActive = true;
            state.scannerMode = mode;
            renderApp();

            setTimeout(() => {
                const qrElement = document.getElementById("qr-reader");
                if(!qrElement) { window.showAlert('حدث خطأ في تحميل الكاميرا', 'error'); return; }

                try {
                    const scanner = new Html5QrcodeScanner("qr-reader", { 
                        fps: 15, 
                        qrbox: { width: 250, height: 250 }, 
                        aspectRatio: 1.0, 
                        formatsToSupport: [ Html5QrcodeSupportedFormats.QR_CODE ] 
                    }, false);
                    
                    state.qrScanner = scanner;
                    scanner.render(async (decodedText) => {
                        scanner.pause(true);
                        const student = state.dbUsers.find(u => u.uniId === decodedText && u.role === 'student');
                        if(!student) { state.modals.qrResult = { type: 'error', title: 'غير مسجل', msg: 'البطاقة غير مدرجة في النظام' }; } 
                        else if (state.scannerMode === 'security') {

                            if(student.isBanned) state.modals.qrResult = { type: 'error', title: 'ممنوع الدخول', msg: `الطالب محظور: ${student.banReason}` };
                            else if(required > 0 && paid < required) state.modals.qrResult = { type: 'error', title: 'مراجعة الحسابات', msg: `غير مسدد للرسوم. (دفع ${paid} من ${required})` };
                            else state.modals.qrResult = { type: 'success', title: 'مسموح الدخول', msg: `الطالب: ${student.displayName}` };
                        } 
                        else if (state.scannerMode === 'doctor') {
                            try { await db.collection(`artifacts/${appIdStr}/public/data/users`).doc(student.id).update({ points: firebase.firestore.FieldValue.increment(5) }); state.modals.qrResult = { type: 'success', title: 'تم تسجيل الحضور', msg: `تم إضافة 5 درجات للطالب ${student.displayName}` }; } catch(e) { state.modals.qrResult = { type: 'error', title: 'خطأ', msg: 'فشل التسجيل' }; }
                        }
                        renderApp();

                    }, (err) => { /* صامت */ });

            }, 500);

                            const student = state.dbUsers.find(u => u.uniId === decodedText && u.role === 'student');

                    const list = isRef ? state.references.filter(r => r.spec === state.selectedSpec && r.level === state.selectedLevel) : state.exams.filter(e => e.spec === state.selectedSpec && e.level === state.selectedLevel);
                    const color = isRef ? 'brand' : 'blue'; const icon = isRef ? 'book-open' : 'clipboard-list';
                    if(canEditContent) {
                        html += `<form onsubmit="event.preventDefault(); window.handleAddContent(event, '${isRef?'ref':'exam'}')" class="glass-card p-6 sm:p-8 rounded-[2rem] mb-8"><h3 class="font-black text-slate-800 mb-5 flex items-center"><div class="bg-${color}-50 p-2 rounded-xl ml-3 border border-${color}-100"><i data-lucide="${isRef?'cloud-upload':'file-question'}" class="w-5 h-5 text-${color}-600"></i></div> إضافة ${isRef?'مرجع':'اختبار'} جديد</h3><div class="grid grid-cols-1 md:grid-cols-5 gap-4"><div class="col-span-2"><input type="text" id="${isRef?'ref-title':'exam-title'}" required placeholder="العنوان..." class="w-full p-4 bg-white border border-slate-200 rounded-xl font-bold outline-none shadow-sm focus:border-brand-400"></div>${isRef ? `<div class="col-span-1"><input type="text" id="ref-author" required placeholder="المؤلف..." class="w-full p-4 bg-white border border-slate-200 rounded-xl font-bold outline-none shadow-sm focus:border-brand-400"></div>` : ''}<div class="col-span-${isRef?'1':'2'}"><input type="url" id="${isRef?'ref-link':'exam-link'}" required placeholder="الرابط..." class="w-full p-4 bg-white border border-slate-200 rounded-xl font-bold outline-none shadow-sm focus:border-brand-400" dir="ltr"></div><button type="submit" class="col-span-1 btn-modern font-bold rounded-xl text-lg">إضافة</button></div></form>`;
                    }
                    html += `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">`;
                    list.forEach((item) => { html += `<div class="glass-card p-6 rounded-3xl flex flex-col group animate-slide-up hover:border-${color}-300 transition-colors"><div class="flex items-start mb-6"><div class="bg-white border border-slate-100 p-3.5 rounded-2xl ml-4 text-slate-400 group-hover:text-${color}-500 group-hover:bg-${color}-50 transition-colors shadow-sm"><i data-lucide="${icon}" class="w-6 h-6"></i></div><div><h3 class="font-bold text-lg text-slate-900">${item.title}</h3>${item.author ? `<p class="text-sm text-slate-500 mt-1 font-medium">${item.author}</p>`:''}</div></div><div class="mt-auto flex justify-between pt-4 border-t border-slate-100"><a href="${item.link}" target="_blank" class="text-slate-600 bg-white border border-slate-200 px-4 py-2 rounded-xl font-bold text-sm flex items-center hover:bg-slate-50 transition-colors shadow-sm"><i data-lucide="external-link" class="w-4 h-4 ml-1.5 text-${color}-500"></i> تصفح الرابط</a>${canEditContent ? `<button onclick="window.requestDelete('${item.id}', '${isRef?'ref':'exam'}')" class="text-red-400 hover:bg-red-50 p-2 rounded-xl transition-colors"><i data-lucide="trash-2" class="w-4 h-4"></i></button>` : ''}</div></div>`; });
                    html += list.length === 0 ? `<div class="col-span-full flex flex-col items-center py-12 glass-card rounded-3xl border-dashed border-2 border-slate-200"><div class="bg-slate-50 p-4 rounded-full mb-3"><i data-lucide="inbox" class="w-8 h-8 text-slate-300"></i></div><p class="text-slate-500 font-bold text-sm">لا يوجد محتوى حالياً.</p></div>` : '</div>';
                
                } else if (state.activeTab === 'subjects') {
                    const subs = state.subjects.filter(s => s.spec === state.selectedSpec && s.level === state.selectedLevel);
                    if(canEditContent) html += `<form onsubmit="event.preventDefault(); window.handleAddContent(event, 'sub')" class="glass-card p-6 sm:p-8 rounded-[2rem] mb-8 flex flex-col sm:flex-row gap-4 items-end animate-slide-up"><div class="flex-grow w-full"><label class="block text-sm font-bold text-slate-600 mb-2 ml-1">اسم المادة</label><input type="text" id="sub-title" required placeholder="مثال: فيزياء 1" class="w-full p-4 bg-white border border-slate-200 rounded-xl font-bold outline-none shadow-sm focus:border-brand-400"></div><button type="submit" class="btn-modern w-full sm:w-auto h-[58px] px-8 rounded-xl font-bold flex items-center justify-center gap-2"><i data-lucide="plus-circle" class="w-5 h-5"></i> إضافة المادة</button></form>`;
                    html += `<div class="grid grid-cols-1 md:grid-cols-2 gap-5">`;
                    subs.forEach((s, idx) => {
                        const lecCount = state.lectures.filter(l => l.subjectId === s.id).length;
                        html += `<div class="glass-card p-5 sm:p-6 rounded-3xl cursor-pointer group flex justify-between items-center animate-slide-up hover:border-brand-300 transition-all"><div onclick="window.navigateTo('lectures', null, null, '${s.id}')" class="flex-grow flex items-center h-full"><div class="bg-white border border-slate-100 p-3.5 rounded-2xl ml-4 group-hover:bg-brand-50 group-hover:border-brand-100 transition-colors shadow-sm"><i data-lucide="folder-open" class="w-6 h-6 text-slate-400 group-hover:text-brand-500"></i></div><div><h3 class="font-extrabold text-lg text-slate-800 group-hover:text-brand-600 transition-colors">${s.title}</h3><p class="text-xs text-slate-500 font-medium mt-1">${lecCount} محتوى / تمارين</p></div></div>${canEditContent ? `<button onclick="window.requestDelete('${s.id}', 'sub')" class="text-red-400 hover:text-red-600 hover:bg-red-50 p-2.5 rounded-xl ml-2 transition-colors"><i data-lucide="trash-2" class="w-4 h-4"></i></button>` : `<div class="bg-white p-2.5 rounded-xl border border-slate-100 ml-2 group-hover:bg-brand-50 transition-colors shadow-sm"><i data-lucide="chevron-left" class="w-4 h-4 text-slate-400 group-hover:text-brand-500"></i></div>`}</div>`;
                    });
                    html += subs.length === 0 ? '<div class="col-span-full flex flex-col items-center justify-center py-12 glass-card rounded-[2rem] border-dashed border-2 border-slate-200"><div class="bg-slate-50 p-4 rounded-full mb-3"><i data-lucide="folder-x" class="w-8 h-8 text-slate-300"></i></div><p class="text-slate-500 font-bold text-sm">لم يتم إضافة مواد دراسية بعد.</p></div>' : '</div>';
                
                } else if (state.activeTab === 'chat') {
                    const specChats = state.chats.filter(c => c.specId === state.selectedSpec);
                    html += `<div class="glass-card rounded-[2rem] flex flex-col h-[600px] overflow-hidden animate-slide-up"><div class="bg-white/50 border-b border-slate-200 p-4 flex justify-between items-center"><div class="flex items-center"><div class="bg-white text-emerald-600 p-2 rounded-xl ml-3 border border-slate-200 shadow-sm"><i data-lucide="messages-square" class="w-5 h-5"></i></div><div><h3 class="font-black text-slate-800 text-base">غرفة نقاش: ${specName}</h3><p class="text-xs text-emerald-600 font-bold flex items-center mt-0.5"><div class="w-2 h-2 bg-emerald-500 rounded-full ml-1.5 animate-pulse"></div> متصل الآن</p></div></div></div><div id="department-chat-box" class="flex-grow p-5 sm:p-6 overflow-y-auto custom-scrollbar flex flex-col gap-4 bg-slate-50/50 inner-shadow">${specChats.length === 0 ? `<div class="flex-grow flex flex-col items-center justify-center opacity-70"><div class="bg-white p-4 rounded-full shadow-sm mb-3 border border-slate-100"><i data-lucide="message-circle-dashed" class="w-8 h-8 text-slate-300"></i></div><h4 class="text-base font-bold text-slate-500">ابدأ النقاش الأكاديمي.</h4></div>` : specChats.map((chat) => { const isMe = chat.senderId === state.user.id; const isPriv = ['admin', 'doctor', 'super_admin'].includes(chat.senderRole); return `<div class="flex flex-col ${isMe?'items-end':'items-start'}"><div class="flex items-baseline gap-2 mb-1">${!isMe?`<span class="text-[10px] font-bold text-slate-400 ml-1">${chat.senderName}</span>`:''}${isPriv&&!isMe?`<span class="tag-modern px-1.5 py-0.5 rounded text-[9px]">أستاذ/مشرف</span>`:''}</div><div class="flex items-end gap-2 max-w-[90%] sm:max-w-[85%]"><div class="relative p-3.5 px-5 rounded-2xl shadow-sm text-sm font-medium border ${isMe?'bg-brand-500 border-brand-600 text-white rounded-bl-none':(isPriv?'bg-amber-50 border-amber-200 text-slate-800 rounded-br-none':'bg-white border-slate-200 text-slate-700 rounded-br-none')}">${chat.text}<span class="block text-[9px] mt-1.5 opacity-70 font-sans ${isMe?'text-left text-brand-100':'text-right text-slate-400'}">${window.formatTime(chat.timestamp)}</span></div>${(canEditContent||isMe)?`<button onclick="window.requestDelete('${chat.id}', 'chat')" class="text-red-300 hover:text-red-500 p-1 bg-white rounded-full shadow-sm border border-slate-100 transition-colors"><i data-lucide="trash" class="w-3.5 h-3.5"></i></button>`:''}</div></div>`; }).join('')}</div><div class="p-3 sm:p-4 bg-white border-t border-slate-200"><form onsubmit="window.handleSendChatMessage(event)" class="flex gap-2 sm:gap-3"><input type="text" id="chat-msg-input" placeholder="اكتب رسالتك..." required class="w-full flex-grow p-3 sm:p-4 bg-slate-50 border border-slate-200 rounded-xl font-medium text-slate-800 outline-none focus:border-brand-400 text-sm"><button type="submit" class="bg-slate-900 text-white px-5 sm:px-6 rounded-xl shadow-md hover:bg-slate-800 transition-colors"><i data-lucide="send" class="w-4 h-4 sm:w-5 sm:h-5 rotate-180"></i></button></form></div></div>`;
                }
                html += `</div>`;
            }

            else if (state.currentView === 'lectures') {
                const sub = state.subjects.find(s => s.id === state.selectedSubject);
                const lecs = state.lectures.filter(l => l.subjectId === state.selectedSubject).sort((a,b)=>a.createdAt - b.createdAt);
                const mySubs = state.submissions.filter(s => s.studentId === state.user.id && s.subjectId === state.selectedSubject);

                html = `
                <div class="animate-fade-in flex-grow flex flex-col space-y-6">
                    <button onclick="window.navigateTo('tabs')" class="text-slate-500 font-bold flex items-center bg-white px-5 py-2.5 rounded-full border border-slate-200 shadow-sm w-max hover:bg-slate-50 transition-colors"><i data-lucide="arrow-right" class="w-4 h-4 ml-2"></i> رجوع للمواد</button>
                    
                    <div class="glass-card p-6 sm:p-8 rounded-[2rem] flex flex-col sm:flex-row items-start sm:items-center gap-5 relative overflow-hidden">
                        <div class="absolute left-0 top-0 bottom-0 w-2 bg-brand-400"></div>
                        <div class="bg-brand-50 p-4 rounded-2xl border border-brand-100 shadow-sm"><i data-lucide="monitor-play" class="w-8 h-8 text-brand-600"></i></div>
                        <div><p class="text-slate-500 text-xs font-bold mb-1">المحتوى التعليمي والمهام</p><h2 class="text-2xl sm:text-3xl font-black text-slate-900">${sub?.title}</h2></div>
                    </div>

                    ${canEditContent ? `
                    <form onsubmit="event.preventDefault(); window.handleAddContent(event, 'lec')" class="glass-card p-6 sm:p-8 rounded-[2rem] flex flex-col gap-4">
                        <h3 class="font-black text-lg mb-2 text-slate-800 border-b border-slate-100 pb-3"><i data-lucide="plus-circle" class="w-5 h-5 inline-block text-brand-500 ml-1"></i> إضافة محتوى / تمرين للمادة</h3>
                        <div class="flex flex-col md:flex-row gap-4 w-full">
                            <div class="flex-grow w-full"><label class="block text-sm font-bold text-slate-600 mb-2 ml-1">عنوان الدرس/التمرين</label><input type="text" id="lec-title" required placeholder="اكتب العنوان هنا..." class="w-full p-4 bg-white border border-slate-200 rounded-xl font-bold outline-none focus:border-brand-400 shadow-sm"></div>
                            <div class="w-full md:w-48"><label class="block text-sm font-bold text-slate-600 mb-2 ml-1">نوع المحتوى</label><select id="lec-type" class="w-full p-4 bg-white border border-slate-200 rounded-xl font-bold outline-none focus:border-brand-400 shadow-sm"><option value="video">🎥 فيديو / يوتيوب</option><option value="pdf">📄 PDF / ملزمة</option><option value="ppt">📊 PPT</option></select></div>
                        </div>
                        <div class="flex flex-col md:flex-row gap-4 w-full items-end">
                            <div class="flex-grow w-full"><label class="block text-sm font-bold text-slate-600 mb-2 ml-1">الرابط المباشر للمحتوى</label><input type="url" id="lec-link" required placeholder="الرابط الخارجي (درايف/يوتيوب)..." class="w-full p-4 bg-white border border-slate-200 rounded-xl font-bold outline-none focus:border-brand-400 shadow-sm" dir="ltr"></div>
                            <button type="submit" class="btn-modern w-full md:w-auto px-8 h-[58px] rounded-xl font-bold whitespace-nowrap"><i data-lucide="upload-cloud" class="w-5 h-5 ml-2 inline-block"></i> نشر المحتوى</button>
                        </div>
                    </form>` : ''}

                    <div class="space-y-4 mb-8">
                        ${lecs.map((lec, index) => {
                            let icon = 'play-circle', color = 'blue';
                            if(lec.type === 'pdf') { icon = 'file-text'; color = 'red'; }
                            if(lec.type === 'ppt') { icon = 'presentation'; color = 'orange'; }
                            const isAttended = state.user.role === 'student' && state.user.attendedLectures?.includes(lec.id);
                            return `
                            <div class="glass-card p-5 sm:p-6 rounded-2xl flex flex-col lg:flex-row justify-between items-start lg:items-center gap-5 transition-all group ${isAttended ? 'border-2 border-emerald-300 bg-emerald-50/50' : 'hover:border-brand-200'}">
                                <div class="flex items-center gap-4 w-full lg:w-auto">
                                    <div class="bg-white p-4 rounded-2xl text-${color}-500 border border-slate-100 flex-shrink-0 shadow-sm group-hover:scale-105 transition-transform"><i data-lucide="${icon}" class="w-6 h-6"></i></div>
                                    <div>
                                        <div class="flex items-center gap-2 mb-1.5"><span class="text-[10px] font-black bg-slate-100 text-slate-500 px-2 py-0.5 rounded border border-slate-200">#${String(index + 1).padStart(2, '0')}</span>${isAttended ? '<span class="text-[10px] font-bold bg-emerald-100 text-emerald-700 border border-emerald-200 px-2 py-0.5 rounded flex items-center shadow-sm"><i data-lucide="check-check" class="w-3 h-3 ml-1"></i> مكتمل</span>' : ''}</div>
                                        <span class="font-bold text-base sm:text-lg text-slate-800 break-words line-clamp-2">${lec.title}</span>
                                    </div>
                                </div>
                                <div class="flex gap-2 w-full lg:w-auto shrink-0 flex-wrap sm:flex-nowrap">
                                    ${state.user.role === 'student' ? `<button onclick="window.toggleAttendance('${lec.id}')" class="flex-1 sm:flex-none justify-center px-4 py-2.5 rounded-xl font-bold text-sm border flex items-center transition-all ${isAttended ? 'bg-emerald-50 text-emerald-600 border-emerald-200' : 'bg-white text-slate-500 border-slate-200 hover:bg-slate-50'} shadow-sm"><i data-lucide="${isAttended ? 'check-circle-2' : 'circle'}" class="w-4 h-4 ml-1.5"></i> ${isAttended ? 'مكتمل' : 'تعليم كمكتمل'}</button>` : ''}
                                    <a href="${lec.link}" target="_blank" class="flex-1 sm:flex-none justify-center text-white bg-slate-800 px-5 py-2.5 rounded-xl font-bold text-sm flex items-center hover:bg-slate-900 shadow-sm transition-colors"><i data-lucide="external-link" class="w-4 h-4 ml-1.5 text-slate-300"></i> فتح</a>
                                    ${canEditContent ? `<button onclick="window.requestDelete('${lec.id}', 'lec')" class="bg-white text-red-400 hover:bg-red-50 hover:text-red-600 border border-slate-200 p-2.5 rounded-xl transition-colors shadow-sm"><i data-lucide="trash-2" class="w-4 h-4"></i></button>` : ''}
                                </div>
                            </div>`}).join('')}
                        ${lecs.length === 0 ? '<div class="flex flex-col items-center justify-center py-12 glass-card rounded-[2rem] border-dashed border-2 border-slate-200"><div class="bg-slate-50 p-4 rounded-full mb-3"><i data-lucide="inbox" class="w-8 h-8 text-slate-300"></i></div><p class="text-slate-500 font-bold text-sm">لم يتم رفع محتوى للمادة بعد.</p></div>' : ''}
                    </div>

                    ${state.user.role === 'student' ? `
                    <div class="glass-card p-6 sm:p-8 rounded-[2rem] mt-8">
                        <h3 class="text-lg font-black text-slate-800 mb-6 flex items-center border-b border-slate-100 pb-3"><div class="bg-brand-50 p-2 rounded-lg ml-3 border border-brand-100"><i data-lucide="upload-cloud" class="w-4 h-4 text-brand-600"></i></div> تسليم المهام والبحوث للمادة</h3>
                        <form onsubmit="window.submitAssignment(event)" class="flex flex-col md:flex-row gap-4 items-end mb-8">
                            <input type="hidden" id="assign-subject" value="${state.selectedSubject}">
                            <div class="flex-grow w-full"><label class="block text-sm font-bold text-slate-600 mb-2 ml-1">رابط التسليم (Google Drive / المرفق)</label><input type="url" id="assign-link" required class="w-full p-4 bg-white border border-slate-200 rounded-xl font-bold outline-none focus:border-brand-400 shadow-sm" dir="ltr" placeholder="https://..."></div>
                            <button type="submit" class="btn-modern w-full md:w-auto px-8 py-4 rounded-xl font-bold h-[58px] flex justify-center items-center"><i data-lucide="send" class="w-4 h-4 inline-block ml-2"></i> إرسال التكليف</button>
                        </form>
                        <h4 class="font-bold text-slate-600 mb-4 border-b border-slate-100 pb-2 flex items-center text-sm"><i data-lucide="history" class="w-3 h-3 ml-1.5 text-slate-400"></i> سجل تسليماتك السابقة</h4>
                        <div class="space-y-3">
                            ${mySubs.length === 0 ? '<p class="text-slate-400 text-xs font-bold bg-white p-4 rounded-xl text-center border border-slate-100">لم تقم برفع أي مهام لهذه المادة حتى الآن.</p>' : mySubs.map(s => `
                                <div class="bg-white p-4 rounded-2xl border border-slate-100 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 shadow-sm">
                                    <div><p class="text-[10px] text-slate-400 font-bold mb-1.5">${window.formatTime(s.timestamp)}</p><a href="${s.link}" target="_blank" class="text-blue-600 font-bold text-xs flex items-center hover:underline bg-blue-50 px-3 py-1.5 rounded-lg border border-blue-100 w-max transition-colors"><i data-lucide="external-link" class="w-3 h-3 ml-1"></i> عرض المرفق المُرسل</a></div>
                                    <div class="w-full sm:w-auto text-left">${s.grade ? (s.visibleToStudent ? `<span class="bg-green-50 text-green-700 border border-green-200 px-3 py-1.5 rounded-xl font-black text-xs shadow-sm flex items-center justify-center sm:inline-flex"><i data-lucide="check-circle" class="w-3 h-3 ml-1"></i> النتيجة: ${s.grade}</span>` : `<span class="text-amber-600 bg-amber-50 px-3 py-1.5 rounded-lg text-[10px] font-bold border border-amber-200">النتيجة مخفية (تم التقييم)</span>`) : `<span class="text-slate-500 bg-slate-50 px-3 py-1.5 rounded-lg text-[10px] font-bold border border-slate-200 flex items-center w-max"><i data-lucide="clock" class="w-3 h-3 ml-1"></i> قيد مراجعة الأستاذ</span>`}</div>
                                </div>`).join('')}
                        </div>
                    </div>` : ''}
                </div>`;
            }

            container.innerHTML = html;
            if(typeof lucide !== 'undefined') lucide.createIcons();
        }

        document.addEventListener('DOMContentLoaded', renderApp);
    </script>
</body>
</html>
