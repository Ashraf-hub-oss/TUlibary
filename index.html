<html lang="ar" dir="rtl">
<head>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Tajawal', 'sans-serif'] },
                    colors: {
                        brand: { 50: '#fffdf6', 100: '#fffbe6', 200: '#fff3c2', 300: '#ffe58a', 400: '#ffd043', 500: '#fcaf0b', 600: '#e18900', 700: '#bb6002', 800: '#984a08', 900: '#7c3d0b' }
                    }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap');
        
        body { 
            background-color: #faf9f6; 
            -webkit-font-smoothing: antialiased;
            color: #334155;
            overflow-x: hidden;
        }

        .bg-blobs {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: -1; overflow: hidden;
            background: radial-gradient(at 0% 0%, rgba(252, 175, 11, 0.05) 0px, transparent 50%),
                        radial-gradient(at 100% 0%, rgba(59, 130, 246, 0.05) 0px, transparent 50%),
                        radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.05) 0px, transparent 50%);
        }
        .blob {
            position: absolute;
            filter: blur(80px);
            opacity: 0.6;
            animation: floatBlob 15s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes floatBlob {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(5vw, 10vh) scale(1.1); }
            100% { transform: translate(-5vw, -5vh) scale(0.9); }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.05), 0 0 10px rgba(252, 175, 11, 0.02) inset;
        }

        .animate-fade-in { animation: fadeIn 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
        .animate-slide-up { animation: slideUp 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }

        /* تحولات سلسة وانسيابية بين الصفحات والتبويبات */
        .page-transition-enter {
            animation: smoothPageEnter 0.42s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            will-change: transform, opacity, filter;
        }
        .page-transition-exit {
            animation: smoothPageExit 0.16s cubic-bezier(0.4, 0, 1, 1) forwards;
            pointer-events: none;
            will-change: transform, opacity, filter;
        }
        @keyframes smoothPageEnter {
            0% { opacity: 0; transform: translateY(14px) scale(0.992); filter: blur(4px); }
            100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
        }
        @keyframes smoothPageExit {
            0% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
            100% { opacity: 0; transform: translateY(-8px) scale(0.992); filter: blur(3px); }
        }

        .btn-modern {
            background: linear-gradient(135deg, #fcaf0b 0%, #e18900 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(252, 175, 11, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
        }
        .btn-modern::after {
            content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.3), transparent);
            transform: skewX(-20deg); transition: 0.5s;
        }
        .btn-modern:hover::after { left: 150%; }
        .btn-modern:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(252, 175, 11, 0.4); }
        .btn-modern:active { transform: translateY(1px); }

        .btn-modern-outline {
            background: rgba(255, 253, 246, 0.8); backdrop-filter: blur(10px);
            color: #bb6002; border: 1px solid #fcaf0b;
            box-shadow: 0 2px 8px rgba(252, 175, 11, 0.1); transition: all 0.3s ease;
        }
        .btn-modern-outline:hover { background: #fffbe6; transform: translateY(-2px); box-shadow: 0 6px 15px rgba(252, 175, 11, 0.15); }

        .tag-modern { background: linear-gradient(135deg, #ffffff 0%, #fffbe6 100%); border: 1px solid rgba(252, 175, 11, 0.2); color: #bb6002; font-weight: 800; }

        .tab-btn { transition: all 0.3s ease; }
        .tab-active { background-color: white; color: #bb6002; box-shadow: 0 4px 12px rgba(252, 175, 11, 0.1); font-weight: 800; border-radius: 0.75rem; border: 1px solid rgba(252, 175, 11, 0.2);}
        .tab-inactive { color: #64748b; font-weight: 500; }
        .tab-inactive:hover { color: #bb6002; background-color: rgba(255,255,255,0.8); }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #fcaf0b; border-radius: 10px; opacity: 0.5;}

        #qr-reader { width: 100% !important; max-width: 350px; margin: 0 auto; border: 3px solid #fcaf0b !important; border-radius: 1.5rem; overflow: hidden; background-color: #000; box-shadow: 0 10px 25px rgba(252, 175, 11, 0.2);}
        #qr-reader video { width: 100% !important; height: auto !important; object-fit: cover !important; border-radius: 1.5rem; }
        #qr-reader__dashboard_section_csr button { background: linear-gradient(135deg, #fcaf0b 0%, #e18900 100%); color: white; border: none; padding: 12px 24px; border-radius: 12px; font-family: 'Tajawal'; font-weight: 800; margin-top: 10px; cursor: pointer; box-shadow: 0 4px 15px rgba(252, 175, 11, 0.3); }
        #qr-reader__dashboard_section_swaplink { display: none !important; }

        .id-card {
            background: linear-gradient(135deg, #ffffff 0%, #fffdf6 100%);
            box-shadow: 0 20px 40px -10px rgba(252, 175, 11, 0.2);
            border: 1px solid rgba(252, 175, 11, 0.3);
            position: relative; overflow: hidden;
        }
        .id-card::before {
            content: ''; position: absolute; top: -50px; right: -50px; width: 150px; height: 150px;
            background: radial-gradient(circle, rgba(252,175,11,0.15) 0%, transparent 70%); border-radius: 50%; pointer-events: none;
        }

        /* نبض نقطة الاتصال (أخضر / أحمر) */
        .status-dot-online {
            background-color: #10b981;
            box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
            animation: pulseGreen 2s infinite;
        }
        .status-dot-offline {
            background-color: #ef4444;
            box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
            animation: pulseRed 2s infinite;
        }
        @keyframes pulseGreen {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
        @keyframes pulseRed {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        /* شريط تقدم شاشة التحميل (20 ثانية) */
        .loading-bar-progress {
            animation: loadingProgress 20s linear forwards;
        }
        @keyframes loadingProgress {
            0% { width: 3%; }
            100% { width: 100%; }
        }

        /* خط التحميل الصغير داخل صناديق الإعدادات ومربع البحث */
        .card-progress-container {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: rgba(252, 175, 11, 0.15);
            overflow: hidden;
            z-index: 30;
            border-radius: 9999px;
        }
        .card-progress-bar {
            width: 45%;
            height: 100%;
            background: linear-gradient(90deg, #fcaf0b, #e18900, #10b981);
            border-radius: 9999px;
            animation: indeterminateSlide 0.9s infinite ease-in-out;
        }
        @keyframes indeterminateSlide {
            0% { transform: translateX(110%); }
            100% { transform: translateX(-230%); }
        }
    </style>
</head>

    <script>

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);

        const defaultSpecializations = [

            { id: 'civil', name: 'هندسة مدنية', icon: 'hard-hat', iconColor: 'text-blue-600', bgGlow: 'bg-blue-50' },
            { id: 'architectural', name: 'هندسة معمارية', icon: 'building-2', iconColor: 'text-emerald-600', bgGlow: 'bg-emerald-50' }
        ];
        
        const levels = [
            { id: 'level_1', name: 'المستوى الأول', num: '01' }, { id: 'level_2', name: 'المستوى الثاني', num: '02' },
            { id: 'level_3', name: 'المستوى الثالث', num: '03' }, { id: 'level_4', name: 'المستوى الرابع', num: '04' }, { id: 'level_5', name: 'المستوى الخامس', num: '05' }
        ];

        const ROLES_MAP = {
            student: 'طالب', admin: 'مشرف قسم', doctor: 'دكتور/أستاذ', super_admin: 'مدير عام',
            dean: 'عميد الكلية', finance: 'الحسابات المالية', security: 'أمن البوابة'
        };

        const state = {
            // حالات الاتصال وتحميل قاعدة البيانات والصور المسبقة
            isInitialLoading: true,
            usersLoaded: false,
            officialStudentsLoaded: false,
            settingsLoaded: false,
            isOnline: navigator.onLine,
            dbConnected: false,
            isReconnecting: false,
            loadTimedOut: false,
            leftAppTimestamp: null,
            isPickingFile: false,

            // إعدادات الهوية وفريق التصميم (يتحكم بها الـ super_admin)
            branding: {
                loginLogoUrl: '',
                loginLogoDirect: '',
                loginLogoReady: false,
                aiLogoUrl: '',
                aiLogoDirect: '',
                aiLogoReady: false,
                teamInfo: '',
                teamLogoUrl: '',
                teamLogoDirect: '',
                teamLogoReady: false
            },

            // حالة المساعد الذكي ash ai
            ashAi: {
                isOpen: false,
                isTyping: false,
                apiKey: 'AQ.Ab8RN6LqfruJVQgH8PDBQpjPA40VECZAbI8jACkFSookWQN68w',
                messages: [
                    {
                        role: 'model',
                        text: 'مرحباً بك في منصة الجامعة التكنولوجية! أنا المساعد الذكي (ash ai) 🤖✨ كيف يمكنني مساعدتك اليوم في استخدام المنصة أو الإجابة على أسئلتك الدراسية؟',
                        time: Date.now()
                    }
                ]
            },

            // تقويم اختيار سنة الالتحاق التفاعلي (يعرض السنوات فقط)
            yearPicker: {
                isOpen: false,
                targetInputId: null,
                selectedYear: '',
                startYear: 2016
            },

            // جولة تعريفية (Tutorial) تظهر مرة واحدة عند الدخول لأول مرة
            tutorial: {
                show: false,
                step: 0
            },

            isLoggedIn: false, user: null, currentView: 'home', showRegister: false,
            selectedSpec: null, selectedLevel: null, selectedSubject: null,
            activeTab: 'references', viewerData: null,
            adminUsersSubTab: 'active_users',
            vaultBatchFilter: 'all', vaultSubjectFilter: 'all', showSubjectVault: false,
            alert: { show: false, message: '', type: 'success' },
            confirm: { show: false, id: null, type: '', message: '', extra: null },
            searchBar: '', docFilters: { spec: 'all', level: 'all' }, 
            references: [], subjects: [], lectures: [], exams: [], news: [], chats: [], dbUsers: [], dynamicSpecializations: [],
            officialStudents: [], deanChats: [], submissions: [],
            qrScanner: null, scannerActive: false, scannerMode: '', qrScannerTimeout: null,
            modals: { qrResult: null, submissionGrade: null, paymentUpdate: null, banModal: null, csvPreview: null, editUser: null, editOfficialStudent: null, archiveLectures: null }
        };

        // خطوات الجولة التعريفية (Tutorial) للطلاب والمستخدمين الجدد
        const PLATFORM_TUTORIAL_STEPS = [
            {
                icon: 'sparkles',
                color: 'brand',
                title: 'مرحباً بك في منصة الجامعة التكنولوجية! 🎓',
                desc: 'يسعدنا انضمامك إلينا! أعددنا لك هذه الجولة السريعة لتتعرف على كيفية استخدام المنصة والاستفادة من كافة خدماتها الأكاديمية بسهولة.'
            },
            {
                icon: 'layers',
                color: 'blue',
                title: 'الأقسام والمحاضرات ومخزن الدفعات 📚',
                desc: 'من الصفحة الرئيسية، اختر قسمك ثم المستوى الدراسي لتصفح (المراجع، المواد، والاختبارات)، كما يمكنك الدخول إلى "مخزن المحاضرات" للوصول إلى محاضرات الدفعات السابقة في أي وقت.'
            },
            {
                icon: 'upload-cloud',
                color: 'emerald',
                title: 'تسليم التكليفات وغرف النقاش 📝',
                desc: 'داخل صفحة كل مادة دراسية يمكنك تسليم واجباتك وبحوثك عبر روابط Google Drive ومتابعة درجتك فور رصدها، بالإضافة إلى المشاركة في غرفة النقاش العلمية الخاصة بقسمك.'
            },
            {
                icon: 'id-card',
                color: 'indigo',
                title: 'البطاقة الجامعية الذكية (QR & NFC) 🪪',
                desc: 'من الشريط العلوي، اضغط على "البطاقة الجامعية" لعرض رمز QR الخاص بك أو استخدام NFC لتسجيل حضورك في المحاضرات وكسب النقاط، أو للمرور السريع عبر بوابة الأمن.'
            },
            {
                icon: 'bot',
                color: 'amber',
                title: 'المساعد الذكي الفوري (ash ai) 🤖',
                desc: 'في أسفل يسار الشاشة يتواجد المساعد الذكي (ash ai) طوال الوقت للإجابة الفورية على استفساراتك حول المنصة ومساعدتك في أسئلتك الأكاديمية!'
            }
        ];

        // التحقق من عرض التوتوريال لأول مرة فقط لكل مستخدم
        window.checkAndTriggerTutorial = () => {
            if (!state.isLoggedIn || !state.user) return;
            try {
                const userKey = `tu_tutorial_completed_${state.user.id || state.user.username || 'guest'}`;
                const alreadySeen = localStorage.getItem(userKey);
                if (!alreadySeen) {
                    state.tutorial.show = true;
                    state.tutorial.step = 0;
                }
            } catch (e) {}
        };

        window.nextTutorialStep = () => {
            if (state.tutorial.step < PLATFORM_TUTORIAL_STEPS.length - 1) {
                state.tutorial.step++;
                renderApp();
            } else {
                window.finishTutorial();
            }
        };

        window.prevTutorialStep = () => {
            if (state.tutorial.step > 0) {
                state.tutorial.step--;
                renderApp();
            }
        };

        window.finishTutorial = () => {
            state.tutorial.show = false;
            state.tutorial.step = 0;
            try {
                if (state.user) {
                    const userKey = `tu_tutorial_completed_${state.user.id || state.user.username || 'guest'}`;
                    localStorage.setItem(userKey, 'true');
                }
            } catch (e) {}
            renderApp();
        };

        window.openTutorialManually = () => {
            state.tutorial.show = true;
            state.tutorial.step = 0;
            renderApp();
        };

        // دوال تقويم السنوات التفاعلي لاختيار سنة الالتحاق بالجامعة
        window.openYearCalendar = (targetInputId) => {
            const inputEl = document.getElementById(targetInputId);
            const currentVal = inputEl ? parseInt(inputEl.value, 10) : NaN;
            const currentYear = new Date().getFullYear();
            const baseYear = !isNaN(currentVal) ? currentVal : currentYear;

            state.yearPicker.targetInputId = targetInputId;
            state.yearPicker.selectedYear = !isNaN(currentVal) ? String(currentVal) : '';
            state.yearPicker.startYear = Math.floor((baseYear - 4) / 12) * 12 + 2;
            if (state.yearPicker.startYear > currentYear - 8) {
                state.yearPicker.startYear = currentYear - 9;
            }
            state.yearPicker.isOpen = true;
            window.renderYearCalendarModal();
        };

        window.changeYearCalendarPage = (delta) => {
            state.yearPicker.startYear += (delta * 12);
            window.renderYearCalendarModal();
        };

        window.selectYearFromCalendar = (year) => {
            const yearStr = String(year);
            state.yearPicker.selectedYear = yearStr;
            const targetId = state.yearPicker.targetInputId;
            const inputEl = targetId ? document.getElementById(targetId) : null;
            if (inputEl) {
                inputEl.value = yearStr;
            }
            const labelEl = targetId ? document.getElementById(targetId + '-label') : null;
            if (labelEl) {
                labelEl.textContent = `دفعة سنة ${yearStr}`;
                labelEl.classList.remove('text-slate-400');
                labelEl.classList.add('text-slate-800', 'font-black');
            }
            state.yearPicker.isOpen = false;
            window.renderYearCalendarModal();
        };

        window.closeYearCalendar = () => {
            state.yearPicker.isOpen = false;
            window.renderYearCalendarModal();
        };

        window.renderYearCalendarModal = () => {
            let modalRoot = document.getElementById('year-calendar-modal-root');
            if (!modalRoot) {
                modalRoot = document.createElement('div');
                modalRoot.id = 'year-calendar-modal-root';
                document.body.appendChild(modalRoot);
            }
            if (!state.yearPicker.isOpen) {
                modalRoot.innerHTML = '';
                return;
            }

            const start = state.yearPicker.startYear;
            const end = start + 11;
            const thisYear = new Date().getFullYear();
            const years = [];
            for (let y = start; y <= end; y++) years.push(y);

            modalRoot.innerHTML = `
                <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[120] flex items-center justify-center p-4 animate-fade-in" onclick="window.closeYearCalendar()">
                    <div class="glass-card rounded-[2rem] p-6 w-full max-w-sm border-2 border-brand-200 shadow-2xl animate-slide-up" onclick="event.stopPropagation()">
                        <div class="flex items-center justify-between border-b border-slate-100 pb-4 mb-4">
                            <div class="flex items-center gap-2.5">
                                <div class="bg-brand-50 text-brand-600 p-2.5 rounded-xl border border-brand-200">
                                    <i data-lucide="calendar" class="w-5 h-5"></i>
                                </div>
                                <div class="text-right">
                                    <h3 class="font-black text-slate-800 text-base">تقويم سنة الالتحاق</h3>
                                    <p class="text-[11px] text-slate-500 font-bold">تصفح واختر سنة إضافتك بالجامعة</p>
                                </div>
                            </div>
                            <button type="button" onclick="window.closeYearCalendar()" class="p-2 bg-slate-100 hover:bg-slate-200 text-slate-500 rounded-full transition-colors">
                                <i data-lucide="x" class="w-4 h-4"></i>
                            </button>
                        </div>

                        <!-- شريط التنقل بين نطاقات السنوات -->
                        <div class="flex items-center justify-between bg-slate-50 border border-slate-200/80 rounded-2xl p-2 mb-4">
                            <button type="button" onclick="window.changeYearCalendarPage(-1)" class="p-2 hover:bg-white rounded-xl text-slate-600 hover:text-brand-600 transition-all shadow-sm border border-transparent hover:border-slate-200 flex items-center gap-1 text-xs font-bold">
                                <i data-lucide="chevron-right" class="w-4 h-4"></i>
                                <span>الأقدم</span>
                            </button>
                            <span class="font-black text-sm text-slate-800 font-mono tracking-wider" dir="ltr">${start} - ${end}</span>
                            <button type="button" onclick="window.changeYearCalendarPage(1)" class="p-2 hover:bg-white rounded-xl text-slate-600 hover:text-brand-600 transition-all shadow-sm border border-transparent hover:border-slate-200 flex items-center gap-1 text-xs font-bold">
                                <span>الأحدث</span>
                                <i data-lucide="chevron-left" class="w-4 h-4"></i>
                            </button>
                        </div>

                        <!-- شبكة السنوات -->
                        <div class="grid grid-cols-3 gap-2.5 mb-4" dir="ltr">
                            ${years.map(yr => {
                                const isSelected = String(state.yearPicker.selectedYear) === String(yr);
                                const isCurrent = yr === thisYear;
                                return `
                                <button type="button" onclick="window.selectYearFromCalendar(${yr})" class="py-3.5 px-2 rounded-2xl font-mono font-black text-base transition-all border flex flex-col items-center justify-center relative ${
                                    isSelected
                                        ? 'bg-gradient-to-br from-brand-500 to-brand-600 text-white border-brand-600 shadow-lg shadow-brand-500/30 scale-105'
                                        : isCurrent
                                            ? 'bg-brand-50/80 text-brand-800 border-brand-300 hover:bg-brand-100'
                                            : 'bg-white text-slate-700 border-slate-200 hover:border-brand-400 hover:bg-brand-50/40'
                                }">
                                    <span>${yr}</span>
                                    ${isCurrent && !isSelected ? `<span class="text-[9px] font-sans font-bold text-brand-600 mt-0.5">السنة الحالية</span>` : ''}
                                    ${isSelected ? `<span class="text-[9px] font-sans font-bold text-brand-100 mt-0.5">تم الاختيار</span>` : ''}
                                </button>`;
                            }).join('')}
                        </div>

                        <div class="text-center bg-amber-50/80 border border-amber-200/80 rounded-xl p-2.5 text-[11px] text-amber-800 font-bold">
                            <i data-lucide="shield-alert" class="w-3.5 h-3.5 inline-block ml-1 align-middle text-amber-600"></i>
                            يجب اختيار السنة المطابقة لسنة إضافتك في كشوفات الجامعة
                        </div>
                    </div>
                </div>
            `;
            refreshIcons();
        };

        // تحويل روابط Google Drive إلى روابط صور مباشرة تعمل فوراً بدون حظر
        window.getDirectImageUrl = (url) => {
            if (!url || typeof url !== 'string') return '';
            const trimmed = url.trim();
            if (!trimmed) return '';

            let fileId = null;
            const patterns = [
                /\/file\/d\/([a-zA-Z0-9_-]+)/,
                /\/d\/([a-zA-Z0-9_-]+)/,
                /[?&]id=([a-zA-Z0-9_-]+)/
            ];

            for (const pattern of patterns) {
                const match = trimmed.match(pattern);
                if (match && match[1]) {
                    fileId = match[1];
                    break;
                }
            }

            if (fileId && (trimmed.includes('drive.google.com') || trimmed.includes('docs.google.com') || trimmed.includes('googleusercontent.com'))) {
                return `https://drive.google.com/thumbnail?id=${fileId}&sz=w800`;
            }
            return trimmed;
        };

        // تحميل الصورة مسبقاً في ذاكرة المتصفح مع قاعدة البيانات لمنع ظهور مكانها فارغاً
        window.preloadImage = (src) => {
            return new Promise((resolve) => {
                if (!src) return resolve(false);
                const img = new Image();
                const timer = setTimeout(() => resolve(false), 15000);
                img.onload = () => {
                    clearTimeout(timer);
                    resolve(true);
                };
                img.onerror = () => {
                    clearTimeout(timer);
                    resolve(false);
                };
                img.src = src;
            });
        };

        // دالة مساعدة لتنفيذ انتقال بصري سلس بين الصفحات والتبويبات دون وميض
        let transitionTimer = null;
        window.runSmoothTransition = (targetSelector, actionCallback) => {
            const targetEl = document.querySelector(targetSelector);
            if (!targetEl) {
                actionCallback();
                return;
            }
            if (transitionTimer) clearTimeout(transitionTimer);
            targetEl.classList.remove('page-transition-enter');
            targetEl.classList.add('page-transition-exit');

            transitionTimer = setTimeout(() => {
                actionCallback();
                const updatedEl = document.querySelector(targetSelector);
                if (updatedEl) {
                    updatedEl.classList.remove('page-transition-exit');
                    void updatedEl.offsetWidth; // إعادة تفعيل الأنيميشن بسلاسة
                    updatedEl.classList.add('page-transition-enter');
                }
            }, 150);
        };

        const APP_STATE_STORAGE_KEY = 'tu_platform_active_session_v2';
        // المهلة المسموحة عند مغادرة المتصفح/الويب آب قبل فصل الحساب وإعادته لشاشة الدخول (15 ثانية)
        const BACKGROUND_DISCONNECT_LIMIT_MS = 15000;
        let backgroundLogoutTimer = null;
        let dbReconnectInterval = null;

        // حفظ حالة التصفح في sessionStorage (تُمسح تلقائياً عند إغلاق الصفحة أو الويب آب كلياً)
        window.saveAppState = () => {
            try {
                if (state.isLoggedIn && state.user) {
                    const persistedState = {
                        isLoggedIn: state.isLoggedIn,
                        user: state.user,
                        currentView: state.currentView,
                        selectedSpec: state.selectedSpec,
                        selectedLevel: state.selectedLevel,
                        selectedSubject: state.selectedSubject,
                        activeTab: state.activeTab,
                        viewerData: state.viewerData,
                        lastActiveAt: Date.now()
                    };
                    sessionStorage.setItem(APP_STATE_STORAGE_KEY, JSON.stringify(persistedState));
                } else {
                    sessionStorage.removeItem(APP_STATE_STORAGE_KEY);
                }
            } catch (e) {
                console.warn('Could not save app state:', e);
            }
        };

        // استرجاع الجلسة فقط إذا كان الطالب داخل نفس جلسة الويب آب ولم يغادر التطبيق لفترة طويلة
        window.restoreAppState = () => {
            try {
                localStorage.removeItem('tu_platform_active_session_v1');
                const raw = sessionStorage.getItem(APP_STATE_STORAGE_KEY);
                if (!raw) return false;
                const saved = JSON.parse(raw);

                // إذا كان قد غادر الصفحة لفترة تجاوزت الحد المسموح، لا نستعيد الجلسة ونبقيه في صفحة الدخول
                if (saved.leftAppAt && (Date.now() - saved.leftAppAt > BACKGROUND_DISCONNECT_LIMIT_MS)) {
                    sessionStorage.removeItem(APP_STATE_STORAGE_KEY);
                    return false;
                }

                if (saved && saved.isLoggedIn && saved.user) {
                    state.isLoggedIn = true;
                    state.user = saved.user;
                    state.currentView = saved.currentView || 'home';
                    state.selectedSpec = saved.selectedSpec || null;
                    state.selectedLevel = saved.selectedLevel || null;
                    state.selectedSubject = saved.selectedSubject || null;
                    state.activeTab = saved.activeTab || 'references';
                    state.viewerData = saved.viewerData || null;
                    state.isInitialLoading = false;
                    window.checkAndTriggerTutorial();
                    return true;
                }
            } catch (e) {
                console.warn('Could not restore app state:', e);
            }
            return false;
        };

        // إنشاء كائن حالة للتنقل عبر زر الرجوع في الهاتف/المتصفح
        window.getHistorySnapshot = (overrides = {}) => ({
            isAppHistory: true,
            isLoggedIn: state.isLoggedIn,
            currentView: overrides.currentView !== undefined ? overrides.currentView : state.currentView,
            selectedSpec: overrides.selectedSpec !== undefined ? overrides.selectedSpec : state.selectedSpec,
            selectedLevel: overrides.selectedLevel !== undefined ? overrides.selectedLevel : state.selectedLevel,
            selectedSubject: overrides.selectedSubject !== undefined ? overrides.selectedSubject : state.selectedSubject,
            activeTab: overrides.activeTab !== undefined ? overrides.activeTab : state.activeTab,
            viewerData: overrides.viewerData !== undefined ? overrides.viewerData : state.viewerData,
            showRegister: overrides.showRegister !== undefined ? overrides.showRegister : state.showRegister
        });

        // الحصول على الصفحة الرئيسية الافتراضية حسب دور المستخدم
        window.getDefaultViewForUser = (u) => {
            if (!u) return 'home';
            if (u.role === 'finance') return 'finance_board';
            if (u.role === 'security') return 'security_board';
            if (u.role === 'dean') return 'dean_board';
            if (u.role === 'doctor') return 'doctor_board';
            return 'home';
        };

        // تهيئة سجل صفحات المتصفح (History Stack) ليعمل زر الرجوع في الجهاز بشكل متدرج وصحيح
        window.seedHistoryStack = () => {
            try {
                if (!state.isLoggedIn) {
                    window.history.replaceState(window.getHistorySnapshot({ currentView: 'login', showRegister: false }), '');
                    if (state.showRegister) {
                        window.history.pushState(window.getHistorySnapshot({ currentView: 'login', showRegister: true }), '');
                    }
                    return;
                }

                const rootView = window.getDefaultViewForUser(state.user);
                window.history.replaceState(window.getHistorySnapshot({
                    currentView: rootView,
                    selectedSpec: null,
                    selectedLevel: null,
                    selectedSubject: null,
                    viewerData: null
                }), '');

                if (state.currentView === 'levels') {
                    window.history.pushState(window.getHistorySnapshot({ currentView: 'levels' }), '');
                } else if (state.currentView === 'tabs') {
                    window.history.pushState(window.getHistorySnapshot({ currentView: 'levels' }), '');
                    window.history.pushState(window.getHistorySnapshot({ currentView: 'tabs' }), '');
                } else if (state.currentView === 'lectures') {
                    window.history.pushState(window.getHistorySnapshot({ currentView: 'levels' }), '');
                    window.history.pushState(window.getHistorySnapshot({ currentView: 'tabs', activeTab: 'subjects' }), '');
                    window.history.pushState(window.getHistorySnapshot({ currentView: 'lectures' }), '');
                } else if (state.currentView === 'content_viewer') {
                    window.history.pushState(window.getHistorySnapshot({ currentView: 'levels' }), '');
                    window.history.pushState(window.getHistorySnapshot({ currentView: 'tabs' }), '');
                    if (state.viewerData?.returnView === 'lectures') {
                        window.history.pushState(window.getHistorySnapshot({ currentView: 'lectures' }), '');
                    }
                    window.history.pushState(window.getHistorySnapshot({ currentView: 'content_viewer' }), '');
                } else if (state.currentView !== rootView) {
                    window.history.pushState(window.getHistorySnapshot({ currentView: state.currentView }), '');
                }
            } catch (e) {
                console.warn('History API restricted in this environment:', e);
            }
        };

        // الاستماع لزر الرجوع الخاص بالهاتف أو المتصفح
        window.addEventListener('popstate', (event) => {
            // إغلاق تقويم السنوات إذا كان مفتوحاً
            if (state.yearPicker && state.yearPicker.isOpen) {
                window.closeYearCalendar();
                try { window.history.pushState(window.getHistorySnapshot(), ''); } catch (e) {}
                return;
            }
            // إغلاق نافذة التوتوريال إذا كانت مفتوحة
            if (state.tutorial && state.tutorial.show) {
                window.finishTutorial();
                try { window.history.pushState(window.getHistorySnapshot(), ''); } catch (e) {}
                return;
            }
            // 0. إغلاق نافذة المساعد الذكي إذا كانت مفتوحة
            if (state.ashAi && state.ashAi.isOpen) {
                window.toggleAshAi(false);
                try { window.history.pushState(window.getHistorySnapshot(), ''); } catch (e) {}
                return;
            }
            // 1. إغلاق النوافذ المنبثقة أو الكاميرا أولاً عند الضغط على زر الرجوع
            if (state.modals.qrResult) {
                window.closeQRModal();
                try { window.history.pushState(window.getHistorySnapshot(), ''); } catch (e) {}
                return;
            }
            if (state.modals.submissionGrade || state.modals.paymentUpdate || state.modals.banModal || state.modals.csvPreview || state.modals.editUser || state.modals.editOfficialStudent || state.modals.archiveLectures || state.confirm.show) {
                state.modals.submissionGrade = null;
                state.modals.paymentUpdate = null;
                state.modals.banModal = null;
                state.modals.csvPreview = null;
                state.modals.editUser = null;
                state.modals.editOfficialStudent = null;
                state.modals.archiveLectures = null;
                state.confirm = { show: false, id: null, type: '', message: '' };
                renderApp();
                try { window.history.pushState(window.getHistorySnapshot(), ''); } catch (e) {}
                return;
            }
            if (state.scannerActive) {
                window.stopQRScanner();
                try { window.history.pushState(window.getHistorySnapshot(), ''); } catch (e) {}
                return;
            }

            // 2. إذا لم يكن مسجلاً للدخول
            if (!state.isLoggedIn) {
                if (state.showRegister) {
                    state.showRegister = false;
                    renderApp();
                }
                return;
            }

            // 3. التنقل العكسي السلس بين صفحات التطبيق
            if (event.state && event.state.isAppHistory && event.state.isLoggedIn) {
                state.currentView = event.state.currentView || window.getDefaultViewForUser(state.user);
                state.selectedSpec = event.state.selectedSpec || null;
                state.selectedLevel = event.state.selectedLevel || null;
                state.selectedSubject = event.state.selectedSubject || null;
                state.activeTab = event.state.activeTab || 'references';
                state.viewerData = event.state.viewerData || null;
                window.saveAppState();
                renderApp();
            } else {
                const rootView = window.getDefaultViewForUser(state.user);
                if (state.currentView === 'content_viewer') {
                    state.currentView = state.viewerData?.returnView || 'lectures';
                    state.viewerData = null;
                } else if (state.currentView === 'lectures') {
                    state.currentView = 'tabs';
                    state.activeTab = 'subjects';
                } else if (state.currentView === 'tabs') {
                    state.currentView = 'levels';
                } else if (state.currentView !== rootView) {
                    state.currentView = rootView;
                }
                window.saveAppState();
                window.seedHistoryStack();
                renderApp();
            }
        });

        // مراقبة مغادرة المتصفح أو الويب آب: إذا خرج الطالب من التطبيق وانفصل عن قاعدة البيانات لفترة يعود لشاشة تسجيل الدخول
        document.addEventListener('visibilitychange', () => {
            if (!state.isLoggedIn) return;

            if (document.visibilityState === 'hidden') {
                // تجاهل الإخفاء المؤقت الناتج عن فتح نافذة اختيار ملف CSV
                if (state.isPickingFile) return;

                state.leftAppTimestamp = Date.now();
                try {
                    const raw = sessionStorage.getItem(APP_STATE_STORAGE_KEY);
                    if (raw) {
                        const saved = JSON.parse(raw);
                        saved.leftAppAt = state.leftAppTimestamp;
                        sessionStorage.setItem(APP_STATE_STORAGE_KEY, JSON.stringify(saved));
                    }
                } catch (e) {}

                // فصل الاتصال بقاعدة البيانات عند مغادرة التطبيق وبدء عداد الخروج التلقائي
                if (backgroundLogoutTimer) clearTimeout(backgroundLogoutTimer);
                backgroundLogoutTimer = setTimeout(() => {
                    if (document.visibilityState === 'hidden' && state.isLoggedIn) {
                        try { db.disableNetwork(); } catch (e) {}
                        state.dbConnected = false;
                        window.handleLogout('تم إنهاء الجلسة لمغادرة التطبيق وانفصال قاعدة البيانات');
                    }
                }, BACKGROUND_DISCONNECT_LIMIT_MS);
            } else if (document.visibilityState === 'visible') {
                state.isPickingFile = false;
                if (backgroundLogoutTimer) {
                    clearTimeout(backgroundLogoutTimer);
                    backgroundLogoutTimer = null;
                }

                if (state.leftAppTimestamp) {
                    const awayDuration = Date.now() - state.leftAppTimestamp;
                    state.leftAppTimestamp = null;

                    // إذا تجاوزت مدة المغادرة الحد المسموح أو انفصل أثناء وجوده خارج التطبيق، يتم إخراجه لصفحة تسجيل الدخول
                    if (awayDuration >= BACKGROUND_DISCONNECT_LIMIT_MS || !state.isOnline) {
                        try { db.enableNetwork(); } catch (e) {}
                        window.handleLogout('تم إعادتك لصفحة الدخول بسبب مغادرة التطبيق');
                        return;
                    }
                }

                // تحديث وقت النشاط إذا عاد سريعاً
                window.saveAppState();
            }
        });

        // استعادة الحالة المحفوظة قبل بدء التشغيل
        window.restoreAppState();

        // دالة للتحقق مما إذا كان المستخدم متصلاً فعلياً بالإنترنت وقاعدة البيانات
        window.isConnectionReady = () => {
            return state.isOnline && state.dbConnected && !state.isReconnecting;
        };

        // إعادة تحميل الاتصال بقاعدة البيانات تلقائياً عندما يواجه المستخدم مشكلة شبكة داخل التطبيق
        window.attemptDatabaseReconnect = () => {
            if (!state.isLoggedIn) return;
            state.isReconnecting = true;
            window.updateConnectionIndicators();

            if (dbReconnectInterval) clearInterval(dbReconnectInterval);
            dbReconnectInterval = setInterval(async () => {
                if (!navigator.onLine) {
                    state.isOnline = false;
                    state.isReconnecting = true;
                    window.updateConnectionIndicators();
                    return;
                }

                try {
                    await db.enableNetwork();
                    const basePath = `artifacts/${appIdStr}/public/data`;
                    // جلب سريع للتأكد من استجابة الخادم وإعادة تنشيط قاعدة البيانات
                    await db.collection(`${basePath}/users`).limit(1).get({ source: 'server' });
                    state.isOnline = true;
                    state.dbConnected = true;
                    state.isReconnecting = false;
                    clearInterval(dbReconnectInterval);
                    dbReconnectInterval = null;
                    window.updateConnectionIndicators();
                    window.showAlert('تم استعادة الاتصال بقاعدة البيانات بنجاح', 'success');
                } catch (err) {
                    state.isReconnecting = true;
                    window.updateConnectionIndicators();
                }
            }, 3500);
        };

        // تحديث مؤشر الاتصال في الصفحة دون إعادة رسم كامل النموذج أثناء الكتابة
        window.updateConnectionIndicators = () => {
            const online = window.isConnectionReady();
            const badges = document.querySelectorAll('.connection-status-badge');
            badges.forEach(badge => {
                if (online) {
                    badge.className = 'connection-status-badge inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full text-xs font-extrabold transition-all border shadow-sm bg-emerald-50 text-emerald-700 border-emerald-200';
                    badge.innerHTML = `
                        <span class="w-2.5 h-2.5 rounded-full inline-block status-dot-online"></span>
                        <span>متصل بقاعدة البيانات</span>
                    `;
                } else if (state.isLoggedIn) {
                    // داخل التطبيق عند وجود مشكلة شبكة: عدم طرد الطالب وإظهار علامة تحميل مكان النقطة لإعادة تحميل قاعدة البيانات
                    badge.className = 'connection-status-badge inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full text-xs font-extrabold transition-all border shadow-sm bg-amber-50 text-amber-700 border-amber-300';
                    badge.innerHTML = `
                        <span class="w-3.5 h-3.5 rounded-full border-2 border-amber-600 border-t-transparent inline-block animate-spin shrink-0"></span>
                        <span>غير متصل - جاري إعادة تحميل الاتصال...</span>
                    `;
                } else {
                    // في شاشة تسجيل الدخول: إظهار النقطة الحمراء
                    badge.className = 'connection-status-badge inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full text-xs font-extrabold transition-all border shadow-sm bg-red-50 text-red-600 border-red-200';
                    badge.innerHTML = `
                        <span class="w-2.5 h-2.5 rounded-full inline-block status-dot-offline"></span>
                        <span>غير متصل (أوفلاين)</span>
                    `;
                }
            });

            const offlineBanner = document.getElementById('offline-warning-banner');
            if (offlineBanner) {
                if (online) {
                    offlineBanner.classList.add('hidden');
                } else {
                    offlineBanner.classList.remove('hidden');
                }
            }
        };

        // مراقبة حالة الإنترنت في المتصفح
        window.addEventListener('online', () => {
            state.isOnline = true;
            if (state.isLoggedIn) {
                window.attemptDatabaseReconnect();
            } else {
                db.enableNetwork().then(() => {
                    state.dbConnected = true;
                    window.updateConnectionIndicators();
                }).catch(() => {});
                window.updateConnectionIndicators();
            }
        });

        window.addEventListener('offline', () => {
            state.isOnline = false;
            if (state.isLoggedIn) {
                // إذا كان داخل التطبيق، نظهر علامة التحميل في مكان النقطة ونبدأ محاولة إعادة التحميل دون طرده
                state.isReconnecting = true;
                window.updateConnectionIndicators();
                window.attemptDatabaseReconnect();
            } else {
                window.updateConnectionIndicators();
            }
        });

        // مؤقت الـ 20 ثانية: إذا استغرق التحميل أكثر من 20 ثانية ولم يكتمل، نخبر المستخدم أنه غير متصل بالسيرفر
        const initialLoadTimeout = setTimeout(() => {
            if (state.isInitialLoading) {
                state.isInitialLoading = false;
                state.loadTimedOut = true;
                if (!state.usersLoaded || !state.officialStudentsLoaded) {
                    state.dbConnected = false;
                }
                renderApp();
                if (!state.dbConnected) {
                    window.showAlert('انتهت مهلة التحميل (20 ثانية): أنت غير متصل بالسيرفر حالياً', 'error');
                }
            }
        }, 20000);

        // التحقق من اكتمال تحميل بيانات المستخدمين والكشوفات الأساسية وصورة لوحة التسجيل معاً
        function checkInitialLoadComplete() {
            if (state.usersLoaded && state.officialStudentsLoaded && state.settingsLoaded) {
                state.dbConnected = true;
                state.loadTimedOut = false;
                state.isReconnecting = false;
                if (dbReconnectInterval) {
                    clearInterval(dbReconnectInterval);
                    dbReconnectInterval = null;
                }
                if (state.isInitialLoading) {
                    clearTimeout(initialLoadTimeout);
                    state.isInitialLoading = false;
                    renderApp();
                } else {
                    window.updateConnectionIndicators();
                    const regInput = document.getElementById('reg-uni-id');
                    if (regInput && regInput.value) {
                        window.checkStudentName(regInput.value);
                    }
                }
            }
        }

        // تحديث عناصر الشعار والفوتر في الواجهة عند تعديلها بدون إعادة تحميل الصفحة
        window.refreshBrandingUI = () => {
            const loginLogoSlot = document.getElementById('login-logo-slot');
            if (loginLogoSlot) {
                loginLogoSlot.innerHTML = window.getLoginLogoInnerHTML();
            }
            const navbarLogoSlot = document.getElementById('navbar-logo-slot');
            if (navbarLogoSlot) {
                navbarLogoSlot.innerHTML = window.getNavbarLogoInnerHTML();
            }
            const aiAvatarSlots = document.querySelectorAll('.ash-ai-avatar-slot');
            aiAvatarSlots.forEach(el => {
                el.innerHTML = window.getAshAiAvatarHTML(el.dataset.size || 'md');
            });
            const footerContainers = document.querySelectorAll('.design-team-footer-slot');
            footerContainers.forEach(el => {

                    bar.innerHTML = '<div class="card-progress-bar"></div>';

                }
                if (submitBtn) {
                    submitBtn.disabled = true;
                    submitBtn.classList.add('opacity-75', 'pointer-events-none');
                }
            } else {
                setTimeout(() => {
                    const bar = card.querySelector('.card-progress-container');

            // إذا كان للطالب سجل في الكشوفات الرسمية يحتوي على سنة دفعة، نتحقق من مطابقتها
            const cleanUniId = (state.user.uniId || state.user.username || '').replace(/\D/g, '');

                const dbBatch = window.normalizeDigits(String(officialRecord.batchYear)).replace(/\D/g, '').trim();

        window.openContentInApp = (title, url, type = 'link', returnView = null) => {
            let embedUrl = url;

            try {
                if (url.includes('youtube.com/watch?v=')) {

                    if (videoId) {
                        embedUrl = `https://www.youtube.com/embed/${videoId}`;
                        canEmbed = true;
                    }
                } else if (url.includes('youtu.be/')) {
                    const videoId = url.split('youtu.be/')[1]?.split('?')[0];
                    if (videoId) {
                        embedUrl = `https://www.youtube.com/embed/${videoId}`;
                        canEmbed = true;

                } else if (url.includes('drive.google.com/file/d/')) {
                    const match = url.match(/\/file\/d\/([^/]+)/);

                        embedUrl = `https://drive.google.com/file/d/${match[1]}/preview`;
                        canEmbed = true;

                    canEmbed = true;

        // تحويل الأرقام العربية (٠-٩) إلى أرقام إنجليزية قياسية
        window.normalizeDigits = (str) => {
            if (!str) return '';
            return String(str).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
        };

        // تقسيم سطر CSV مع احترام علامات التنصيص والفواصل المختلفة (فاصلة، فاصلة منقوطة، Tab)
        window.parseCSVLine = (line, delimiter) => {
            const result = [];
            let current = '';
            let inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                if (char === '"') {
                    if (inQuotes && line[i + 1] === '"') {
                        current += '"';
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (char === delimiter && !inQuotes) {
                    result.push(current.trim());
                    current = '';
                } else {
                    current += char;
                }
            }
            result.push(current.trim());
            return result.map(c => c.replace(/^["']|["']$/g, '').trim());
        };

        // استخراج الرقم الجامعي الصافي من الخلية وتجاهل أي رموز إضافية
        window.extractCleanUniId = (rawCell) => {
            const norm = window.normalizeDigits(rawCell || '').trim();
            // استخراج الأرقام فقط إذا كانت الخلية تمثل رقماً جامعياً (من 4 إلى 15 رقماً)
            const digitsOnly = norm.replace(/[\s\-_/]/g, '');
            if (/^\d{4,15}$/.test(digitsOnly)) return digitsOnly;
            return '';
        };

        // تنظيف اسم الطالب والتأكد أنه اسم حقيقي وليس بيانات إضافية أو أرقاماً
        window.extractCleanStudentName = (rawCell) => {
            if (!rawCell) return '';
            const cleaned = String(rawCell).replace(/["'\r\n]/g, '').replace(/\s+/g, ' ').trim();
            // يجب أن يحتوي الاسم على حروف عربية أو إنجليزية ولا يكون مجرد رقم أو رمز قصير
            if (cleaned.length < 5) return '';
            if (/^\d+$/.test(window.normalizeDigits(cleaned).replace(/[\s\-_]/g, ''))) return '';
            if (!/[\u0600-\u06FFa-zA-Z]/.test(cleaned)) return '';
            return cleaned;
        };

        // بناء قائمة الطلاب المستخرجين بناءً على عمود الرقم الجامعي وعمود الاسم فقط وتجاهل باقي الأعمدة
        window.buildExtractedStudentsList = (rows, hasHeader, idColIdx, nameColIdx) => {
            const startIdx = hasHeader ? 1 : 0;
            const extracted = [];
            const seenInFile = new Set();

            for (let i = startIdx; i < rows.length; i++) {
                const row = rows[i];
                if (!row || row.length < 2) continue;

                const rawId = row[idColIdx] !== undefined ? row[idColIdx] : '';
                const rawName = row[nameColIdx] !== undefined ? row[nameColIdx] : '';

                const uniId = window.extractCleanUniId(rawId);
                const fullName = window.extractCleanStudentName(rawName);

                if (uniId && fullName && !seenInFile.has(uniId)) {
                    seenInFile.add(uniId);
                    const existing = state.officialStudents.find(s => s.uniId === uniId);
                    extracted.push({
                        uniId,
                        fullName,
                        alreadyExists: Boolean(existing)
                    });
                }
            }
            return extracted;
        };

        // قراءة ملف CSV وتحليل الأعمدة ذكياً لاستخراج (الرقم الجامعي + الاسم فقط) وفتح نافذة تحديد الدفعة والتأكيد
        window.handleCSVUpload = () => {
            const fileInput = document.getElementById('csv-file');
            const csvCard = document.getElementById('csv-upload-card');
            const initialBatchSelect = document.getElementById('csv-initial-batch');
            const file = fileInput ? fileInput.files[0] : null;
            if (!file) return window.showAlert('يرجى اختيار ملف CSV أولاً', 'error');

            window.setCardLoading(csvCard, true);
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const text = (e.target.result || '').replace(/^\uFEFF/, '');
                    const rawLines = text.split(/\r?\n/).filter(l => l.trim().length > 0);
                    if (rawLines.length === 0) {
                        window.showAlert('الملف المختار فارغ', 'error');
                        return;
                    }

                    // اكتشاف الفاصل المستخدم في الملف تلقائياً (فاصلة، فاصلة منقوطة، أو Tab)
                    const sampleLine = rawLines[0];
                    let delimiter = ',';
                    const commaCount = (sampleLine.match(/,/g) || []).length;
                    const semiCount = (sampleLine.match(/;/g) || []).length;
                    const tabCount = (sampleLine.match(/\t/g) || []).length;
                    if (semiCount > commaCount && semiCount >= tabCount) delimiter = ';';
                    else if (tabCount > commaCount && tabCount > semiCount) delimiter = '\t';

                    const rows = rawLines.map(l => window.parseCSVLine(l, delimiter)).filter(r => r.some(c => c !== ''));
                    const maxCols = Math.max(...rows.slice(0, 30).map(r => r.length));

                    if (maxCols < 2) {
                        window.showAlert('لم يتم العثور على أعمدة كافية في الملف', 'error');
                        return;
                    }

                    // التحقق مما إذا كان السطر الأول يمثل عناوين الأعمدة
                    const firstRowText = rows[0].join(' ').toLowerCase();
                    const headerKeywords = ['اسم', 'الاسم', 'رباعي', 'طالب', 'رقم', 'الرقم', 'جامعي', 'أكاديمي', 'اكاديمي', 'name', 'id', 'student'];
                    const firstRowHasId = rows[0].some(cell => window.extractCleanUniId(cell) !== '');
                    const hasHeader = headerKeywords.some(k => firstRowText.includes(k)) || !firstRowHasId;

                    const sampleRows = rows.slice(hasHeader ? 1 : 0, Math.min(rows.length, 60));

                    // التقييم الذكي لكل عمود لتحديد عمود الرقم الجامعي وعمود اسم الطالب وتجاهل البيانات الإضافية
                    let bestIdCol = 0;
                    let bestIdScore = -9999;
                    let bestNameCol = 1;
                    let bestNameScore = -9999;

                    for (let col = 0; col < maxCols; col++) {
                        const headerTitle = hasHeader ? (rows[0][col] || '').toLowerCase() : '';
                        let idValidCount = 0;
                        let nameValidCount = 0;
                        let multiWordCount = 0;
                        const uniqueValues = new Set();

                        sampleRows.forEach(r => {
                            const val = (r[col] || '').trim();
                            if (!val) return;
                            uniqueValues.add(val);

                            const cleanId = window.extractCleanUniId(val);
                            if (cleanId) {
                                // استبعاد أرقام الهواتف التي تبدأ غالباً بـ 09 أو 01 إذا كانت طويلة، واستبعاد التسلسل البسيط
                                const isLikelyPhone = /^(09|01|05|\+249|00249)\d{7,}$/.test(cleanId);
                                idValidCount += isLikelyPhone ? 0.3 : 1;
                            }

                            const cleanName = window.extractCleanStudentName(val);
                            if (cleanName) {
                                nameValidCount++;
                                if (cleanName.split(' ').length >= 2) multiWordCount++;
                            }
                        });

                        const uniquenessRatio = sampleRows.length > 0 ? (uniqueValues.size / sampleRows.length) : 0;

                        // حساب نقاط عمود الرقم الجامعي
                        let idScore = (idValidCount * 10) + (uniquenessRatio * 20);
                        if (headerTitle.includes('جامعي') || headerTitle.includes('اكاديمي') || headerTitle.includes('أكاديمي') || headerTitle.includes('id')) idScore += 50;
                        else if (headerTitle.includes('رقم') || headerTitle.includes('كود')) idScore += 25;
                        if (headerTitle.includes('هاتف') || headerTitle.includes('جوال') || headerTitle.includes('موبايل') || headerTitle.includes('وطني') || headerTitle.includes('متسلسل') || headerTitle === 'م' || headerTitle === '#') idScore -= 60;

                        if (idScore > bestIdScore) {
                            bestIdScore = idScore;
                            bestIdCol = col;
                        }

                        // حساب نقاط عمود اسم الطالب (الأسماء فريدة ومتعددة الكلمات، بينما التخصص أو الحالة تتكرر في كل السطور)
                        let nameScore = (nameValidCount * 8) + (multiWordCount * 6) + (uniquenessRatio * 40);
                        if (headerTitle.includes('اسم') || headerTitle.includes('الاسم') || headerTitle.includes('رباعي') || headerTitle.includes('name')) nameScore += 60;
                        if (headerTitle.includes('تخصص') || headerTitle.includes('قسم') || headerTitle.includes('مستوى') || headerTitle.includes('ملاحظات') || headerTitle.includes('حالة') || headerTitle.includes('عنوان')) nameScore -= 50;

                        if (nameScore > bestNameScore) {
                            bestNameScore = nameScore;
                            bestNameCol = col;
                        }
                    }

                    if (bestNameCol === bestIdCol) {
                        bestNameCol = bestIdCol === 0 ? 1 : 0;
                    }

                    const columnHeaders = [];
                    for (let col = 0; col < maxCols; col++) {
                        const hName = hasHeader && rows[0][col] ? rows[0][col] : `العمود ${col + 1}`;
                        const sampleVal = sampleRows[0] && sampleRows[0][col] ? sampleRows[0][col] : '';
                        columnHeaders.push({
                            index: col,
                            label: `${hName}${sampleVal ? ` (مثال: ${sampleVal.slice(0, 22)})` : ''}`
                        });
                    }

                    const extractedStudents = window.buildExtractedStudentsList(rows, hasHeader, bestIdCol, bestNameCol);
                    const defaultBatch = (initialBatchSelect && initialBatchSelect.value) ? initialBatchSelect.value : '2024';

                    state.modals.csvPreview = {
                        fileName: file.name,
                        rows,
                        hasHeader,
                        columnHeaders,
                        idColIdx: bestIdCol,
                        nameColIdx: bestNameCol,
                        batchYear: defaultBatch,
                        extractedStudents
                    };

                    renderApp();
                } catch(err) {
                    console.error(err);
                    window.showAlert('خطأ في قراءة الملف. تأكد من صيغته (CSV)', 'error');
                } finally {
                    window.setCardLoading(csvCard, false);
                }
            };
            reader.readAsText(file, 'UTF-8');
        };

        // تحديث المعاينة عند تغيير عمود الرقم الجامعي أو عمود الاسم أو رقم الدفعة في نافذة التأكيد
        window.updateCSVPreviewSettings = () => {
            const modalData = state.modals.csvPreview;
            if (!modalData) return;

            const idSel = document.getElementById('csv-col-id-select');
            const nameSel = document.getElementById('csv-col-name-select');

                return window.showAlert('لا توجد بيانات طلاب صالحة للرفع. تأكد من اختيار عمود الرقم الجامعي والاسم الصحيحين.', 'error');

                        uniId: item.uniId,
                        batchYear: batchYear,
                        addedBy: state.user.username,
                        createdAt: Date.now()
                    }, { merge: true });

                    batchCount++;

                        await batch.commit();
                        batch = db.batch();
                        batchCount = 0;

                const qrElement = document.getElementById("qr-reader");
                if(!qrElement) { window.showAlert('حدث خطأ في تحميل الكاميرا', 'error'); return; }

                try {
                    const scanner = new Html5QrcodeScanner("qr-reader", {

                        aspectRatio: 1.0, 
                        formatsToSupport: [ Html5QrcodeSupportedFormats.QR_CODE ]

        window.getInstantAshAiReply = (rawText, isQuickButton = false) => {
            if (!rawText) return null;

            if (isQuickButton) {

                }
                if (norm.includes('تفعيل حسابي')) {
                    return `لتفعيل حسابك كطالب جديد بنجاح اتبع الخطوات التالية:\n1. من شاشة الدخول اضغط على **"تفعيل حساب طالب جديد"**.\n2. أدخل **رقمك الجامعي** ليظهر اسمك الرباعي المسجل في الكشوفات.\n3. اضغط على حقل **سنة الالتحاق بالدفعة** ليفتح لك **تقويم السنوات**، وتصفح لاختيار السنة الصحيحة لإضافتك بالجامعة (يشترط مطابقتها لقاعدة البيانات).\n4. اختر تخصصك وعين كلمة مرورك ثم اضغط **إنشاء الحساب**.`;

            const exactGreetings = ['السلام عليكم', 'سلام عليكم', 'السلام عليكم ورحمه الله', 'سلام', 'مرحبا', 'اهلا', 'اهلا بك', 'هلا', 'صباح الخير', 'مساء الخير', 'كيف حالك', 'كيفك', 'اخبارك', 'hi', 'hello', 'hey'];
            if (words.length <= 4 && exactGreetings.includes(norm)) {

                }
                if (norm.includes('كيف حالك') || norm.includes('كيفك') || norm.includes('اخبارك')) {
                    return `الحمد لله بخير وبأفضل حال! شكراً لسؤالك يا ${userName} 😊✨\nتفضل، ما هو سؤالك اليوم؟`;
                }
                return `أهلاً ومرحباً بك يا ${userName}! 👋✨\nأنا (ash ai)، يمكنك سؤالي عن أي موضوع علمي أو دراسي أو عن كيفية استخدام المنصة!`;
            }

            // 3. الشكر والوداع القصير فقط
            if (words.length <= 3 && ['شكرا', 'شكرا لك', 'شكرا جزيلا', 'جزاك الله خيرا', 'تسلم', 'مع السلامه', 'باي', 'bye', 'thanks', 'thank you'].includes(norm)) {
                if (norm.includes('سلامه') || norm === 'باي' || norm === 'bye') {
                    return `في أمان الله وحفظه! أتمنى لك كل التوفيق والنجاح في دراستك 🎓✨`;
                }
                return `على الرحب والسعة دائماً يا ${userName}! 🌟 لا تتردد في طرح أي سؤال آخر في أي وقت.`;

            // 4. السؤال المباشر عن هوية المساعد فقط
            if (words.length <= 4 && ['من انت', 'شنو انت', 'عرفني بنفسك', 'ما هو اسمك', 'ما اسمك'].includes(norm)) {
                return `أنا **ash ai** 🤖، المساعد الذكي الرسمي لمنصة الجامعة التكنولوجية! أساعدك في الإجابة على جميع أسئلتك العلمية والدراسية وإرشادك داخل المنصة.`;

        // الاتصال بـ Gemini API للإجابة على كافة الأسئلة
        window.callAshAiGemini = async (userPrompt) => {

مهمتك هي مساعدة الطلاب والأساتذة والمشرفين في الإجابة على جميع أسئلتهم (الأكاديمية، الهندسية، العلمية، البرمجية، والعامة) وكذلك إرشادهم في استخدام المنصة بلغة عربية واضحة وودودة. لا تذكر اسم Gemini في إجاباتك بل عرف نفسك دائماً باسم ash ai فقط.
معلومات عن المنصة للاستعانة بها إذا سأل المستخدم عن المنصة:
- تفعيل حساب طالب جديد: من شاشة الدخول يضغط الطالب على "تفعيل حساب طالب جديد"، ويدخل رقمه الجامعي، ويختار سنة التحاقه من تقويم السنوات (يجب أن تطابق السنة المسجلة له في قاعدة البيانات).
- نسيان الحساب أو كلمة المرور: عبر الزر الرمادي الصغير "لقد نسيت الحساب او كلمة المرور" أسفل زر الدخول للتواصل مع واتساب الدعم الفني (+249997081867).
- البطاقة الجامعية الذكية: تعرض رمز QR وتدعم NFC لتسجيل الحضور (5 نقاط) أو المرور عبر بوابة الأمن.

${state.user ? `المستخدم الحالي المتصل هو: "${state.user.displayName || state.user.username}" ودوره في المنصة: "${ROLES_MAP[state.user.role] || state.user.role}".` : 'المستخدم حالياً في شاشة تسجيل الدخول.'}`;

            // بناء سجل المحادثة بشكل متوافق تماماً مع شروط الـ API (يجب أن يبدأ بـ user ويتناوب بين user و model)
            const rawHistory = state.ashAi.messages.slice(-8);
            const normalizedContents = [];

            for (const msg of rawHistory) {
                const role = msg.role === 'user' ? 'user' : 'model';
                const text = (msg.text || '').trim();
                if (!text) continue;

                // تخطي أي رسائل model في بداية السجل (مثل رسالة الترحيب الأولى) لأن الـ API يشترط البدء بـ user
                if (normalizedContents.length === 0 && role === 'model') {
                    continue;
                }

                // إذا تكرر نفس الدور مرتين متتاليتين، ندمج النصين معاً لمنع خطأ 400 من الـ API
                if (normalizedContents.length > 0 && normalizedContents[normalizedContents.length - 1].role === role) {
                    normalizedContents[normalizedContents.length - 1].parts[0].text += '\n' + text;
                } else {
                    normalizedContents.push({
                        role: role,
                        parts: [{ text: text }]
                    });
                }
            }

            // ضمان وجود سؤال المستخدم الحالي كآخر عنصر بدور user
            if (normalizedContents.length === 0 || normalizedContents[normalizedContents.length - 1].role !== 'user') {
                normalizedContents.push({
                    role: 'user',
                    parts: [{ text: userPrompt }]
                });
            }

            const payload = {
                contents: normalizedContents,
                systemInstruction: {
                    parts: [{ text: systemPrompt }]
                }
            };

            const tryGenerate = async (modelName, apiKey) => {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey ? encodeURIComponent(apiKey) : ''}`;
                let delay = 800;
                for (let attempt = 0; attempt < 2; attempt++) {
                    try {
                        const response = await fetch(url, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        if (response.status === 429 || response.status >= 500) {
                            await new Promise(r => setTimeout(r, delay));
                            delay *= 2;
                            continue;
                        }
                        if (!response.ok) {
                            return { ok: false, status: response.status };
                        }
                        const result = await response.json();
                        const text = result?.candidates?.[0]?.content?.parts?.[0]?.text;
                        if (text) return { ok: true, text };
                        return { ok: false };
                    } catch (err) {
                        if (attempt === 1) return { ok: false, error: err };

                    }
                }
                return { ok: false };
            };

            const attempts = [

                { model: 'gemini-2.5-flash', key: '' }
            ];

            for (const item of attempts) {
                const res = await tryGenerate(item.model, item.key);
                if (res.ok && res.text) {
                    return res.text;
                }

            return 'عذراً، تعذر الاتصال بخادم الذكاء الاصطناعي في هذه اللحظة. يرجى التأكد من اتصالك بالإنترنت أو المحاولة مرة أخرى بعد قليل.';
