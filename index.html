        const aiModel = apiKey ? "gemini-1.5-flash" : "gemini-2.5-flash-preview-09-2025";
        
        const callGemini = async (promptData, systemPrompt = "أنت مساعد ذكي ومفيد. أجب باللغة العربية.") => {
            let contents = typeof promptData === 'string' ? [{ role: 'user', parts: [{ text: promptData }] }] : promptData;
            const delays = [1000, 2000, 4000, 8000, 16000];
            for (let i = 0; i < 5; i++) {
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${aiModel}:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: contents, systemInstruction: { parts: [{ text: systemPrompt }] }, tools: [{ "google_search": {} }] })
                    });
                    if (!response.ok) throw new Error("API Error");
                    const data = await response.json();
                    return data.candidates?.[0]?.content?.parts?.[0]?.text || "عذراً، لم أتمكن من صياغة إجابة.";
                } catch (error) { 
                    if (i === 4) return "حدث خطأ في الاتصال بخوادم الذكاء الاصطناعي.";
                    await new Promise(res => setTimeout(res, delays[i]));
                }
            }
        };

            window.showAlert('جاري تحليل الملف وإضافة الطلاب... يرجى الانتظار (قد يستغرق ثواني)', 'success');

            reader.onload = async (e) => {
                try {
                    const text = e.target.result;
                    const lines = text.split('\n');
                    let addedCount = 0;
                    
                    let batch = db.batch();
                    let batchCount = 0;

                    for (let i = 0; i < lines.length; i++) {
                        const line = lines[i].split(',');
                        if (line.length > 1) {
                            let uniId = '';
                            let name = '';
                            
                            line.forEach(cell => {
                                const cleanCell = cell.replace(/["\r]/g, '').trim();

                                    uniId = cleanCell.replace(/\D/g, '');

                                    if(name === '' || cleanCell.length > name.length) name = cleanCell;
                                }

                                }
                            }
                        }

        // ==============================================================
        // تحديث دالة الرفع لاستخدام Google Drive بدلاً من Firebase Storage
        // ==============================================================
        window.handleAddContent = async (e, type) => { 
            e.preventDefault(); 
            const submitBtn = e.target.querySelector('button[type="submit"]');
            const originalBtnText = submitBtn ? submitBtn.innerHTML : '';
            
            const data = { spec: state.selectedSpec, level: state.selectedLevel, createdAt: Date.now() }; 
            let coll = ''; 
            
            if (type === 'ref') { 
                coll = 'references'; 
                data.title = document.getElementById('ref-title').value; 
                data.author = document.getElementById('ref-author').value; 
                data.link = document.getElementById('ref-link').value; 
            } else if (type === 'exam') { 
                coll = 'exams'; 
                data.title = document.getElementById('exam-title').value; 
                data.link = document.getElementById('exam-link').value; 
            } else if (type === 'sub') { 
                coll = 'subjects'; 
                data.title = document.getElementById('sub-title').value; 
            } else if (type === 'lec') { 
                coll = 'lectures'; 
                data.subjectId = state.selectedSubject; 
                const titleVal = document.getElementById('lec-title').value;
                data.title = titleVal; 
                data.type = document.getElementById('lec-type').value; 
                
                const sourceType = document.getElementById('lec-source-type').value;

                if (sourceType === 'file') {
                    const fileInput = document.getElementById('lec-file');
                    const file = fileInput.files[0];
                    if (!file) { window.showAlert('يرجى اختيار ملف للرفع', 'error'); return; }
                    
                    if (submitBtn) submitBtn.disabled = true;
                    
                    // تفعيل حالة الرفع لإظهار الواجهة المحدثة لشريط التقدم
                    state.uploadingLec = { show: true, title: titleVal, progress: 0, status: 'جاري تهيئة الاتصال بـ Google Drive...' };
                    renderApp();

                    try {
                        // 1. طلب رابط الرفع من Apps Script
                        const initResponse = await fetch(GOOGLE_DRIVE_SCRIPT_URL, {
                            method: 'POST',
                            body: JSON.stringify({
                                action: 'initiateUpload',
                                fileName: `${Date.now()}_${file.name}`, // تجنب تشابه الأسماء
                                mimeType: file.type || 'application/octet-stream'
                            })
                        });

                        const initData = await initResponse.json();
                        
                        if (!initData.success || !initData.uploadUrl) {
                            throw new Error('فشل في تهيئة عملية الرفع');
                        }

                        const uploadUrl = initData.uploadUrl;
                        
                        // 2. الرفع باستخدام XMLHttpRequest لتحديث شريط التقدم
                        state.uploadingLec.status = 'جاري نقل البيانات إلى Drive...';
                        
                        // نقوم بتحديث العناصر في الـ DOM مباشرة لتجنب تقطيع الشاشة أثناء إعادة الرسم
                        const updateDOMProgress = (percent, statusText) => {
                            const pBar = document.getElementById('upload-progress-bar');
                            const pText = document.getElementById('upload-progress-text');
                            const sText = document.getElementById('upload-status-text');
                            if(pBar) pBar.style.width = percent + '%';
                            if(pText) pText.textContent = percent + '%';
                            if(sText && statusText) sText.innerHTML = `<i data-lucide="loader-2" class="w-3 h-3 ml-1 animate-spin"></i> ${statusText}`;
                        };

                        updateDOMProgress(0, state.uploadingLec.status);

                        await new Promise((resolve, reject) => {
                            const xhr = new XMLHttpRequest();
                            xhr.open('PUT', uploadUrl, true);
                            
                            xhr.upload.onprogress = (event) => {
                                if (event.lengthComputable) {
                                    const percentComplete = Math.round((event.loaded / event.total) * 100);
                                    if(percentComplete > state.uploadingLec.progress) {
                                        state.uploadingLec.progress = percentComplete;
                                        updateDOMProgress(percentComplete, `تم رفع ${percentComplete}%`);
                                    }
                                }
                            };

                            xhr.onload = () => {
                                if (xhr.status >= 200 && xhr.status < 300) {
                                    resolve(xhr.response);
                                } else {
                                    reject(new Error('فشل الرفع. كود الخطأ: ' + xhr.status));
                                }
                            };

                            xhr.onerror = () => reject(new Error('حدث خطأ في الشبكة أثناء الرفع'));
                            xhr.send(file);
                        });

                        // 3. طلب الرابط النهائي بعد الرفع
                        updateDOMProgress(100, 'اكتمل النقل، جاري إنشاء رابط المحاضرة...');
                        
                        // ننتظر ثانية لضمان استقرار الملف في درايف
                        await new Promise(r => setTimeout(r, 1500)); 

                        const finalizeResponse = await fetch(GOOGLE_DRIVE_SCRIPT_URL, {
                            method: 'POST',
                            body: JSON.stringify({
                                action: 'getFileUrl',
                                fileName: `${Date.now()}_${file.name}`
                            })
                        });
                        
                        const finalizeData = await finalizeResponse.json();

                        if (finalizeData.success && finalizeData.fileUrl) {
                            data.link = finalizeData.fileUrl;
                        } else {
                            // في حال نجح الرفع ولكن لم يعد الرابط مباشرة
                            data.link = 'تم الرفع إلى Drive - ' + file.name;
                            window.showAlert('اكتمل الرفع ولكن لم نتمكن من جلب الرابط، تم وضع اسم الملف كمرجع.', 'success');
                        }

                    } catch(error) {
                        console.error("Upload Error:", error);
                        // عرض رسالة الخطأ الفعلية القادمة من المتصفح أو الخادم
                        window.showAlert('حدث خطأ: ' + error.message, 'error');
                        state.uploadingLec = { show: false, title: '', progress: 0, status: '' };
                        if (submitBtn) { submitBtn.disabled = false; submitBtn.innerHTML = originalBtnText; }
                        renderApp();
                        return;
                    }
                } else {
                    data.link = document.getElementById('lec-link').value;
                    if(!data.link) { window.showAlert('يرجى إدخال الرابط', 'error'); return; }
                }
            } 
            
            try { 
                await db.collection(`artifacts/${appIdStr}/public/data/${coll}`).add(data); 
                
                if (type === 'lec' && state.uploadingLec && state.uploadingLec.show) {
                    window.showAlert('تم رفع المحاضرة إلى Drive بنجاح 🎉', 'success');
                    state.uploadingLec = { show: false, title: '', progress: 0, status: '' };
                } else {
                    window.showAlert('تمت الإضافة بنجاح'); 
                }
                
                e.target.reset(); 
                if(type === 'lec' && document.getElementById('lec-file-container')) {
                    document.getElementById('lec-file-container').style.display = 'block';
                    document.getElementById('lec-link-container').style.display = 'none';
                }
            } catch (err) { 
                window.showAlert('فشل حفظ بيانات المحاضرة', 'error'); 
                if (type === 'lec') state.uploadingLec = { show: false, title: '', progress: 0, status: '' };
            } finally {
                if (submitBtn) { submitBtn.disabled = false; submitBtn.innerHTML = originalBtnText; }
                renderApp();
            }
        };

                                    <div class="flex items-baseline gap-2 mb-1">${!isMe ? `<span class="text-xs font-bold text-slate-500">${chat.senderName}</span>` : ''}${isPrivileged && !isMe ? `<span class="bg-purple-100 text-purple-700 text-[10px] px-1.5 py-0.5 rounded font-black border border-purple-200"><i data-lucide="shield-check" class="w-3 h-3 inline-block"></i> أستاذ/مشرف</span>` : ''}</div>
                                    <div class="flex items-end gap-2 max-w-[85%] sm:max-w-[75%]">
                                        <div class="relative p-3.5 px-5 rounded-2xl shadow-sm text-sm font-medium leading-relaxed ${isMe ? 'bg-blue-600 text-white rounded-bl-none' : (isPrivileged ? 'bg-purple-50 border border-purple-100 text-slate-800 rounded-br-none' : 'bg-white border border-slate-200 text-slate-800 rounded-br-none')}">${chat.text}<span class="block text-[10px] mt-1.5 opacity-60 ${isMe ? 'text-blue-100 text-left' : 'text-slate-500 text-right'}">${window.formatTime(chat.timestamp)}</span></div>
                                        ${(canEdit || isMe) ? `<button onclick="window.requestDelete('${chat.id}', 'chat')" class="opacity-0 group-hover:opacity-100 text-red-400 hover:text-red-600 p-1"><i data-lucide="trash" class="w-4 h-4"></i></button>` : ''}
                                    </div>
                                </div>`;
                            }).join('')}
                        </div>
                        
                        <div class="p-4 bg-white border-t border-slate-200 z-10">
                            <form onsubmit="window.handleSendChatMessage(event)" class="flex gap-3">
                                <input type="text" id="chat-msg-input" placeholder="اكتب رسالتك..." required class="flex-grow p-4 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-emerald-500/30 text-sm font-medium">
                                <button type="submit" class="bg-emerald-600 text-white px-6 rounded-xl font-bold hover:bg-emerald-700 shadow-sm flex items-center group"><i data-lucide="send" class="w-5 h-5 rotate-180 group-hover:scale-110 transition-transform"></i></button>
                            </form>
                        </div>
                    </div>`;
                }
                
                html += `</div>`;
            }

            else if (state.currentView === 'lectures') {
                const sub = state.subjects.find(s => s.id === state.selectedSubject);
                const lecs = state.lectures.filter(l => l.subjectId === state.selectedSubject).sort((a,b)=>a.createdAt - b.createdAt);
                
                let progressHtml = '';
                if(state.user.role === 'student' && lecs.length > 0) {
                    const attendedCount = lecs.filter(l => state.user.attendedLectures?.includes(l.id)).length;
                    const percent = Math.round((attendedCount / lecs.length) * 100);
                    let colorClass = percent === 100 ? 'bg-emerald-500' : percent > 50 ? 'bg-brand-500' : 'bg-blue-500';
                    progressHtml = `<div class="bg-white p-6 sm:p-8 rounded-[2rem] border border-slate-200 shadow-sm mb-6 animate-slide-up"><div class="flex justify-between items-end mb-4"><div><h4 class="font-extrabold text-slate-800 text-lg">مستوى الإنجاز</h4><p class="text-sm text-slate-500 font-medium mt-1">إنهاء ${attendedCount} من ${lecs.length}</p></div><span class="font-black text-3xl ${colorClass.replace('bg-', 'text-')}">${percent}%</span></div><div class="w-full bg-slate-100 rounded-full h-4 overflow-hidden border border-slate-200/60"><div class="${colorClass} h-full rounded-full transition-all duration-1000" style="width: ${percent}%"></div></div></div>`;
                }

                html = `
                <div class="animate-fade-in flex-grow flex flex-col">
                    <button onclick="window.navigateTo('tabs')" class="mb-6 text-slate-500 font-bold flex items-center bg-white px-5 py-2.5 rounded-full shadow-sm w-max"><i data-lucide="arrow-right" class="w-4 h-4 ml-2"></i> رجوع للمواد</button>
                    <div class="bg-white p-8 rounded-[2rem] border border-slate-200 shadow-sm mb-4 flex items-center gap-5 relative overflow-hidden"><div class="absolute right-0 top-0 bottom-0 w-2 bg-brand-400"></div><div class="bg-brand-50 border border-brand-100 p-4 rounded-2xl"><i data-lucide="monitor-play" class="w-8 h-8 text-brand-600"></i></div><div><p class="text-slate-400 text-sm font-bold mb-1 uppercase">المحتوى التعليمي</p><h2 class="text-3xl font-black text-slate-900">${sub?.title}</h2></div></div>
                    <div class="mb-8"><button onclick="window.generateSmartQuiz()" class="w-full sm:w-auto px-6 py-3 bg-blue-50 hover:bg-blue-100 text-blue-700 font-bold rounded-xl border border-blue-200 flex items-center justify-center"><i data-lucide="sparkles" class="w-5 h-5 ml-2 text-blue-500"></i> توليد اختبار ذكي لتقييم مستواك ✨</button></div>
                    ${progressHtml}
                    ${canEdit ? `
                    <form onsubmit="event.preventDefault(); window.handleAddContent(event, 'lec')" class="bg-slate-50 p-6 sm:p-8 rounded-[2rem] border border-slate-200 mb-8 flex flex-col gap-4 items-end shadow-inner">
                        <div class="flex flex-col md:flex-row gap-4 w-full">
                            <div class="flex-grow w-full"><label class="block text-sm font-bold text-slate-700 mb-1.5 ml-1">عنوان الدرس</label><input type="text" id="lec-title" required class="w-full p-3.5 bg-white border border-slate-200 rounded-xl outline-none"></div>
                            <div class="w-full md:w-48 flex-shrink-0"><label class="block text-sm font-bold text-slate-700 mb-1.5 ml-1">النوع</label><select id="lec-type" class="w-full p-3.5 bg-white border border-slate-200 rounded-xl font-bold"><option value="video">🎥 فيديو</option><option value="pdf">📄 ملزمة PDF</option><option value="ppt">📊 عرض تقديمي</option></select></div>
                        </div>
                        <div class="flex flex-col md:flex-row gap-4 w-full items-end">
                            <div class="w-full md:w-48 flex-shrink-0">
                                <label class="block text-sm font-bold text-slate-700 mb-1.5 ml-1">طريقة الرفع</label>
                                <select id="lec-source-type" onchange="document.getElementById('lec-file-container').style.display = this.value === 'file' ? 'block' : 'none'; document.getElementById('lec-link-container').style.display = this.value === 'link' ? 'block' : 'none';" class="w-full p-3.5 bg-white border border-slate-200 rounded-xl font-bold text-slate-700">
                                    <option value="file">رفع ملف إلى Google Drive</option>
                                    <option value="link">رابط خارجي (يوتيوب/غيره)</option>
                                </select>
                            </div>
                            <div id="lec-file-container" class="flex-grow w-full">
                                <label class="block text-sm font-bold text-slate-700 mb-1.5 ml-1">اختر الملف</label>
                                <input type="file" id="lec-file" class="w-full p-2.5 bg-white border border-slate-200 rounded-xl outline-none file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-bold file:bg-brand-50 file:text-brand-700 hover:file:bg-brand-100 cursor-pointer">
                            </div>
                            <div id="lec-link-container" class="flex-grow w-full" style="display:none;">
                                <label class="block text-sm font-bold text-slate-700 mb-1.5 ml-1">الرابط المباشر</label>
                                <input type="url" id="lec-link" class="w-full p-3.5 bg-white border border-slate-200 rounded-xl outline-none" dir="ltr" placeholder="https://...">
                            </div>
                            <button type="submit" class="w-full md:w-auto h-[54px] bg-slate-900 text-white px-8 rounded-xl font-bold whitespace-nowrap hover:bg-slate-800 transition-colors shadow-md flex items-center justify-center"><i data-lucide="upload-cloud" class="w-5 h-5 ml-2"></i> إضافة المحتوى</button>
                        </div>
                    </form>
                    ` : ''}
                    
                    <div class="space-y-4">
                        ${state.uploadingLec && state.uploadingLec.show ? `
                        <div class="bg-blue-50 p-5 sm:p-6 rounded-2xl border border-blue-200 shadow-sm flex flex-col justify-between gap-3 relative overflow-hidden mb-4">
                            <div class="flex items-center gap-3">
                                <div class="bg-blue-100 text-blue-600 p-3 rounded-xl border border-blue-200"><i data-lucide="cloud-upload" class="w-6 h-6 animate-bounce"></i></div>
                                <div class="flex-grow w-full">
                                    <div class="flex justify-between items-center mb-2">
                                        <span class="font-extrabold text-lg text-blue-900">${state.uploadingLec.title}</span>
                                        <span id="upload-progress-text" class="text-blue-700 font-black text-sm">${state.uploadingLec.progress}%</span>
                                    </div>
                                    <div class="w-full bg-blue-200 rounded-full h-3 overflow-hidden border border-blue-300">
                                        <div id="upload-progress-bar" class="bg-blue-600 h-full rounded-full transition-all duration-300" style="width: ${state.uploadingLec.progress}%"></div>
                                    </div>
                                    <p id="upload-status-text" class="text-xs text-blue-800 font-bold mt-2 flex items-center"><i data-lucide="loader-2" class="w-3 h-3 ml-1 animate-spin"></i> ${state.uploadingLec.status || 'جاري الرفع إلى Google Drive...'}</p>
                                </div>
                            </div>
                        </div>` : ''}

                        ${lecs.map((lec, index) => {
                            let icon = 'play-circle', color = 'blue', text = 'مشاهدة', bgGlow = 'bg-blue-50';
                            if(lec.type === 'pdf') { icon = 'file-text'; color = 'red'; text = 'فتح الملف'; bgGlow = 'bg-red-50'; }
                            if(lec.type === 'ppt') { icon = 'presentation'; color = 'orange'; text = 'عرض'; bgGlow = 'bg-orange-50'; }
                            const isAttended = state.user.role === 'student' && state.user.attendedLectures?.includes(lec.id);
                            return `
                            <div class="bg-white p-5 sm:p-6 rounded-2xl border ${isAttended ? 'border-emerald-300 bg-emerald-50/20' : 'border-slate-200'} flex flex-col sm:flex-row justify-between items-start sm:items-center gap-5 transition-all group">
                                <div class="flex items-center gap-5"><div class="${bgGlow} text-${color}-500 p-4 rounded-2xl border border-${color}-100 group-hover:scale-110 transition-transform"><i data-lucide="${icon}" class="w-6 h-6"></i></div><div><div class="flex items-center gap-2 mb-1"><span class="text-xs font-black bg-slate-100 text-slate-500 px-2 py-0.5 rounded">#${String(index + 1).padStart(2, '0')}</span>${isAttended ? '<span class="text-xs font-bold bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded flex items-center"><i data-lucide="check-check" class="w-3 h-3 ml-1"></i> مكتمل</span>' : ''}</div><span class="font-extrabold text-lg text-slate-900">${lec.title}</span></div></div>
                                <div class="flex gap-3 w-full sm:w-auto">
                                    ${state.user.role === 'student' ? `<button onclick="window.toggleAttendance('${lec.id}')" class="px-5 py-3 rounded-xl font-bold text-sm border flex items-center flex-1 sm:flex-none transition-all ${isAttended ? 'bg-emerald-50 text-emerald-600 border-emerald-200' : 'bg-slate-50 text-slate-500 border-slate-200'}"><i data-lucide="${isAttended ? 'check-circle-2' : 'circle'}" class="w-5 h-5 ml-1.5"></i> ${isAttended ? 'مكتمل' : 'تعليم كمكتمل'}</button>` : ''}
                                    <a href="${lec.link}" target="_blank" class="flex-1 sm:flex-none justify-center text-white bg-${color}-500 px-6 py-3 rounded-xl font-bold text-sm flex items-center hover:bg-${color}-600"><i data-lucide="external-link" class="w-4 h-4 ml-1.5"></i> ${text}</a>
                                    ${canEdit ? `<button onclick="window.requestDelete('${lec.id}', 'lec')" class="text-red-400 hover:text-red-600 bg-white border border-transparent hover:border-red-100 px-4 py-3 rounded-xl transition-colors"><i data-lucide="trash-2" class="w-5 h-5"></i></button>` : ''}
                                </div>
                            </div>`}).join('')}
                        ${lecs.length === 0 ? '<div class="flex flex-col items-center justify-center py-16 bg-white rounded-3xl border border-dashed border-slate-300"><div class="bg-slate-50 p-4 rounded-full mb-4"><i data-lucide="inbox" class="w-10 h-10 text-slate-400"></i></div><p class="text-slate-500 font-bold text-lg">لم يتم رفع محتوى تعليمي بعد.</p></div>' : ''}
                    </div>
                </div>`;
            }

            container.innerHTML = html;
            if(typeof lucide !== 'undefined') lucide.createIcons();
        }

        document.addEventListener('DOMContentLoaded', renderApp);
    </script>
</body>
</html>
