<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة الجامعة التكنولوجية</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>

    <!-- استدعاء Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Tajawal', 'sans-serif'] },
                    colors: {
                        brand: { 50: '#fffbeb', 100: '#fef3c7', 200: '#fde68a', 300: '#fcd34d', 400: '#fbbf24', 500: '#f59e0b', 600: '#d97706' }
                    }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap');
        
        body { 
            background-color: #f8fafc;
            -webkit-font-smoothing: antialiased;
        }

        /* حركات الظهور الانسيابية */
        .animate-fade-in { animation: fadeIn 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        .animate-slide-up { animation: slideUp 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* حركة الخلفية لشاشة الدخول */
        .animate-blob { animation: blob 10s infinite alternate; }
        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .animation-delay-2000 { animation-delay: 2s; }
        
        /* تصميم التبويبات */
        .tab-btn { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .tab-active { background-color: white; color: #d97706; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06); font-weight: 800; border-radius: 0.75rem;}
        .tab-inactive { color: #64748b; font-weight: 500; }
        .tab-inactive:hover { color: #475569; background-color: rgba(255,255,255,0.5); }
        
        /* إخفاء شريط التمرير */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-slate-800 relative min-h-screen flex flex-col selection:bg-brand-200 selection:text-brand-900">

    <div id="app-root" class="flex-grow flex flex-col"></div>

    <script>
        // ==========================================
        // إعدادات Firebase
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyAs2wYMa4Fs5TJxLzZN616HTUaIxSb_7Bc",
            authDomain: "tulibary-d35ae.firebaseapp.com",
            databaseURL: "https://tulibary-d35ae-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "tulibary-d35ae",
            storageBucket: "tulibary-d35ae.firebasestorage.app",
            messagingSenderId: "107464097138",
            appId: "1:107464097138:web:9147008aec9c0e0fa471eb"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        
        const auth = firebase.auth();
        const db = firebase.firestore();
        const appIdStr = 'tech-library-v1';

        // --- البيانات الأساسية ---
        const defaultSpecializations = [
            { id: 'electrical', name: 'بكالوريوس هندسة كهرباء', icon: 'zap', iconColor: 'text-brand-500', bgGlow: 'bg-amber-100' },
            { id: 'civil', name: 'بكالوريوس هندسة مدنية', icon: 'hard-hat', iconColor: 'text-brand-600', bgGlow: 'bg-yellow-100' },
            { id: 'architectural', name: 'بكالوريوس هندسة معمارية', icon: 'building-2', iconColor: 'text-yellow-600', bgGlow: 'bg-orange-100' }
        ];
        
        const levels = [
            { id: 'level_1', name: 'المستوى الأول', num: '01' }, 
            { id: 'level_2', name: 'المستوى الثاني', num: '02' },
            { id: 'level_3', name: 'المستوى الثالث', num: '03' }, 
            { id: 'level_4', name: 'المستوى الرابع', num: '04' },
            { id: 'level_5', name: 'المستوى الخامس', num: '05' }
        ];

        const state = {
            isLoggedIn: false, user: null, currentView: 'home',
            selectedSpec: null, selectedLevel: null, selectedSubject: null,
            activeTab: 'references', alert: { show: false, message: '', type: 'success' },
            confirm: { show: false, id: null, type: '', message: '', extra: null },
            monitor: { specFilter: 'all', levelFilter: 'all' },
            references: [], subjects: [], lectures: [], exams: [], news: [], dbUsers: [], dynamicSpecializations: []
        };

        const getAllSpecializations = () => [...defaultSpecializations, ...state.dynamicSpecializations];

        window.canDelete = (user) => {
            if (!user) return false;
            return user.role === 'super_admin';
        };

        // --- جلب البيانات من Firestore ---
        auth.signInAnonymously().catch(err => console.error("Auth Error", err));

        auth.onAuthStateChanged((user) => {
            if (user) {
                const basePath = `artifacts/${appIdStr}/public/data`;
                db.collection(`${basePath}/references`).onSnapshot(s => { state.references = s.docs.map(d => ({ id: d.id, ...d.data() })); if (state.isLoggedIn) renderApp(); });
                db.collection(`${basePath}/subjects`).onSnapshot(s => { state.subjects = s.docs.map(d => ({ id: d.id, ...d.data() })); if (state.isLoggedIn) renderApp(); });
                db.collection(`${basePath}/lectures`).onSnapshot(s => { state.lectures = s.docs.map(d => ({ id: d.id, ...d.data() })); if (state.isLoggedIn) renderApp(); });
                db.collection(`${basePath}/exams`).onSnapshot(s => { state.exams = s.docs.map(d => ({ id: d.id, ...d.data() })); if (state.isLoggedIn) renderApp(); });
                db.collection(`${basePath}/news`).onSnapshot(s => { state.news = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b)=>b.createdAt - a.createdAt); if (state.isLoggedIn && state.currentView === 'home') renderApp(); });
                db.collection(`${basePath}/specializations`).onSnapshot(s => { state.dynamicSpecializations = s.docs.map(d => ({ docId: d.id, ...d.data() })); if (state.isLoggedIn) renderApp(); });
                db.collection(`${basePath}/users`).onSnapshot(s => { 
                    state.dbUsers = s.docs.map(d => ({ id: d.id, ...d.data() })); 
                    // تحديث بيانات المستخدم الحالي
                    if(state.user && state.user.id) {
                        const updatedUser = state.dbUsers.find(u => u.id === state.user.id);
                        if(updatedUser) state.user = { ...state.user, attendedLectures: updatedUser.attendedLectures || [] };
                    }
                    if (state.isLoggedIn && state.currentView === 'admin_dashboard') renderApp(); 
                });
            }
        });

        // --- دوال التحكم في التطبيق ---
        window.showAlert = (msg, type = 'success') => {
            state.alert = { show: true, message: msg, type }; renderApp();
            setTimeout(() => { state.alert.show = false; renderApp(); }, 3000);
        };

        window.handleLogin = (e) => {
            e.preventDefault();
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();
            const errDiv = document.getElementById('login-error');

            let matchedUser = null;

            if (u === 'ashraf' && p === '0119852715') {
                matchedUser = { id: 'super_1', username: 'م. أشرف (المدير العام)', role: 'super_admin', specialization: 'all', attendedLectures: [] };
            } else {
                const dbUser = state.dbUsers.find(user => user.username === u && user.password === p);
                if (dbUser) matchedUser = { id: dbUser.id, username: dbUser.displayName || u, role: dbUser.role, specialization: dbUser.specialization, attendedLectures: dbUser.attendedLectures || [], uniId: dbUser.uniId };
            }

            if (matchedUser) {
                state.user = matchedUser; state.isLoggedIn = true; renderApp();
            } else {
                errDiv.classList.remove('hidden'); errDiv.innerHTML = '<i data-lucide="alert-circle" class="w-4 h-4 ml-1"></i> بيانات الدخول غير صحيحة'; lucide.createIcons();
            }
        };

        window.handleLogout = () => { state.isLoggedIn = false; state.user = null; state.currentView = 'home'; renderApp(); };
        window.navigateTo = (view, spec = null, level = null, sub = null) => {
            state.currentView = view;
            if (spec) state.selectedSpec = spec; if (level) state.selectedLevel = level; if (sub) state.selectedSubject = sub;
            renderApp();
        };
        window.switchTab = (tab) => { state.activeTab = tab; renderMainContent(); };

        // --- نظام الإضافة والحذف ---
        window.requestDelete = (id, type) => {
            let msg = type === 'user' ? 'سيتم حذف حساب المستخدم نهائياً. متأكد؟' : 
                      type === 'spec' ? 'سيتم حذف القسم/التخصص نهائياً. متأكد؟' : 'سيتم الحذف نهائياً للمحتوى. متأكد؟';
            state.confirm = { show: true, id, type, message: msg }; renderApp();
        };
        window.cancelDelete = () => { state.confirm = { show: false, id: null, type: '', message: '' }; renderApp(); };
        window.executeDelete = async () => {
            if (!auth.currentUser || !state.confirm.id) return;
            const { id, type } = state.confirm;
            let collectionName = type === 'user' ? 'users' : 
                                 type === 'ref' ? 'references' : 
                                 type === 'exam' ? 'exams' : 
                                 type === 'sub' ? 'subjects' : 
                                 type === 'news' ? 'news' : 
                                 type === 'spec' ? 'specializations' : 'lectures';
            try { await db.doc(`artifacts/${appIdStr}/public/data/${collectionName}/${id}`).delete(); window.showAlert('تم الحذف'); } 
            catch (err) { window.showAlert('فشل الحذف', 'error'); } 
            finally { window.cancelDelete(); }
        };

        window.handleAddNews = async (e) => {
            e.preventDefault();
            const imgUrlEl = document.getElementById('news-image');
            try {
                await db.collection(`artifacts/${appIdStr}/public/data/news`).add({
                    title: document.getElementById('news-title').value,
                    content: document.getElementById('news-content').value,
                    imageUrl: imgUrlEl && imgUrlEl.value ? imgUrlEl.value : null,
                    author: state.user.username,
                    createdAt: Date.now()
                });
                window.showAlert('تم نشر الإعلان بنجاح'); e.target.reset();
            } catch (err) { window.showAlert('فشل النشر', 'error'); }
        };

        window.handleAddContent = async (e, type) => {
            e.preventDefault();
            const data = { spec: state.selectedSpec, level: state.selectedLevel, createdAt: Date.now() };
            let coll = '';

            if (type === 'ref') {
                coll = 'references'; data.title = document.getElementById('ref-title').value; data.author = document.getElementById('ref-author').value; data.link = document.getElementById('ref-link').value;
            } else if (type === 'exam') {
                coll = 'exams'; data.title = document.getElementById('exam-title').value; data.link = document.getElementById('exam-link').value;
            } else if (type === 'sub') {
                coll = 'subjects'; data.title = document.getElementById('sub-title').value;
            } else if (type === 'lec') {
                coll = 'lectures'; data.subjectId = state.selectedSubject; data.title = document.getElementById('lec-title').value; data.link = document.getElementById('lec-link').value; data.type = document.getElementById('lec-type').value;
            }

            try { await db.collection(`artifacts/${appIdStr}/public/data/${coll}`).add(data); window.showAlert('تمت الإضافة بنجاح'); e.target.reset(); } 
            catch (err) { window.showAlert('فشل الإضافة', 'error'); }
        };

        // إدارة الحسابات
        window.handleAddUser = async (e) => {
            e.preventDefault();
            const hasFullAccess = state.user.role === 'super_admin' || !state.user.specialization || state.user.specialization === 'all';
            const specVal = hasFullAccess ? document.getElementById('new-user-spec').value : state.user.specialization;
            const roleVal = hasFullAccess ? document.getElementById('new-user-role').value : 'student';
            const uniIdEl = document.getElementById('new-user-uni-id');
            const uniIdVal = uniIdEl ? uniIdEl.value : '';

            try {
                await db.collection(`artifacts/${appIdStr}/public/data/users`).add({
                    displayName: document.getElementById('new-user-name').value,
                    username: document.getElementById('new-user-id').value,
                    password: document.getElementById('new-user-pass').value,
                    uniId: uniIdVal,
                    role: roleVal, specialization: specVal, attendedLectures: [], createdAt: Date.now()
                });
                window.showAlert('تم إنشاء الحساب بنجاح!'); e.target.reset();
            } catch (err) { window.showAlert('فشل إنشاء الحساب', 'error'); }
        };

        window.handleAddSpecialization = async (e) => {
            e.preventDefault();
            try {
                const colorsList = ['blue', 'emerald', 'purple', 'rose', 'indigo', 'teal', 'cyan', 'brand'];
                const randomColor = colorsList[Math.floor(Math.random() * colorsList.length)];
                
                await db.collection(`artifacts/${appIdStr}/public/data/specializations`).add({
                    id: 'spec_' + Date.now(), 
                    name: document.getElementById('new-spec-title').value,
                    icon: document.getElementById('new-spec-icon').value, 
                    iconColor: `text-${randomColor}-600`, 
                    bgGlow: `bg-${randomColor}-100`, 
                    createdAt: Date.now()
                });
                window.showAlert('تم تأسيس القسم بنجاح!'); 
                e.target.reset();
            } catch (err) { 
                console.error("Add Spec Error:", err);
                window.showAlert('فشل الإضافة', 'error'); 
            }
        };

        window.toggleAttendance = async (lecId) => {
            if(!state.user || state.user.role !== 'student' || !state.user.id) return;
            const isAttended = state.user.attendedLectures?.includes(lecId);
            try {
                const userRef = db.doc(`artifacts/${appIdStr}/public/data/users/${state.user.id}`);
                if(isAttended) {
                    await userRef.update({ attendedLectures: firebase.firestore.FieldValue.arrayRemove(lecId) });
                } else {
                    await userRef.update({ attendedLectures: firebase.firestore.FieldValue.arrayUnion(lecId) });
                }
            } catch (err) { console.error("Attendance err", err); }
        };

        function refreshIcons() { if (typeof lucide !== 'undefined') lucide.createIcons(); }

        // دالة مساعدة لإنشاء صفوف التقييم
        function renderMonitorRows(specsList) {
            const hasFullAccess = state.user.role === 'super_admin' || !state.user.specialization || state.user.specialization === 'all';
            let filteredStudents = state.dbUsers.filter(u => u.role === 'student');
            
            if (!hasFullAccess) {
                filteredStudents = filteredStudents.filter(u => u.specialization === state.user.specialization);
            } else if (state.monitor.specFilter !== 'all') {
                filteredStudents = filteredStudents.filter(u => u.specialization === state.monitor.specFilter);
            }

            if(filteredStudents.length === 0) return '<tr><td colspan="5" class="p-8 text-center text-slate-400 font-bold">لا يوجد طلاب مطابقين لخيارات البحث المحددة.</td></tr>';

            let relevantSubjects = state.subjects;
            if(state.monitor.specFilter !== 'all') relevantSubjects = relevantSubjects.filter(s => s.spec === state.monitor.specFilter);
            if(state.monitor.levelFilter !== 'all') relevantSubjects = relevantSubjects.filter(s => s.level === state.monitor.levelFilter);
            
            const relevantSubjectIds = relevantSubjects.map(s => s.id);
            const relevantLectures = state.lectures.filter(l => relevantSubjectIds.includes(l.subjectId));
            const totalLecs = relevantLectures.length;

            return filteredStudents.map(student => {
                const attendedLecIds = student.attendedLectures || [];
                const attendedRelevant = relevantLectures.filter(l => attendedLecIds.includes(l.id)).length;
                
                const pct = totalLecs > 0 ? Math.round((attendedRelevant / totalLecs) * 100) : 0;
                let barColor = pct === 100 ? 'bg-emerald-500' : pct > 50 ? 'bg-brand-500' : pct > 0 ? 'bg-blue-500' : 'bg-slate-200';
                const specName = specsList.find(s => s.id === student.specialization)?.name || 'غير محدد';

                return `
                <tr class="hover:bg-slate-50/50 transition-colors border-b border-slate-100 last:border-0">
                    <td class="p-4 font-bold text-slate-800">${student.displayName}</td>
                    <td class="p-4 text-slate-500 font-mono">${student.uniId || '---'}</td>
                    <td class="p-4 text-slate-600 text-xs font-bold bg-slate-50 rounded-lg inline-block mt-2 border border-slate-100 px-2 py-1">${specName}</td>
                    <td class="p-4 font-bold text-slate-700 text-center"><span class="text-brand-600">${attendedRelevant}</span> / ${totalLecs}</td>
                    <td class="p-4">
                        <div class="flex items-center justify-end gap-3">
                            <span class="font-black w-10 text-left ${barColor.replace('bg-', 'text-')}">${pct}%</span>
                            <div class="w-32 bg-slate-100 rounded-full h-2.5 overflow-hidden"><div class="${barColor} h-full rounded-full transition-all" style="width: ${pct}%"></div></div>
                        </div>
                    </td>
                </tr>`;
            }).join('');
        }

        // ==========================================
        // بناء واجهة المستخدم
        // ==========================================
        window.renderApp = function() {
            const root = document.getElementById('app-root');
            
            if (!state.isLoggedIn) {
                root.innerHTML = `
                <div class="min-h-screen flex flex-col justify-center items-center relative overflow-hidden bg-slate-50">
                    <div class="absolute top-[-10%] right-[-5%] w-[500px] h-[500px] bg-brand-200 rounded-full mix-blend-multiply blur-3xl opacity-40 animate-blob"></div>
                    <div class="absolute bottom-[-10%] left-[-5%] w-[500px] h-[500px] bg-blue-100 rounded-full mix-blend-multiply blur-3xl opacity-40 animate-blob animation-delay-2000"></div>
                    
                    <div class="bg-white/70 backdrop-blur-2xl p-10 rounded-[2.5rem] shadow-[0_8px_30px_rgb(0,0,0,0.06)] border border-white/50 w-full max-w-md text-center z-10 animate-slide-up">
                        
                        <div class="mb-6 flex justify-center">
                            <div class="bg-white p-3 rounded-3xl shadow-lg border border-slate-100 transform hover:scale-105 transition-transform duration-300">
                                <img src="./1000327658.png" alt="شعار الجامعة" class="w-32 h-32 object-contain" onerror="this.onerror=null; this.style.display='none'; this.nextElementSibling.style.display='flex';">
                                <div class="hidden w-32 h-32 bg-gradient-to-br from-brand-400 to-brand-600 flex items-center justify-center rounded-2xl shadow-lg shadow-brand-500/30">
                                    <i data-lucide="library" class="w-12 h-12 text-white"></i>
                                </div>
                            </div>
                        </div>

                        <h2 class="text-3xl font-extrabold mb-2 text-slate-800 tracking-tight">مكتبة الجامعة <span class="text-brand-500">التكنولوجية</span></h2>
                        <p class="text-slate-500 mb-8 font-medium">سجل دخولك للوصول إلى المراجع والمقررات الدراسية</p>
                        
                        <form onsubmit="window.handleLogin(event)" class="space-y-5">
                            <div id="login-error" class="hidden text-red-600 text-sm font-bold bg-red-50 p-3 rounded-xl flex items-center justify-center border border-red-100"></div>
                            <div class="relative">
                                <div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none"><i data-lucide="user" class="h-5 w-5 text-slate-400"></i></div>
                                <input type="text" id="username" required placeholder="اسم المستخدم" class="w-full pr-11 pl-4 py-3.5 bg-white/80 border border-slate-200 rounded-xl focus:ring-4 focus:ring-brand-500/20 focus:border-brand-500 outline-none transition-all shadow-sm text-right">
                            </div>
                            <div class="relative">
                                <div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none"><i data-lucide="lock" class="h-5 w-5 text-slate-400"></i></div>
                                <input type="password" id="password" required placeholder="كلمة المرور" class="w-full pr-11 pl-4 py-3.5 bg-white/80 border border-slate-200 rounded-xl focus:ring-4 focus:ring-brand-500/20 focus:border-brand-500 outline-none transition-all shadow-sm text-right">
                            </div>
                            <button type="submit" class="w-full bg-slate-900 text-white font-bold py-4 rounded-xl hover:bg-slate-800 hover:shadow-lg hover:-translate-y-0.5 transition-all duration-200 mt-2">تسجيل الدخول</button>
                        </form>
                    </div>
                </div>`;
            } else {
                const isSuper = state.user.role === 'super_admin';
                const canEdit = ['super_admin', 'admin', 'doctor'].includes(state.user.role);
                
                root.innerHTML = `
                ${state.alert.show ? `<div class="fixed top-6 left-1/2 transform -translate-x-1/2 bg-${state.alert.type==='error'?'red':'slate'}-900 text-white px-6 py-3.5 rounded-full z-50 shadow-2xl font-bold flex items-center animate-slide-up border border-white/10"><i data-lucide="${state.alert.type==='error'?'alert-octagon':'check-circle-2'}" class="w-5 h-5 ml-2 ${state.alert.type==='error'?'text-red-400':'text-brand-400'}"></i> ${state.alert.message}</div>` : ''}
                ${state.confirm.show ? `<div class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-fade-in"><div class="bg-white rounded-3xl p-8 w-full max-w-sm shadow-2xl text-center transform scale-100"><div class="mx-auto flex h-16 w-16 rounded-full bg-red-50 border border-red-100 mb-5 items-center justify-center"><i data-lucide="alert-triangle" class="h-8 w-8 text-red-500"></i></div><h3 class="text-xl font-extrabold mb-2 text-slate-900">تأكيد الإجراء</h3><p class="text-sm text-slate-500 mb-6 font-medium">${state.confirm.message}</p><div class="flex gap-3"><button onclick="window.cancelDelete()" class="px-5 py-3 bg-slate-100 text-slate-700 rounded-xl font-bold flex-1 hover:bg-slate-200 transition-colors">إلغاء</button><button onclick="window.executeDelete()" class="px-5 py-3 bg-red-500 text-white rounded-xl font-bold flex-1 hover:bg-red-600 shadow-md shadow-red-500/20 transition-all">تأكيد</button></div></div></div>` : ''}

                <nav class="bg-white/80 backdrop-blur-xl border-b border-slate-200/60 sticky top-0 z-40">
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex justify-between items-center">
                        <div class="flex items-center cursor-pointer group" onclick="window.navigateTo('home')">
                            <img src="./1000327658.png" alt="الشعار" class="w-12 h-12 object-contain ml-3 group-hover:scale-105 transition-transform drop-shadow-sm" onerror="this.onerror=null; this.style.display='none'; this.nextElementSibling.style.display='flex';">
                            <div class="hidden bg-slate-900 p-2.5 rounded-xl ml-3 group-hover:scale-105 transition-transform shadow-md items-center justify-center">

                                    <a href="${lec.link}" target="_blank" class="flex-1 sm:flex-none justify-center text-white bg-${color}-500 px-6 py-3 rounded-xl font-bold text-sm flex items-center hover:bg-${color}-600 hover:shadow-lg hover:-translate-y-0.5 transition-all">
                                        <i data-lucide="external-link" class="w-4 h-4 ml-1.5"></i> ${text}
                                    </a>
                                    ${canEdit ? `<button onclick="window.requestDelete('${lec.id}', 'lec')" class="text-red-400 hover:text-red-600 bg-white border border-transparent hover:border-red-100 hover:bg-red-50 px-4 py-3 rounded-xl transition-colors" title="حذف المحتوى"><i data-lucide="trash-2" class="w-5 h-5"></i></button>` : ''}
                                </div>
                            </div>
                        `}).join('')}
                        ${lecs.length === 0 ? '<div class="flex flex-col items-center justify-center py-16 bg-white rounded-3xl border border-dashed border-slate-300"><div class="bg-slate-50 p-4 rounded-full mb-4"><i data-lucide="inbox" class="w-10 h-10 text-slate-400"></i></div><p class="text-slate-500 font-bold text-lg">لم يتم رفع محتوى تعليمي لهذه المادة بعد.</p></div>' : ''}
                    </div>
                </div>`;
            }

            container.innerHTML = html;
            if(typeof lucide !== 'undefined') lucide.createIcons();
        }

        document.addEventListener('DOMContentLoaded', renderApp);
    </script>
</body>
</html>
